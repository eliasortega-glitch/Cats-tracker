// Assignment entry for staff — manual quick-add, ICS/D2L import, and sync status
// --- ENTRY HUB PAGE -----------------------------------------------------------
// Combined staff and student hub: D2L import, quick add, syllabus upload + extract, saved docs
// role prop determines which sections are visible (student hides quick add)
function EntryHubPage({ onAddAssignment, sessionUser, role = "staff", students = STUDENTS }) {
  const isStudent = role === "student";
  const [activeTab, setActiveTab] = useState("d2l");

  // Resolve real Supabase UUID — mock students have integer IDs, real ones have UUIDs
  const isRealUUID = (id) => id && typeof id === "string" && id.includes("-");

  // Auto-select first real Supabase student (UUID) — fall back to first student
  const firstRealStudent = students.find(s => isRealUUID(s.id));
  const [selectedStudentId, setSelectedStudentId] = useState(firstRealStudent?.id || students[0]?.id);

  // Re-select when students prop updates with real data
  useEffect(() => {
    const real = students.find(s => isRealUUID(s.id));
    if (real && !isRealUUID(selectedStudentId)) {
      setSelectedStudentId(real.id);
    }
  }, [students]);

  // D2L import state
  const [icsUrl, setIcsUrl] = useState("");
  const [importing, setImporting] = useState(false);
  const [icsResult, setIcsResult] = useState(null);

  // Quick add state (staff only)
  const [rows, setRows] = useState([{ title: "", courseCode: "", dueDate: "", points: "" }]);
  const [quickSaved, setQuickSaved] = useState(false);

  // Syllabus state
  const [syllabusFile, setSyllabusFile] = useState("");
  const [syllabusImageBase64, setSyllabusImageBase64] = useState(null);
  const [syllabusImageMediaType, setSyllabusImageMediaType] = useState(null);
  const [syllabusCode, setSyllabusCode] = useState("");
  const [syllabusCourseName, setSyllabusCourseName] = useState("");
  const [syllabusText, setSyllabusText] = useState("");
  const [isDragging, setIsDragging] = useState(false);
  const [extracting, setExtracting] = useState(false);
  const [extractedItems, setExtractedItems] = useState([]);
  const [selectedExtracted, setSelectedExtracted] = useState({});
  const [assignmentsAdded, setAssignmentsAdded] = useState(false);
  const [syllabusUploading, setSyllabusUploading] = useState(false);
  const [syllabusSaved, setSyllabusSaved] = useState(false);

  // Saved docs state
  const [docs, setDocs] = useState([]);
  const [docsLoading, setDocsLoading] = useState(true);
  const fileRef = useRef();
  const cameraRef = useRef();

  const student = students.find(s => s.id === selectedStudentId) || students[0];

  const effectiveStudentId = isStudent
    ? (STUDENTS.find(s => s.email === sessionUser?.email)?.id || sessionUser?.studentId || null)
    : (isRealUUID(selectedStudentId) ? selectedStudentId : null);

  // For display — show which student is selected and whether they have a real UUID
  const studentHasRealId = isRealUUID(effectiveStudentId);

  useEffect(() => {
    const loadDocs = async () => {
      if (!effectiveStudentId) { setDocsLoading(false); return; }
      const d = await fetchDocumentsForStudent(effectiveStudentId);
      setDocs(d || []);
      setDocsLoading(false);
    };
    loadDocs();
  }, [effectiveStudentId]);

  // D2L import
  const handleD2LImport = async () => {
    if (!icsUrl.trim()) return;
    setImporting(true); setIcsResult(null);

    try {
      // Call Supabase Edge Function to fetch and parse the real ICS feed
      const response = await fetch(
        `${SUPABASE_URL}/functions/v1/parse-ics`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          },
          body: JSON.stringify({ icsUrl: icsUrl.trim() }),
        }
      );

      if (!response.ok) throw new Error(`Edge Function error: ${response.status}`);
      const result = await response.json();

      if (result.error) throw new Error(result.error);

      const parsed = result.assignments || [];
      if (parsed.length === 0) {
        setIcsResult({ count: 0, saved: 0, error: "No assignments found in this calendar feed. Make sure you copied the full D2L calendar URL." });
        setImporting(false);
        return;
      }

      // Save each assignment to Supabase
      let saved = 0;
      for (const a of parsed) {
        const dueDate = new Date(a.dueDate);
        const days = (dueDate - Date.now()) / 86400000;
        const urgency = days < 3 ? "red" : days < 7 ? "yellow" : "green";
        const item = {
          title: a.title,
          course: a.courseCode || a.title.split(" ").slice(0,2).join(" "),
          courseCode: a.courseCode || "",
          dueDate,
          points: a.points || 0,
          urgency,
          status: "not_started",
          description: a.description || "",
          instructions: "",
          rubric: "",
          d2lLink: a.d2lLink || "https://d2l.arizona.edu",
          studentId: effectiveStudentId,
        };
        if (onAddAssignment) await onAddAssignment(item);
        saved++;
      }

      setIcsResult({ count: parsed.length, saved });

    } catch (e) {
      console.error("D2L import failed:", e.message);
      setIcsResult({ count: 0, saved: 0, error: `Import failed: ${e.message}` });
    }

    setImporting(false);
    setIcsUrl("");
  };

  // Quick add (staff only)
  const updateRow = (i, k, v) => setRows(prev => prev.map((r, idx) => idx === i ? { ...r, [k]: v } : r));
  const handleSaveRows = () => {
    const valid = rows.filter(r => r.title.trim() && r.dueDate);
    if (!valid.length) return;
    valid.forEach(r => {
      const days = (new Date(r.dueDate) - Date.now()) / 86400000;
      const urgency = days < 3 ? "red" : days < 7 ? "yellow" : "green";
      const course = student?.courses?.find(c => c.code === r.courseCode);
      if (onAddAssignment) onAddAssignment({ id: Date.now() + Math.random(), title: r.title, course: course?.name || r.courseCode || "Other", courseCode: r.courseCode, dueDate: new Date(r.dueDate), points: parseInt(r.points) || 0, status: "not_started", urgency, description: "", instructions: "", rubric: "", d2lLink: "", studentId: effectiveStudentId });
    });
    setRows([{ title: "", courseCode: "", dueDate: "", points: "" }]);
    setQuickSaved(true); setTimeout(() => setQuickSaved(false), 2500);
  };

  // PDF/file reading
  const readFile = async (file) => {
    if (!file) return;
    if (!syllabusFile) setSyllabusFile(file.name);
    if (file.type === "application/pdf" || file.name.endsWith(".pdf")) {
      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let text = "";
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          // Group items by their Y position to preserve line breaks
          const lines = {};
          content.items.forEach(item => {
            const y = Math.round(item.transform[5]);
            if (!lines[y]) lines[y] = [];
            lines[y].push(item.str);
          });
          // Sort by Y position descending (top to bottom) and join
          const sortedYs = Object.keys(lines).map(Number).sort((a, b) => b - a);
          sortedYs.forEach(y => {
            const lineText = lines[y].join(" ").trim();
            if (lineText) text += lineText + "\n";
          });
          text += "\n";
        }
        // Clean up hyphenated words split across lines (PDF artifact)
        text = text.replace(/(\w)- \n(\w)/g, "$1$2\n");
        setSyllabusText(text.trim());
      } catch (e) {
        setSyllabusText("Could not extract text automatically. Please paste the syllabus text manually.");
      }
    } else if (file.type.startsWith("image/") || file.name.match(/\.(jpg|jpeg|png|gif|webp|heic)$/i)) {
      // IMAGE — send to Claude vision via Edge Function
      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64 = e.target.result.split(",")[1];
        const mediaType = file.type || "image/jpeg";
        setSyllabusText("📸 Image loaded — click Extract Assignments to analyze with AI vision");
        // Store base64 for extraction
        setSyllabusImageBase64(base64);
        setSyllabusImageMediaType(mediaType);
        setSyllabusFile(file.name);
      };
      reader.readAsDataURL(file);
    } else {
      const reader = new FileReader();
      reader.onload = (e) => setSyllabusText(e.target.result || "");
      reader.readAsText(file);
    }
  };

  const handleDrop = (e) => { e.preventDefault(); setIsDragging(false); if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); };

  // Extract assignments — calls Supabase Edge Function which uses Claude API server-side
  const handleExtract = async () => {
    if (!syllabusText.trim() && !syllabusImageBase64) return;
    setExtracting(true); setExtractedItems([]);

    // IMAGE MODE — send to vision API
    if (syllabusImageBase64) {
      try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/ai-breakdown-`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          },
          body: JSON.stringify({
            imageBase64: syllabusImageBase64,
            imageMediaType: syllabusImageMediaType || "image/jpeg",
          }),
        });
        const data = await response.json();
        const text = data.text || "";
        if (text) {
          try {
            const clean = text.replace(/```json|```/g, "").trim();
            const parsed = JSON.parse(clean);
            if (Array.isArray(parsed) && parsed.length > 0) {
              const items = parsed.map((item, i) => ({
                id: i, title: item.title || "Untitled",
                dueDate: item.dueDate || "", points: item.points || 0,
                description: item.description || "",
                courseCode: syllabusCode, course: syllabusCourseName,
              }));
              const sel = {};
              items.forEach((_, i) => sel[i] = true);
              setSelectedExtracted(sel);
              setExtractedItems(items);
              setExtracting(false);
              setSyllabusImageBase64(null);
              return;
            }
          } catch(e) { console.warn("JSON parse failed, trying text fallback", e.message); }
        }
      } catch(e) { console.warn("Image extraction failed:", e.message); }
      setExtracting(false);
      return;
    }

    const text = syllabusText;

    // Try Edge Function first
    const edgeResult = await callExtractSyllabus(text, syllabusCode, syllabusCourseName);
    if (edgeResult && edgeResult.length > 0) {
      const sel = {};
      edgeResult.forEach((_, i) => sel[i] = true);
      setSelectedExtracted(sel);
      setExtractedItems(edgeResult);
      setExtracting(false);
      return;
    }

    // Fallback: local regex parser
    const courseContext = syllabusCourseName || syllabusCode || "this course";

    // Local regex parser fallback
    try {
      const found = [];
      const seen = new Set();

      // Broader date pattern — catches dates anywhere in a line
      const datePattern = /(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\.?\s+\d{1,2}(?:st|nd|rd|th)?(?:,?\s*\d{4})?|\d{1,2}\/\d{1,2}(?:\/\d{2,4})?/gi;

      // Assignment keywords — look for these near dates
      const assignmentKeywords = /\b(paper|essay|exam|quiz|test|midterm|final|project|presentation|discussion|journal|entry|entries|assignment|homework|report|response|draft|submission|due|submit|turn in|deadline)\b/i;

      const typeMap = {
        exam: "Exam", test: "Exam", midterm: "Exam", final: "Exam", quiz: "Quiz",
        essay: "Essay", paper: "Essay", report: "Essay", response: "Essay", draft: "Essay",
        project: "Project", presentation: "Project",
        homework: "Homework", assignment: "Homework", submission: "Homework",
        discussion: "Discussion", journal: "Discussion", entry: "Discussion", entries: "Discussion",
        lab: "Lab", reading: "Reading",
      };

      // Strategy 1: Look for lines containing "due" keyword with a date
      const lines = text.split("\n");
      for (const line of lines) {
        const trimmed = line.trim();
        if (trimmed.length < 5 || trimmed.length > 400) continue;
        const hasDate = trimmed.match(datePattern);
        if (!hasDate) continue;

        // Parse date
        let dueDate = null;
        for (const match of trimmed.matchAll(new RegExp(datePattern.source, "gi"))) {
          try {
            const raw = match[0];
            const parsed = new Date(raw.includes("/") ? raw : raw + (raw.match(/\d{4}/) ? "" : ", 2026"));
            if (!isNaN(parsed.getTime()) && parsed.getFullYear() >= 2025) {
              dueDate = parsed.toISOString().split("T")[0];
              break;
            }
          } catch(e) { continue; }
        }
        if (!dueDate) continue;

        // Check if this line has an assignment keyword
        if (!assignmentKeywords.test(trimmed)) continue;

        // Build title — extract the assignment type and context
        let title = trimmed;
        // Remove bracketed section headers like [Short paper is due...]
        title = title.replace(/\[([^\]]+)\]/g, "$1");
        // Clean up date from title
        title = title.replace(new RegExp(datePattern.source, "gi"), "").trim();
        // Clean up common prefixes/suffixes
        title = title.replace(/^(is due on?|due on?|due|:|-|–|—)\s*/i, "").replace(/\s*(is due|due).*$/i, "").trim();
        title = title.replace(/^[,.\s\[\]]+|[,.\s\[\]]+$/g, "").trim();

        if (!title || title.length < 3 || seen.has(title.toLowerCase())) continue;
        seen.add(title.toLowerCase());

        // Detect type
        const lower = title.toLowerCase();
        let type = "Homework";
        for (const [kw, t] of Object.entries(typeMap)) { if (lower.includes(kw)) { type = t; break; } }

        const pointsMatch = trimmed.match(/(\d+)%/);
        const points = pointsMatch ? parseInt(pointsMatch[1]) : (type === "Exam" ? 100 : 25);

        found.push({ title, dueDate, points, type });
        if (found.length >= 20) break;
      }

      // Strategy 2: If nothing found from line scan, look for week headers with dates
      if (found.length === 0) {
        const weekPattern = /Week\s+\d+.*?\(([^)]+)\)/gi;
        let weekMatch;
        while ((weekMatch = weekPattern.exec(text)) !== null) {
          const dateStr = weekMatch[1];
          const dateMatch = dateStr.match(datePattern);
          if (!dateMatch) continue;
          try {
            // Use the last date in the range as due date
            const allDates = [...dateStr.matchAll(new RegExp(datePattern.source, "gi"))];
            const lastDate = allDates[allDates.length - 1]?.[0];
            if (!lastDate) continue;
            const parsed = new Date(lastDate + (lastDate.match(/\d{4}/) ? "" : ", 2026"));
            if (isNaN(parsed.getTime())) continue;
            const dueDate = parsed.toISOString().split("T")[0];
            found.push({ title: `Week ${found.length + 1} Readings`, dueDate, points: 0, type: "Reading" });
          } catch(e) { continue; }
        }
      }

      if (found.length > 0) {
        const sel = {};
        found.forEach((_, i) => sel[i] = true);
        setSelectedExtracted(sel);
        setExtractedItems(found);
      } else {
        setExtractedItems([{ title: "Could not auto-extract — check dates are in Month Day format", dueDate: new Date(Date.now() + 30*86400000).toISOString().split("T")[0], points: 0, type: "Homework" }]);
        console.warn("No assignments found. Syllabus may use unusual date formatting.");
      }
    } catch (e) {
      console.error("Extraction error:", e);
      setExtractedItems([]);
    }
    setExtracting(false);
  };

  // Toggle individual extracted assignment selection
  const toggleExtracted = (i) => setSelectedExtracted(prev => ({ ...prev, [i]: !prev[i] }));
  const selectAllExtracted = () => { const all = {}; extractedItems.forEach((_, i) => all[i] = true); setSelectedExtracted(all); };
  const selectedCount = Object.values(selectedExtracted).filter(Boolean).length;

        description: "",
        instructions: "",
        rubric: "",
        d2lLink: "https://d2l.arizona.edu",
        studentId: effectiveStudentId,
      };
      // onAddAssignment handles both state update AND Supabase insert — don't double-insert
      if (onAddAssignment) {
        await onAddAssignment(item);
      } else if (effectiveStudentId && typeof effectiveStudentId === "string" && effectiveStudentId.includes("-")) {
        await insertAssignment(item, effectiveStudentId, sessionUser?.id);
      }
    }
    setAssignmentsAdded(true);
    setTimeout(() => setAssignmentsAdded(false), 3000);
  };

  // Save syllabus document record to Supabase (assignments added separately via handleAddExtractedAssignments)
  const handleSaveSyllabus = async () => {
    if (!syllabusFile.trim()) return;
    setSyllabusUploading(true);
    console.log("Saving syllabus — effectiveStudentId:", effectiveStudentId);
    const doc = await insertDocument({ fileName: syllabusFile, courseCode: syllabusCode, courseName: syllabusCourseName, type: "Syllabus", semester: "Spring 2026", uploadedByRole: isStudent ? "student" : "staff", fileUrl: "", extractedAssignments: extractedItems }, effectiveStudentId, sessionUser?.id);
    if (doc) {
      setDocs(prev => [doc, ...prev]);
      setSyllabusSaved(true);
      // Pre-select all extracted items
      if (extractedItems.length) selectAllExtracted();
      setTimeout(() => setSyllabusSaved(false), 3000);
    } else {
      console.warn("Document insert failed — check Supabase logs. effectiveStudentId:", effectiveStudentId);
      // Save locally even if Supabase fails
      setDocs(prev => [{ id: Date.now(), file_name: syllabusFile, course_code: syllabusCode, course_name: syllabusCourseName, document_type: "Syllabus", created_at: new Date().toISOString(), uploaded_by_role: isStudent ? "student" : "staff", extracted_assignments: extractedItems }, ...prev]);
      setSyllabusSaved(true);
      if (extractedItems.length) selectAllExtracted();
      setTimeout(() => setSyllabusSaved(false), 3000);
    }
    setSyllabusUploading(false);
  };

  const inputStyle = { width: "100%", padding: "9px 12px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none", boxSizing: "border-box", background: "white" };

  const tabs = [
    { id: "d2l", label: "📅 D2L Import" },
    ...(!isStudent ? [{ id: "quickadd", label: "⚡ Quick Add" }] : []),
    ...(!isStudent ? [{ id: "courses", label: "📚 Courses" }] : []),
    { id: "syllabus", label: "📄 Syllabus" },
    { id: "saved", label: `📁 Saved (${docs.length})` },
  ];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 22 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div>
          <h2 style={{ fontSize: 22, fontWeight: 900, color: UA.text, margin: 0 }}>Add Assignments</h2>
          <p style={{ color: UA.textMuted, fontSize: 14, marginTop: 4 }}>Import assignments, upload syllabi, and manage course content{!isStudent ? " for your students" : ""}.</p>
        </div>
      </div>

      {/* Student selector — staff only */}
      {!isStudent && (
        <Card style={{ padding: "14px 18px" }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 10 }}>Working with</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
            {students.map(s => {
              const hasRealId = isRealUUID(s.id);
              return (
                <button key={s.id} onClick={() => setSelectedStudentId(s.id)}
                  style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 14px", borderRadius: 99, border: `1.5px solid ${selectedStudentId === s.id ? UA.navy : UA.border}`, background: selectedStudentId === s.id ? UA.navy : "white", cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s", opacity: hasRealId ? 1 : 0.6 }}>
                  <Avatar initials={s.initials} size={22} color={selectedStudentId === s.id ? "white" : UA.navy} />
                  <span style={{ fontSize: 13, fontWeight: 700, color: selectedStudentId === s.id ? "white" : UA.text }}>{s.name.split(" ")[0]}</span>
                  {!hasRealId && <span style={{ fontSize: 9, color: selectedStudentId === s.id ? "rgba(255,255,255,0.6)" : UA.textMuted }}>demo</span>}
                </button>
              );
            })}
          </div>
          {!studentHasRealId && (
            <div style={{ fontSize: 12, color: UA.orange, fontWeight: 600, padding: "6px 10px", borderRadius: UA.radiusSm, background: UA.orangeBg, border: `1px solid ${UA.orangeBorder}` }}>
              ⚠️ Selected student is demo data — saves will only work for real Supabase students like Cornelius Warren.
            </div>
          )}
        </Card>
      )}

      {/* Tabs */}
      <div style={{ display: "flex", gap: 0, border: `1.5px solid ${UA.border}`, borderRadius: UA.radiusSm, overflow: "hidden", alignSelf: "flex-start" }}>
        {tabs.map(t => (
          <button key={t.id} onClick={() => setActiveTab(t.id)}
            style={{ padding: "9px 18px", border: "none", borderRight: `1px solid ${UA.border}`, background: activeTab === t.id ? UA.navy : "white", color: activeTab === t.id ? "white" : UA.textMuted, fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s" }}>
            {t.label}

      {/* D2L IMPORT TAB */}
      {activeTab === "d2l" && (

          <div style={{ fontSize: 12, color: UA.textMuted, marginBottom: 14, lineHeight: 1.6 }}>
            In D2L: <strong>Calendar → Subscribe → Copy feed URL</strong>. Paste it below to import all your assignments automatically.
            {!isStudent && " Assignments will be saved under the selected student's account."}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr auto", gap: 10, marginBottom: 10 }}>
            <input value={icsUrl} onChange={e => setIcsUrl(e.target.value)}
              placeholder="https://d2l.arizona.edu/d2l/le/calendar/ics/..."

            <Btn onClick={handleD2LImport} disabled={!icsUrl.trim() || importing}>

          </div>
          {icsResult && !icsResult.error && <div style={{ fontSize: 13, color: UA.green, fontWeight: 700, marginBottom: 10 }}>✓ {icsResult.count} assignments imported from your D2L calendar and saved to your account.</div>}
          {icsResult?.error && <div style={{ fontSize: 13, color: UA.red, fontWeight: 600, marginBottom: 10 }}>⚠️ {icsResult.error}</div>}
          <div style={{ padding: "10px 14px", borderRadius: UA.radiusSm, background: "rgba(0,51,102,0.06)", fontSize: 12, color: UA.navy, lineHeight: 1.6 }}>
            <strong>D2L Sync Status:</strong> Not yet connected — IT is working on the CATSCloud integration. Manual ICS import available in the meantime.

                style={{ padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none" }}
                onFocus={e => e.target.style.borderColor = UA.navy} onBlur={e => e.target.style.borderColor = UA.border} />
              <select value={row.courseCode} onChange={e => updateRow(i, "courseCode", e.target.value)}

                <option value="">Course...</option>
                {(student?.courses || []).map(c => <option key={c.code} value={c.code}>{c.code}</option>)}

              <input type="date" value={row.dueDate} onChange={e => updateRow(i, "dueDate", e.target.value)}

            </div>

      {/* SYLLABUS TAB */}
      {activeTab === "syllabus" && (

              <label style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 4 }}>Course Code *</label>
              <input value={syllabusCode} onChange={e => setSyllabusCode(e.target.value)} placeholder="e.g. ENGL101" style={inputStyle} />
            </div>
            <div>
              <label style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 4 }}>Course Name</label>
              <input value={syllabusCourseName} onChange={e => setSyllabusCourseName(e.target.value)} placeholder="e.g. English Composition" style={inputStyle} />
            </div>

          <div style={{ marginBottom: 10 }}>
            <label style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 4 }}>File Name *</label>
            <input value={syllabusFile} onChange={e => setSyllabusFile(e.target.value)} placeholder="e.g. ENGL101 Syllabus Spring 2026.pdf" style={inputStyle} />

                    <div style={{ width: 18, height: 18, borderRadius: 4, border: `2px solid ${selectedExtracted[i] ? UA.navy : UA.navyBorder}`, background: selectedExtracted[i] ? UA.navy : "white", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>

      {/* COURSES TAB — staff only */}
      {activeTab === "courses" && !isStudent && (
        <CoursesTab
          student={student}
          effectiveStudentId={effectiveStudentId}
          studentHasRealId={studentHasRealId}
          onCoursesUpdated={(updatedCourses) => {

          docs={docs}

          syllabusCourseName={syllabusCourseName}

}

// --- GLOBAL NOTES FEED --------------------------------------------------------
// Staff sidebar Notes page — all notes across all students, reverse chronological
function GlobalNotesFeed() {
  const [filterCategory, setFilterCategory] = useState("all");
  const [notes, setNotes] = useState([]);
  const [loading, setLoading] = useState(true);
  const [briefing, setBriefing] = useState("");
  const [briefingLoading, setBriefingLoading] = useState(false);

  const generateBriefing = async () => {
    setBriefingLoading(true);
    setBriefing("");

    try {
      // Fetch recent session logs for all students
      const { data: sessionData } = await supabase
        .from("session_logs")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(30);

      // Fetch all assignments
      const { data: assignmentData } = await supabase
        .from("assignments")
        .select("student_id, title, status, due_date, updated_at")
        .order("due_date", { ascending: true });

      // Build student summaries
      const studentSummaries = STUDENTS.map(s => {
        const recentSessions = (sessionData || []).filter(l => l.student_id === s.id).slice(0, 3);
        const pastDue = (assignmentData || []).filter(a => {
          const due = new Date(a.due_date);
          const midnight = new Date(); midnight.setHours(0,0,0,0);
          return a.student_id === s.id && due < midnight && a.status !== "completed";
        });
        const studentNotes = notes.filter(n => n.studentName === s.name).slice(0, 2);
        const daysSinceSession = recentSessions[0]
          ? Math.floor((Date.now() - new Date(recentSessions[0].created_at)) / 86400000)
          : null;
        const avgUnderstanding = recentSessions.filter(l => l.understanding > 0).length > 0
          ? (recentSessions.filter(l => l.understanding > 0).reduce((sum, l) => sum + l.understanding, 0) / recentSessions.filter(l => l.understanding > 0).length).toFixed(1)
          : null;
        const avgTimeSeconds = recentSessions.length > 0
          ? Math.round(recentSessions.reduce((s, l) => s + (l.time_seconds || 0), 0) / recentSessions.length)
          : null;

        return s.name + " (" + s.sport + ", " + s.dynamicRisk + " risk)" +
          ": " + pastDue.length + " past due" +
          (daysSinceSession !== null ? ", last session " + (daysSinceSession === 0 ? "today" : daysSinceSession + " days ago") : ", no sessions logged") +
          (avgUnderstanding ? ", avg understanding " + avgUnderstanding + "/5" : "") +
          (avgTimeSeconds ? ", avg " + Math.round(avgTimeSeconds/60) + " min in Work Mode" : "") +
          (studentNotes.length > 0 ? ", recent notes: " + studentNotes.map(n => n.category + " - " + n.text.slice(0, 60)).join("; ") : "");
      }).join(" | ");

      const today = new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
      const prompt = "You are a learning specialist reviewing your student-athlete caseload before your sessions today. Your PRIMARY focus is surfacing: (1) any Concern Flags or Follow-Up Required notes from other staff, (2) students with action items that need to happen today (emails to send, assignments to submit, appointments missed), (3) students with past due work. Write 3-5 sentences maximum. Lead with the most urgent flags. Name the student and the specific issue. Be direct — this is a clinical handoff note, not a summary. Today: " + today + " | Caseload data: " + studentSummaries;

      const response = await fetch(`${SUPABASE_URL}/functions/v1/ai-breakdown-`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        },
        body: JSON.stringify({
          assignment: { title: "Session Summary Request", course: "", description: prompt },
          prompt: { question: "Generate caseload briefing", aiPrompt: prompt },
        }),
      });
      const data = await response.json();
      setBriefing(data.text || "Could not generate briefing. Try again.");
    } catch (e) {
      setBriefing("Error generating briefing: " + e.message);
    }
    setBriefingLoading(false);
  };

  const catColors = {
    "Session Note": { bg: UA.navyLight, color: UA.navy, border: UA.navyBorder },
    "Concern Flag": { bg: UA.redLight, color: UA.red, border: UA.redBorder },
    "Follow-Up Required": { bg: UA.yellowBg, color: UA.yellow, border: UA.yellowBorder },
    "Intake Observation": { bg: UA.greenBg, color: UA.green, border: UA.greenBorder },
  };

  useEffect(() => {
    const loadNotes = async () => {
      setLoading(true);
      const { data, error } = await supabase
        .from("staff_notes")
        .select("*")
        .order("created_at", { ascending: false });
      if (!error && data) {
        const enriched = data.map(n => {
          const student = STUDENTS.find(s => s.id === n.student_id);
          return {
            id: n.id,
            author: n.author,
            authorInitials: n.author_initials,
            date: n.date,
            category: n.category,
            text: n.text,
            studentName: student?.name || "Unknown Student",
            studentInitials: student?.initials || "?",
            studentRisk: student?.dynamicRisk || "low",
          };
        });
        setNotes(enriched);
      }
      setLoading(false);
    };
    loadNotes();
  }, []);

  const filtered = notes.filter(n => filterCategory === "all" || n.category === filterCategory);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between" }}>
          <SectionTitle sub="All staff notes across your caseload — most recent first">Notes Feed</SectionTitle>
        </div>

        {/* AI Morning Briefing */}
        <Card style={{ border: `1.5px solid ${UA.navyBorder}`, background: UA.navyLight, padding: "20px 24px" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: briefing ? 14 : 0 }}>
            <div>
              <div style={{ fontWeight: 800, fontSize: 14, color: UA.navy }}>☀️ AI Morning Briefing</div>
              <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 2 }}>Analyzes your full caseload — sessions, past due assignments, notes, and risk levels</div>
            </div>
            <Btn size="sm" variant="secondary" disabled={briefingLoading} onClick={generateBriefing}>
              {briefingLoading ? "Generating..." : briefing ? "Refresh" : "Generate Briefing"}
            </Btn>
          </div>
          {briefingLoading && (
            <div style={{ fontSize: 13, color: UA.textMuted, padding: "8px 0" }}>Analyzing your caseload...</div>
          )}
          {briefing && !briefingLoading && (
            <div style={{ fontSize: 13, lineHeight: 1.8, color: UA.text, whiteSpace: "pre-wrap", padding: "14px 16px", background: "white", borderRadius: UA.radiusSm, border: `1px solid ${UA.navyBorder}`, marginTop: 4 }}>{briefing}</div>
          )}
          {!briefing && !briefingLoading && (
            <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 10 }}>Click Generate Briefing each morning for an AI summary of who needs attention and why.</div>
          )}
        </Card>
      </div>
      {/* Category filter */}
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
        {["all", "Session Note", "Concern Flag", "Follow-Up Required", "Intake Observation"].map(cat => (
          <button key={cat} onClick={() => setFilterCategory(cat)}
            style={{ padding: "5px 14px", borderRadius: 99, fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", border: `1.5px solid ${filterCategory === cat ? UA.navy : UA.border}`, background: filterCategory === cat ? UA.navy : "white", color: filterCategory === cat ? "white" : UA.textMuted, transition: "all 0.15s" }}>
            {cat === "all" ? "All Notes" : cat}
          </button>
        ))}
      </div>
      {/* Notes list */}
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {filtered.map(note => {
          const c = catColors[note.category] || catColors["Session Note"];
          const riskColor = note.studentRisk === "high" ? UA.red : note.studentRisk === "medium" ? UA.yellow : UA.green;
          return (
            <div key={note.id} style={{ background: UA.bgCard, border: `1px solid ${UA.border}`, borderRadius: UA.radius, padding: "16px 20px", borderLeft: `4px solid ${c.color}`, boxShadow: UA.shadow }}>
              {/* Student + category header */}
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <Avatar initials={note.studentInitials} size={32} color={riskColor} />
                  <div>
                    <div style={{ fontSize: 13, fontWeight: 800, color: UA.text }}>{note.studentName}</div>
                    <div style={{ fontSize: 11, color: UA.textMuted }}>{note.author} · {note.date}</div>
                  </div>
                  <RiskBadge level={note.studentRisk} />
                </div>
                <span style={{ fontSize: 11, fontWeight: 700, padding: "3px 10px", borderRadius: 99, background: c.bg, color: c.color, border: `1px solid ${c.border}` }}>{note.category}</span>
              </div>
              <p style={{ fontSize: 13, color: UA.textSecondary, lineHeight: 1.7, margin: 0 }}>{note.text}</p>
            </div>
          );
        })}
        {loading && <div style={{ textAlign: "center", padding: "40px 0", color: UA.textMuted, fontSize: 13 }}>Loading notes...</div>}
        {!loading && filtered.length === 0 && <div style={{ textAlign: "center", padding: "40px 0", color: UA.textMuted }}>
          <div style={{ fontSize: 28, marginBottom: 8 }}>📝</div>
          <div style={{ fontSize: 14, fontWeight: 700, color: UA.text, marginBottom: 4 }}>No notes yet</div>
          <div style={{ fontSize: 13 }}>Notes added on student profiles will appear here.</div>
        </div>}
      </div>
    </div>
  );
}

// --- SESSION LOG TAB ----------------------------------------------------------
// Shows on student profile — every Work Mode session the student has logged.
// This is what the LS reviews before a meeting.
function SessionLogTab({ studentId, studentName = "this student" }) {
  const [logs, setLogs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [aiSummary, setAiSummary] = useState("");
  const [summaryLoading, setSummaryLoading] = useState(false);
  const [summaryError, setSummaryError] = useState("");

  const generateSummary = async () => {
    if (logs.length === 0) return;
    setSummaryLoading(true);
    setSummaryError("");
    setAiSummary("");

    // Build a compact data payload for Claude
    const avgEffort = logs.filter(l=>l.effort>0).length > 0
      ? (logs.filter(l=>l.effort>0).reduce((s,l)=>s+l.effort,0) / logs.filter(l=>l.effort>0).length).toFixed(1)
      : "not reported";
    const avgUnderstanding = logs.filter(l=>l.understanding>0).length > 0
      ? (logs.filter(l=>l.understanding>0).reduce((s,l)=>s+l.understanding,0) / logs.filter(l=>l.understanding>0).length).toFixed(1)
      : "not reported";
    const totalTime = logs.reduce((s,l)=>s+l.timeSeconds,0);
    const totalBreakdowns = logs.reduce((s,l)=>s+l.aiBreakdownsUsed,0);
    const avgPromptsOpened = logs.length > 0
      ? (logs.reduce((s,l)=>s+(l.promptsExpanded?.length||0),0) / logs.length).toFixed(1)
      : 0;
    const avgResponsesFilled = logs.length > 0
      ? (logs.reduce((s,l)=>s+l.promptResponsesFilled,0) / logs.length).toFixed(1)
      : 0;
    const lateWorkSessions = logs.filter(l=>l.daysBeforeDue !== null && l.daysBeforeDue <= 0).length;
    const recentNotes = logs.filter(l=>l.notes).slice(0,3).map(l=>`"${l.notes}"`).join(", ");
    const assignments = [...new Set(logs.map(l=>l.assignment))].join(", ");

    const prompt = "You are a learning specialist reviewing a student-athlete's academic engagement data. Write a concise clinical summary (4-6 sentences) followed by 2-3 specific, actionable recommendations for the upcoming session. Be direct and professional — this is for a staff member, not the student. Do not be generic. Use the specific numbers provided." +
      " Student: " + studentName +
      " | Sessions logged: " + logs.length +
      " | Assignments worked on: " + assignments +
      " | Total time in app: " + Math.round(totalTime/60) + " minutes" +
      " | Avg effort (self-reported 1-5): " + avgEffort +
      " | Avg understanding (self-reported 1-5): " + avgUnderstanding +
      " | Avg prompts opened per session: " + avgPromptsOpened + " of 4" +
      " | Avg written responses per session: " + avgResponsesFilled + " of 4" +
      " | AI breakdowns requested: " + totalBreakdowns +
      " | Sessions started day-of or late: " + lateWorkSessions + " of " + logs.length +
      (recentNotes ? " | Student notes from recent sessions: " + recentNotes : "") +
      " | Important context: Self-reported effort and understanding may not reflect actual engagement. Weight behavioral data (time, prompts opened, responses written) more heavily when they conflict with self-report. Flag any discrepancies explicitly.";

    try {
      const response = await fetch(`${SUPABASE_URL}/functions/v1/ai-breakdown-`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        },
        body: JSON.stringify({
          assignment: { title: "Session Summary Request", course: "", description: prompt },
          prompt: { question: "Generate clinical summary", aiPrompt: prompt },
        }),
      });
      const data = await response.json();
      const text = data.text || data.content?.[0]?.text || "";
      if (!text) throw new Error("Empty response");
      setAiSummary(text);
    } catch (e) {
      setSummaryError("Could not generate summary. Try again.");
    }
    setSummaryLoading(false);
  };

  useEffect(() => {
    const isRealUUID = studentId && typeof studentId === "string" && studentId.includes("-");
    if (!isRealUUID) { setLoading(false); return; }
    supabase.from("session_logs")
      .select("*")
      .eq("student_id", studentId)
      .order("created_at", { ascending: false })
      .then(({ data, error }) => {
        if (!error && data) {
          setLogs(data.map(l => ({
            id: l.id,
            date: new Date(l.created_at).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }),
            assignment: l.assignment_title || "—",
            timeSpent: l.duration_minutes || 0,
            effort: l.effort || 0,
            understanding: l.understanding || 0,
            completionType: l.completion_type || "in_progress",
            notes: l.notes || "",
            timeSeconds: l.time_seconds || 0,
            promptsExpanded: l.prompts_expanded || [],
            aiBreakdownsUsed: l.ai_breakdowns_used || 0,
            promptResponsesFilled: l.prompt_responses_filled || 0,
            daysBeforeDue: l.days_before_due,
          })));
        }
        setLoading(false);
      });
  }, [studentId]);

  if (loading) return <div style={{ textAlign: "center", padding: "32px 0", color: UA.textMuted, fontSize: 13 }}>Loading session logs...</div>;
  const effortColor = (v) => v >= 4 ? UA.green : v >= 3 ? UA.yellow : UA.red;

  if (logs.length === 0) return (
    <div style={{ textAlign: "center", padding: "48px 0", color: UA.textMuted, fontSize: 14 }}>
      <div style={{ fontSize: 32, marginBottom: 12 }}>📋</div>
      No work sessions logged yet for this student.
    </div>
  );

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>

      {/* AI Session Summary */}
      <Card style={{ padding: "20px 24px", border: `1.5px solid ${UA.navyBorder}`, background: UA.navyLight }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: aiSummary ? 14 : 0 }}>
          <div>
            <div style={{ fontWeight: 800, fontSize: 14, color: UA.navy }}>🧠 AI Session Summary</div>
            <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 2 }}>Interprets behavioral + self-report data and surfaces clinical insights</div>
          </div>
          <Btn size="sm" variant="secondary" disabled={summaryLoading || logs.length === 0} onClick={generateSummary}>
            {summaryLoading ? "Generating..." : aiSummary ? "Regenerate" : "Generate Summary"}
          </Btn>
        </div>
        {summaryLoading && (
          <div style={{ padding: "16px 0", color: UA.textMuted, fontSize: 13 }}>Analyzing {logs.length} sessions...</div>
        )}
        {summaryError && (
          <div style={{ color: UA.red, fontSize: 13, marginTop: 10 }}>{summaryError}</div>
        )}
        {aiSummary && !summaryLoading && (
          <div style={{ fontSize: 13, lineHeight: 1.8, color: UA.text, whiteSpace: "pre-wrap", marginTop: 4 }}>{aiSummary}</div>
        )}
        {!aiSummary && !summaryLoading && !summaryError && (
          <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 10 }}>
            Click Generate Summary to get an AI-interpreted clinical overview of this student's engagement patterns.
          </div>
        )}
      </Card>

      {/* Session log entries */}
      {logs.map(log => (
        <div key={log.id} style={{ background: UA.bgCard, border: `1px solid ${UA.border}`, borderRadius: UA.radius, padding: "18px 20px", boxShadow: UA.shadow }}>
          {/* Header */}
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 12 }}>
            <div>
              <div style={{ fontWeight: 800, fontSize: 14, color: UA.text }}>{log.assignment}</div>
              <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 3 }}>{log.date} · {log.timeSpent} min · {log.completionType.replace("_", " ")}</div>
            </div>
            <div style={{ display: "flex", gap: 8, flexShrink: 0 }}>
              <div style={{ textAlign: "center", padding: "6px 12px", borderRadius: UA.radiusSm, background: UA.bg, border: `1px solid ${UA.border}` }}>
                <div style={{ fontSize: 10, color: UA.textMuted, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.04em" }}>Effort</div>
                <div style={{ fontSize: 20, fontWeight: 900, color: effortColor(log.effort) }}>{log.effort}/5</div>
              </div>
              <div style={{ textAlign: "center", padding: "6px 12px", borderRadius: UA.radiusSm, background: UA.bg, border: `1px solid ${UA.border}` }}>
                <div style={{ fontSize: 10, color: UA.textMuted, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.04em" }}>Understanding</div>
                <div style={{ fontSize: 20, fontWeight: 900, color: effortColor(log.understanding) }}>{log.understanding}/5</div>
              </div>
            </div>
          </div>
          {/* Silent engagement row */}
          {(log.timeSeconds > 0 || log.aiBreakdownsUsed > 0 || log.promptsExpanded?.length > 0) && (
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", margin: "10px 0", padding: "10px 14px", background: UA.navyLight, borderRadius: UA.radiusSm, border: `1px solid ${UA.navyBorder}` }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: UA.navy, width: "100%", marginBottom: 4, textTransform: "uppercase", letterSpacing: "0.04em" }}>🔍 Behavioral Engagement</div>
              {[
                { label: "Time in app", value: log.timeSeconds > 0 ? `${Math.round(log.timeSeconds / 60)}m ${log.timeSeconds % 60}s` : "—" },
                { label: "Prompts opened", value: `${log.promptsExpanded?.length || 0} / 4` },
                { label: "AI breakdowns", value: log.aiBreakdownsUsed || 0 },
                { label: "Responses written", value: `${log.promptResponsesFilled || 0} / 4` },
                { label: "Days before due", value: log.daysBeforeDue !== null && log.daysBeforeDue !== undefined ? (log.daysBeforeDue <= 0 ? "Day of / overdue" : `${Math.round(log.daysBeforeDue)} days`) : "—" },
              ].map(({ label, value }) => (
                <div key={label} style={{ padding: "6px 12px", borderRadius: UA.radiusSm, background: "white", border: `1px solid ${UA.navyBorder}`, textAlign: "center", minWidth: 90 }}>
                  <div style={{ fontSize: 10, color: UA.textMuted, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 2 }}>{label}</div>
                  <div style={{ fontSize: 15, fontWeight: 800, color: UA.navy }}>{value}</div>
                </div>
              ))}
            </div>
          )}
          {/* Student notes */}
          {log.notes && (
            <div style={{ fontSize: 13, color: UA.textSecondary, lineHeight: 1.7, padding: "10px 14px", background: UA.bg, borderRadius: UA.radiusSm, borderLeft: `3px solid ${UA.navy}` }}>
              <strong style={{ color: UA.navy, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.04em" }}>Student notes: </strong>{log.notes}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

// Push-style in-app notification center. In production these would also trigger
// server-side push notifications to the student, LS, and counselor via web push API.
function NotificationBell({ notifications, onClear }) {
  const [open, setOpen] = useState(false);
  const unread = notifications.filter(n => !n.read).length;
  return (
    <div style={{ position: "relative" }}>
      <button onClick={() => setOpen(!open)} style={{ position: "relative", background: "none", border: "none", cursor: "pointer", padding: "6px 8px", borderRadius: UA.radiusSm, display: "flex", alignItems: "center", gap: 4 }}>
        <span style={{ fontSize: 20 }}>🔔</span>
        {unread > 0 && <span style={{ position: "absolute", top: 2, right: 2, width: 16, height: 16, borderRadius: "50%", background: UA.red, color: "white", fontSize: 10, fontWeight: 800, display: "flex", alignItems: "center", justifyContent: "center" }}>{unread}</span>}
      </button>
      {open && (
        <div style={{ position: "absolute", right: 0, top: 44, width: 320, background: "white", border: `1px solid ${UA.border}`, borderRadius: UA.radius, boxShadow: UA.shadowMd, zIndex: 100, overflow: "hidden" }}>
          <div style={{ padding: "12px 16px", borderBottom: `1px solid ${UA.border}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontWeight: 800, fontSize: 13, color: UA.text }}>Notifications</span>
            {unread > 0 && <button onClick={onClear} style={{ fontSize: 11, color: UA.red, background: "none", border: "none", cursor: "pointer", fontWeight: 600 }}>Mark all read</button>}
          </div>
          <div style={{ maxHeight: 320, overflowY: "auto" }}>
            {notifications.length === 0 && <div style={{ padding: "24px 16px", textAlign: "center", color: UA.textMuted, fontSize: 13 }}>No notifications</div>}
            {notifications.map(n => (
              <div key={n.id} style={{ padding: "12px 16px", borderBottom: `1px solid ${UA.border}`, background: n.read ? "white" : UA.redLight, display: "flex", gap: 10, alignItems: "flex-start" }}>
                <span style={{ fontSize: 18, flexShrink: 0 }}>{n.icon}</span>
                <div>
                  <div style={{ fontSize: 13, fontWeight: n.read ? 500 : 700, color: UA.text, lineHeight: 1.4 }}>{n.message}</div>
                  <div style={{ fontSize: 11, color: UA.textMuted, marginTop: 3 }}>{n.time}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function EditAssignmentModal({ assignment, onClose, onSave }) {
  const [form, setForm] = useState({
    title: assignment.title || "",
    course: assignment.course || "",
    courseCode: assignment.courseCode || "",
    dueDate: assignment.dueDate instanceof Date ? assignment.dueDate.toISOString().split("T")[0] : assignment.dueDate || "",
    points: String(assignment.points || ""),
    description: assignment.description || "",
    instructions: assignment.instructions || "",
    rubric: assignment.rubric || "",
  });
  const [saving, setSaving] = useState(false);
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const inp = { fontSize: 13, fontFamily: "inherit", outline: "none", boxSizing: "border-box", width: "100%", padding: "9px 12px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}` };

  const handleSave = async () => {
    if (!form.title.trim()) return;
    setSaving(true);
    const updated = {
      ...assignment,
      ...form,
      points: parseInt(form.points) || 0,
      dueDate: form.dueDate ? new Date(form.dueDate) : assignment.dueDate,
    };
    const isRealUUID = typeof assignment.id === "string" && assignment.id.includes("-") && !assignment.id.startsWith("temp-");
    if (isRealUUID) {
      await updateAssignmentInDB(assignment.id, updated);
    }
    onSave(updated);
    setSaving(false);
    onClose();
  };

  const lbl = (text) => <label style={{ fontSize: 12, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 5 }}>{text}</label>;

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <div style={{ background: "white", borderRadius: UA.radius, width: "100%", maxWidth: 560, maxHeight: "90vh", overflow: "auto", boxShadow: UA.shadowMd }}>
        <div style={{ padding: "20px 24px", borderBottom: `1px solid ${UA.border}`, display: "flex", justifyContent: "space-between", alignItems: "center", position: "sticky", top: 0, background: "white", zIndex: 1 }}>
          <div style={{ fontWeight: 800, fontSize: 16, color: UA.text }}>Edit Assignment</div>
          <button onClick={onClose} style={{ background: "none", border: "none", fontSize: 20, cursor: "pointer", color: UA.textMuted }}>✕</button>
        </div>
        <div style={{ padding: "20px 24px", display: "flex", flexDirection: "column", gap: 14 }}>
          <div>{lbl("Title *")}<input value={form.title} onChange={e => set("title", e.target.value)} style={inp} /></div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
            <div>{lbl("Course")}<input value={form.course} onChange={e => set("course", e.target.value)} style={inp} /></div>
            <div>{lbl("Course Code")}<input value={form.courseCode} onChange={e => set("courseCode", e.target.value)} style={inp} /></div>
            <div>{lbl("Due Date")}<input type="date" value={form.dueDate} onChange={e => set("dueDate", e.target.value)} style={inp} /></div>
            <div>{lbl("Points")}<input type="number" value={form.points} onChange={e => set("points", e.target.value)} style={inp} /></div>
          </div>
          <div>{lbl("Description")}<textarea value={form.description} onChange={e => set("description", e.target.value)} rows={2} style={{ ...inp, resize: "vertical" }} /></div>
          <div>{lbl("Instructions")}<textarea value={form.instructions} onChange={e => set("instructions", e.target.value)} rows={3} style={{ ...inp, resize: "vertical" }} /></div>
          <div>{lbl("Rubric")}<textarea value={form.rubric} onChange={e => set("rubric", e.target.value)} rows={2} style={{ ...inp, resize: "vertical" }} /></div>
          <div style={{ display: "flex", gap: 10, marginTop: 6 }}>
            <Btn variant="outline" fullWidth onClick={onClose}>Cancel</Btn>
            <Btn fullWidth disabled={saving || !form.title.trim()} onClick={handleSave}>{saving ? "Saving..." : "Save Changes"}</Btn>
          </div>
        </div>
      </div>
    </div>
  );
}

// Manual assignment entry form — used until D2L sync is live.
function AddAssignmentModal({ onClose, onAdd }) {
  const [form, setForm] = useState({
    title: "", course: "", courseCode: "", dueDate: "", points: "",
    description: "", instructions: "", rubric: "", status: "not_started",
  });
  const [errors, setErrors] = useState({});

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const inp = { fontSize: 13, fontFamily: "inherit", outline: "none", boxSizing: "border-box", width: "100%", padding: "9px 12px", borderRadius: UA.radiusSm };

  const validate = () => {
    const e = {};
    if (!form.title.trim()) e.title = "Required";
    if (!form.course.trim()) e.course = "Required";
    if (!form.dueDate) e.dueDate = "Required";
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const handleSubmit = () => {
    if (!validate()) return;
    const urgency = (() => {
      const days = (new Date(form.dueDate) - Date.now()) / 86400000;
      if (days < 3) return "red";
      if (days < 7) return "yellow";
      return "green";
    })();
    onAdd({ id: Date.now(), ...form, points: parseInt(form.points) || 0, dueDate: new Date(form.dueDate), urgency, d2lLink: "" });

  const lbl = (text, required) => (

      {text}{required && <span style={{ color: UA.red }}> *</span>}

    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <div style={{ background: "white", borderRadius: UA.radius, width: "100%", maxWidth: 560, maxHeight: "90vh", overflow: "auto", boxShadow: UA.shadowMd }}>
        <div style={{ padding: "20px 24px", borderBottom: `1px solid ${UA.border}`, display: "flex", justifyContent: "space-between", alignItems: "center", position: "sticky", top: 0, background: "white", zIndex: 1 }}>

          <button onClick={onClose} style={{ background: "none", border: "none", fontSize: 20, cursor: "pointer", color: UA.textMuted }}>✕</button>
        </div>
        <div style={{ padding: "20px 24px" }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 16px" }}>
            <div style={{ gridColumn: "1 / -1", marginBottom: 14 }}>
              {lbl("Assignment Title", true)}
              <input value={form.title} onChange={e => set("title", e.target.value)} placeholder="e.g. Essay: The Great Gatsby" style={{ ...inp, border: `1.5px solid ${errors.title ? UA.red : UA.border}` }} />
              {errors.title && <div style={{ fontSize: 11, color: UA.red, marginTop: 3 }}>{errors.title}</div>}
            </div>
            <div style={{ marginBottom: 14 }}>
              {lbl("Course Name", true)}
              <input value={form.course} onChange={e => set("course", e.target.value)} placeholder="e.g. English 201" style={{ ...inp, border: `1.5px solid ${errors.course ? UA.red : UA.border}` }} />
              {errors.course && <div style={{ fontSize: 11, color: UA.red, marginTop: 3 }}>{errors.course}</div>}
            </div>
            <div style={{ marginBottom: 14 }}>
              {lbl("Course Code")}
              <input value={form.courseCode} onChange={e => set("courseCode", e.target.value)} placeholder="e.g. ENG201" style={{ ...inp, border: `1.5px solid ${UA.border}` }} />
            </div>
            <div style={{ marginBottom: 14 }}>
              {lbl("Due Date", true)}
              <input type="date" value={form.dueDate} onChange={e => set("dueDate", e.target.value)} style={{ ...inp, border: `1.5px solid ${errors.dueDate ? UA.red : UA.border}` }} />
              {errors.dueDate && <div style={{ fontSize: 11, color: UA.red, marginTop: 3 }}>{errors.dueDate}</div>}
            </div>
            <div style={{ marginBottom: 14 }}>
              {lbl("Points")}
              <input type="number" value={form.points} onChange={e => set("points", e.target.value)} placeholder="e.g. 100" style={{ ...inp, border: `1.5px solid ${UA.border}` }} />
            </div>
          </div>
          <div style={{ marginBottom: 14 }}>{lbl("Description")}<textarea value={form.description} onChange={e => set("description", e.target.value)} placeholder="Brief overview of the assignment..." rows={2} style={{ ...inp, border: `1.5px solid ${UA.border}`, resize: "vertical" }} /></div>
          <div style={{ marginBottom: 14 }}>{lbl("Instructions")}<textarea value={form.instructions} onChange={e => set("instructions", e.target.value)} placeholder="What specifically does the student need to do?" rows={3} style={{ ...inp, border: `1.5px solid ${UA.border}`, resize: "vertical" }} /></div>
          <div style={{ marginBottom: 14 }}>{lbl("Rubric")}<textarea value={form.rubric} onChange={e => set("rubric", e.target.value)} placeholder="e.g. Thesis (25pts) · Analysis (30pts) · Citations (25pts) · Grammar (20pts)" rows={2} style={{ ...inp, border: `1.5px solid ${UA.border}`, resize: "vertical" }} /></div>
          <div style={{ marginBottom: 14 }}>
            {lbl("Status")}
            <select value={form.status} onChange={e => set("status", e.target.value)} style={{ ...inp, border: `1.5px solid ${UA.border}`, background: "white" }}>
              <option value="not_started">Not Started</option>
              <option value="in_progress">In Progress</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <div style={{ display: "flex", gap: 10, marginTop: 20 }}>
            <Btn variant="outline" fullWidth onClick={onClose}>Cancel</Btn>
            <Btn fullWidth onClick={handleSubmit}>Add Assignment</Btn>
          </div>
        </div>
      </div>
    </div>
  );
}
