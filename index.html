<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CATS Weekly Tracker</title>
<style>
  body { font-family: Arial, sans-serif; margin: 18px; max-width: 980px; background: #fefefe; }
  h1 { font-size: 24px; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #555; margin-bottom: 14px; }
  .meta { display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 10px 14px; margin-bottom: 20px; }
  .meta label { font-size: 12px; color: #444; display: block; margin-bottom: 4px; }
  .meta input, .meta select, .meta textarea { width: 100%; padding: 8px; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc; }
  h2 { font-size: 18px; margin: 18px 0 8px; }
  .box { border: 1px solid #ddd; border-radius: 12px; padding: 12px; background: #fff; margin-bottom: 20px; }
  .task { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; }
  .task input[type="checkbox"] { margin-top: 2px; }
  .task input[type="text"] { width: 100%; padding: 7px; border-radius: 6px; border: 1px solid #ccc; }
  textarea { width: 100%; min-height: 80px; padding: 10px; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .day { border: 1px solid #ddd; border-radius: 12px; padding: 10px; min-height: 80px; cursor: pointer; background: #fafafa; transition: background 0.2s ease; }
  .day:hover { background: #f0f0f0; }
  .day h3 { font-size: 14px; margin: 0 0 8px 0; }
  .day-tasks { display: none; margin-top: 6px; }
  .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  button { padding: 10px 12px; border: 1px solid #999; border-radius: 12px; background: #f6f6f6; cursor: pointer; }
  button:hover { background: #eee; }
  .small { font-size: 12px; color: #444; margin-top: 10px; }
  .add-task { font-size: 12px; color: #0073e6; cursor: pointer; margin-top: 4px; display: inline-block; }
  .remove-task { font-size: 12px; color: #e60000; cursor: pointer; margin-left: 6px; }
</style>
</head>
<body>

<h1>CATS Weekly Tracker</h1>
<div class="sub">Collaborative student-athlete planning. Click each day to expand tasks. Changes save automatically to the cloud.</div>

<div class="box meta">
  <div>
    <label>Student name</label>
    <input id="studentName" type="text" placeholder="First Last" />
  </div>
  <div>
    <label>Sport</label>
    <select id="sport">
      <option value="">Select sport</option>
      <option>Football</option>
      <option>Men's Basketball</option>
      <option>Women's Basketball</option>
      <option>Soccer</option>
      <option>Track & Field</option>
    </select>
  </div>
  <div>
    <label>Week of</label>
    <input id="weekOf" type="date" />
  </div>
  <div>
    <label>Counselor</label>
    <select id="counselor">
      <option value="">Select counselor</option>
      <option>Jennifer</option>
      <option>Sarah</option>
    </select>
  </div>
  <div>
    <label>Learning Specialist</label>
    <select id="ls">
      <option value="">Select LS</option>
      <option>Elias Ortega</option>
      <option>Other LS</option>
    </select>
  </div>
  <div>
    <label>Quick note</label>
    <textarea id="note" placeholder="What matters this week"></textarea>
  </div>
</div>

<h2>This Week Priorities</h2>
<div class="box" id="prioritiesBox"></div>
<span class="add-task" id="addPriority">+ Add Priority</span>

<h2>Upcoming</h2>
<textarea class="box" data-key="upcoming" placeholder="Upcoming deadlines"></textarea>

<h2>Missing</h2>
<textarea class="box" data-key="missing" placeholder="Missing assignments"></textarea>

<h2>Daily Plan</h2>
<div class="grid" id="weekGrid"></div>

<div class="actions">
  <button id="copySummary">Copy summary</button>
  <button id="resetPage">Reset this page</button>
</div>
<div class="small">Tip: Changes save automatically. Multiple users can update the tracker simultaneously.</div>

<script>
const webAppURL = "https://script.google.com/macros/s/AKfycby6NVVsDPuOT6oYJ-6Uq8_F12bqhTDCtu0to1k76T3jDTDMaaZquy-oKwFwib2qrpt-/exec";
const days = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
let prioritiesCount = 0;

// --- CREATE PRIORITIES ---
const prioritiesBox = document.getElementById("prioritiesBox");
document.getElementById("addPriority").addEventListener("click", () => {
  prioritiesCount++;
  const div = document.createElement("div");
  div.className = "task";
  div.innerHTML = `<input type="checkbox" data-key="p${prioritiesCount}_done"><input type="text" data-key="p${prioritiesCount}_text" placeholder="Priority ${prioritiesCount}"><span class="remove-task">x</span>`;
  div.querySelector(".remove-task").addEventListener("click", () => div.remove());
  prioritiesBox.appendChild(div);
});

// --- CREATE DAILY PLAN ---
function createDayColumn(dayName, dayIndex) {
  const day = document.createElement("div");
  day.className = "day";
  day.innerHTML = `<h3 class="day-header">${dayName}</h3><div class="day-tasks"></div><span class="add-task">+ Add Task</span>`;

  const container = day.querySelector(".day-tasks");
  const addBtn = day.querySelector(".add-task");
  function addTask() {
    const wrap = document.createElement("div");
    wrap.className = "task";
    wrap.innerHTML = `<input type="checkbox" data-key="d${dayIndex}_t${container.children.length+1}_done"><input type="text" data-key="d${dayIndex}_t${container.children.length+1}_text" placeholder="Task ${container.children.length+1}"><span class="remove-task">x</span>`;
    wrap.querySelector(".remove-task").addEventListener("click", () => wrap.remove());
    container.appendChild(wrap);
  }
  // Add 3 default tasks
  for(let i=0;i<3;i++) addTask();
  addBtn.addEventListener("click", addTask);

  day.querySelector(".day-header").addEventListener("click", () => {
    container.style.display = container.style.display === "none" || container.style.display === "" ? "block" : "none";
  });

  return day;
}

const grid = document.getElementById("weekGrid");
days.forEach((d,i)=> grid.appendChild(createDayColumn(d,i)));

// --- ALL FIELDS ---
function allFields() {
  return document.querySelectorAll("[data-key], #studentName, #sport, #weekOf, #counselor, #ls, #note");
}

// --- SAVE TO GOOGLE SHEET ---
async function saveAll() {
  const data = {};
  allFields().forEach(el => {
    const key = el.getAttribute("data-key") || el.id;
    data[key] = el.type === "checkbox" ? el.checked : el.value;
  });
  data["Student Name"] = document.getElementById("studentName").value;
  data["Week Of"] = document.getElementById("weekOf").value;
  await fetch(webAppURL, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data) });
}

// --- LOAD FROM GOOGLE SHEET ---
async function loadAll() {
  const resp = await fetch(webAppURL);
  const allData = await resp.json();
  const row = allData.find(r => r["Student Name"] === document.getElementById("studentName").value && r["Week Of"] === document.getElementById("weekOf").value);
  if(!row) return;
  Object.keys(row).forEach(key => {
    const el = document.querySelector(`[data-key="${key}"]`) || document.getElementById(key);
    if(!el) return;
    if(el.type==="checkbox") el.checked = row[key];
    else el.value = row[key];
  });
}

// --- AUTOSAVE ---
document.addEventListener("input", saveAll);
document.addEventListener("change", saveAll);

// --- COPY SUMMARY ---
document.getElementById("copySummary").addEventListener("click", async () => {
  await saveAll();
  let out = `Student: ${document.getElementById("studentName").value}\nWeek of: ${document.getElementById("weekOf").value}\n\nPriorities\n`;
  document.querySelectorAll("#prioritiesBox .task").forEach(t=>{
    const text = t.querySelector(`[data-key$="_text"]`).value || "";
    const done = t.querySelector(`[data-key$="_done"]`).checked ? "DONE" : "OPEN";
    if(text) out+= `${done} ${text}\n`;
  });
  out += `\nUpcoming\n${document.querySelector('[data-key="upcoming"]').value || ""}\n`;
  out += `\nMissing\n${document.querySelector('[data-key="missing"]').value || ""}\n\n`;
  days.forEach((d,di)=>{
    out += `${d}\n`;
    document.querySelectorAll(`#weekGrid .day`)[di].querySelectorAll(".task").forEach(task=>{
      const text = task.querySelector(`[data-key$="_text"]`).value || "";
      const done = task.querySelector(`[data-key$="_done"]`).checked ? "DONE" : "OPEN";
      if(text) out += `${done} ${text}\n`;
    });
    out += "\n";
  });
  navigator.clipboard.writeText(out).then(()=>alert("Copied summary!"));
});

// --- RESET PAGE ---
document.getElementById("resetPage").addEventListener("click", () => {
  if(confirm("Reset everything?")) location.reload();
});

// --- INITIAL LOAD ---
window.addEventListener("load", loadAll);
</script>

</body>
</html>
