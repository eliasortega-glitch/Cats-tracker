        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <Card>
            <div style={{ fontWeight: 800, fontSize: 14, color: UA.text, marginBottom: 14 }}>Caseload Distribution</div>
            {staff.map(s => (
              <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 0", borderBottom: `1px solid ${UA.border}` }}>
                <Avatar initials={s.initials} size={36} color={UA.navy} />
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 700, fontSize: 13, color: UA.text }}>{s.name}</div>
                  <div style={{ fontSize: 12, color: UA.textMuted }}>{s.title} · {s.room}</div>
                </div>
                <div style={{ fontSize: 13, fontWeight: 700, color: UA.navy }}>{s.students.length} students</div>
                <div style={{ display: "flex", gap: 4 }}>
                  {s.students.map(sid => {
                    const st = allStudents.find(x=>x.id===sid);
                    if (!st) return null;
                    return <Avatar key={sid} initials={st.initials} size={26} color={st.dynamicRisk==="high"?UA.red:st.dynamicRisk==="medium"?UA.yellow:UA.green} />;
                  })}
                </div>
              </div>
            ))}
          </Card>
        </div>
      )}

      {/* STUDENTS TAB */}
      {activeTab === "students" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ fontSize: 13, color: UA.textMuted }}>{allStudents.length} students in the system</div>
            <div style={{ display: "flex", gap: 8 }}>
              {studentSaved && <span style={{ fontSize: 13, color: UA.green, fontWeight: 700, alignSelf: "center" }}>✓ Student added</span>}
              <Btn size="sm" onClick={() => setShowAddStudent(!showAddStudent)}>{showAddStudent ? "✕ Cancel" : "+ Add Student"}</Btn>
            </div>
          </div>

          {showAddStudent && (
            <Card style={{ border: `1.5px solid ${UA.navyBorder}`, background: UA.navyLight }}>
              <div style={{ fontWeight: 700, fontSize: 13, color: UA.navy, marginBottom: 12 }}>Add New Student</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
                <div><label style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 4 }}>Full Name *</label>
                  <input value={newStudent.name} onChange={e=>setNewStudent(p=>({...p,name:e.target.value}))} placeholder="e.g. Jordan Smith" style={inputStyle} /></div>
                <div><label style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 4 }}>Sport *</label>
                  <input value={newStudent.sport} onChange={e=>setNewStudent(p=>({...p,sport:e.target.value}))} placeholder="e.g. Basketball" style={inputStyle} /></div>
                <div><label style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 4 }}>Academic Year</label>
                  <select value={newStudent.year} onChange={e=>setNewStudent(p=>({...p,year:e.target.value}))} style={{...inputStyle, background:"white"}}>
                    {["Freshman","Sophomore","Junior","Senior"].map(y=><option key={y}>{y}</option>)}</select></div>
                <div><label style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 4 }}>UA Email</label>
                  <input value={newStudent.email} onChange={e=>setNewStudent(p=>({...p,email:e.target.value}))} placeholder="netid@arizona.edu" style={inputStyle} /></div>
                <div><label style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 4 }}>Assign to Learning Specialist</label>
                  <select value={newStudent.assignedStaffId} onChange={e=>setNewStudent(p=>({...p,assignedStaffId:e.target.value}))} style={{...inputStyle, background:"white"}}>
                    <option value="">Unassigned</option>
                    {staff.filter(s=>s.title==="Learning Specialist").map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
                  </select></div>
                <div><label style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 4 }}>Counselor</label>
                  <input value={newStudent.counselor} onChange={e=>setNewStudent(p=>({...p,counselor:e.target.value}))} placeholder="e.g. Dr. Martinez" style={inputStyle} /></div>
              </div>
              <Btn size="sm" onClick={handleAddStudent} disabled={!newStudent.name.trim()||!newStudent.sport.trim()}>Add Student</Btn>
            </Card>
          )}

          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {allStudents.map(s => {
              const assignedTo = staff.find(st=>st.students.includes(s.id));
              return (
                <div key={s.id} style={{ background: UA.bgCard, border: `1px solid ${UA.border}`, borderRadius: UA.radius, padding: "14px 18px", display: "flex", alignItems: "center", gap: 14, boxShadow: UA.shadow }}>
                  <Avatar initials={s.initials} size={38} color={s.dynamicRisk==="high"?UA.red:s.dynamicRisk==="medium"?UA.yellow:UA.navy} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 700, fontSize: 14, color: UA.text }}>{s.name}</div>
                    <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 2 }}>{s.sport} · {s.year}</div>
                  </div>
                  <RiskBadge level={s.dynamicRisk} />
                  <div style={{ fontSize: 12, color: UA.textMuted, minWidth: 120, textAlign: "right" }}>
                    {assignedTo ? <span style={{ color: UA.navy, fontWeight: 600 }}>→ {assignedTo.name.split(" ")[1]}</span> : <span style={{ color: UA.orange, fontWeight: 600 }}>Unassigned</span>}
                  </div>
                  {assigningStudent === s.id ? (
                    <select onChange={e=>handleReassign(s.id,e.target.value)} defaultValue=""
                      style={{ padding: "6px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.navyBorder}`, fontSize: 12, fontFamily: "inherit", outline: "none", background: "white" }}>
                      <option value="" disabled>Assign to...</option>
                      {staff.filter(st=>st.title==="Learning Specialist").map(st=><option key={st.id} value={st.id}>{st.name}</option>)}
                    </select>
                  ) : (
                    <button onClick={()=>setAssigningStudent(s.id)}
                      style={{ padding: "5px 12px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, background: "white", fontSize: 12, fontWeight: 600, color: UA.textSecondary, cursor: "pointer", fontFamily: "inherit" }}>
                      Reassign
                    </button>
                  )}
                  <button onClick={()=>onSelectStudent(s)} style={{ padding: "5px 12px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.navyBorder}`, background: UA.navyLight, fontSize: 12, fontWeight: 600, color: UA.navy, cursor: "pointer", fontFamily: "inherit" }}>View →</button>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* STAFF TAB */}
      {activeTab === "staff" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ fontSize: 13, color: UA.textMuted }}>{staff.length} staff members</div>
            <div style={{ display: "flex", gap: 8 }}>
              {staffSaved && <span style={{ fontSize: 13, color: UA.green, fontWeight: 700, alignSelf: "center" }}>✓ Staff member added</span>}
              <Btn size="sm" onClick={()=>setShowAddStaff(!showAddStaff)}>{showAddStaff?"✕ Cancel":"+ Add Staff Member"}</Btn>
            </div>
          </div>

          {showAddStaff && (
            <Card style={{ border: `1.5px solid ${UA.navyBorder}`, background: UA.navyLight }}>
              <div style={{ fontWeight: 700, fontSize: 13, color: UA.navy, marginBottom: 12 }}>Add Staff Member</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
                <div><label style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 4 }}>Full Name *</label>
                  <input value={newStaff.name} onChange={e=>setNewStaff(p=>({...p,name:e.target.value}))} placeholder="e.g. Dr. Johnson" style={inputStyle} /></div>
                <div><label style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 4 }}>UA Email</label>
                  <input value={newStaff.email} onChange={e=>setNewStaff(p=>({...p,email:e.target.value}))} placeholder="netid@arizona.edu" style={inputStyle} /></div>
                <div><label style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 4 }}>Title</label>
                  <select value={newStaff.title} onChange={e=>setNewStaff(p=>({...p,title:e.target.value}))} style={{...inputStyle,background:"white"}}>
                    {["Learning Specialist","Academic Counselor","Athletic Coach","Administrator"].map(t=><option key={t}>{t}</option>)}
                  </select></div>
                <div><label style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 4 }}>Room / Office</label>
                  <input value={newStaff.room} onChange={e=>setNewStaff(p=>({...p,room:e.target.value}))} placeholder="e.g. ALS 201" style={inputStyle} /></div>
              </div>
              <Btn size="sm" onClick={handleAddStaff} disabled={!newStaff.name.trim()}>Add Staff Member</Btn>
            </Card>
          )}

          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {staff.map(s => (
              <Card key={s.id} style={{ padding: "16px 20px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: s.students.length > 0 ? 14 : 0 }}>
                  <Avatar initials={s.initials} size={44} color={UA.navy} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 800, fontSize: 15, color: UA.text }}>{s.name}</div>
                    <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 2 }}>{s.title} · {s.email} · {s.room}</div>
                  </div>
                  <span style={{ fontSize: 12, padding: "3px 10px", borderRadius: 99, background: UA.greenBg, color: UA.green, fontWeight: 700, border: `1px solid ${UA.greenBorder}` }}>Active</span>
                  <span style={{ fontSize: 13, fontWeight: 700, color: UA.navy }}>{s.students.length} students</span>
                </div>
                {s.students.length > 0 && (
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 6, paddingTop: 10, borderTop: `1px solid ${UA.border}` }}>
                    {s.students.map(sid => {
                      const st = allStudents.find(x=>x.id===sid);
                      if (!st) return null;
                      return (
                        <span key={sid} style={{ fontSize: 12, padding: "3px 10px", borderRadius: 99, background: UA.bg, border: `1px solid ${UA.border}`, color: UA.textSecondary, fontWeight: 600, display:"flex",alignItems:"center",gap:5 }}>
                          <span style={{width:6,height:6,borderRadius:"50%",background:st.dynamicRisk==="high"?UA.red:st.dynamicRisk==="medium"?UA.yellow:UA.green,flexShrink:0}}/>
                          {st.name}
                        </span>
                      );
                    })}
                  </div>
                )}
              </Card>
            ))}
          </div>
        </div>
      )}

      {/* ASSIGNMENTS TAB */}
      {activeTab === "assignments" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <div style={{ fontSize: 13, color: UA.textMuted, marginBottom: 4 }}>All assignments across the department — {ASSIGNMENTS.length} total</div>
          {ASSIGNMENTS.map(a => (
            <div key={a.id} style={{ background: UA.bgCard, border: `1px solid ${UA.border}`, borderRadius: UA.radius, padding: "14px 18px", display: "flex", alignItems: "center", gap: 14, boxShadow: UA.shadow }}>
              <div style={{ width: 4, borderRadius: 4, alignSelf: "stretch", background: a.urgency==="red"?UA.red:a.urgency==="yellow"?UA.yellow:UA.green, flexShrink: 0 }} />
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 700, fontSize: 14, color: UA.text }}>{a.title}</div>
                <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 2 }}>{a.course} · Due {a.dueDate.toLocaleDateString("en-US",{month:"short",day:"numeric"})}</div>
              </div>
              <StatusBadge status={a.status} />
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// Standalone page with student selector + ability to add custom staff markers
function RiskMarkersPage({ onSelectStudent }) {
  const [selectedId, setSelectedId] = useState(STUDENTS[0]?.id || null);
  const [customMarkers, setCustomMarkers] = useState({
    1: [{ id: 1, author: "Dr. Martinez", date: "Mar 10, 2026", category: "Academic", text: "Reading comprehension deficit noted — ACT reading sub-score 17. Recommend extended time accommodation.", severity: "high" }],
    3: [{ id: 1, author: "Dr. Chen", date: "Feb 15, 2026", category: "Engagement", text: "Chronic avoidance pattern. Cancels sessions frequently. Needs structured accountability check-ins.", severity: "high" }],
  });
  const [newMarker, setNewMarker] = useState({ category: "Academic", severity: "medium", text: "" });
  const [markerSaved, setMarkerSaved] = useState(false);

  const student = STUDENTS.find(s => s.id === selectedId);

  const markerCategories = ["Academic", "Engagement", "Attendance", "Behavioral", "Personal", "Athletic", "Financial"];
  const severityConfig = {
    high: { label: "High", bg: UA.redLight, color: UA.red, border: UA.redBorder },
    medium: { label: "Medium", bg: UA.yellowBg, color: UA.yellow, border: UA.yellowBorder },
    low: { label: "Low", bg: UA.greenBg, color: UA.green, border: UA.greenBorder },
  };

  const handleAddMarker = () => {
    if (!newMarker.text.trim()) return;
    const marker = { id: Date.now(), author: "Dr. Martinez", date: new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }), ...newMarker };
    setCustomMarkers(prev => ({ ...prev, [selectedId]: [marker, ...(prev[selectedId] || [])] }));
    setNewMarker({ category: "Academic", severity: "medium", text: "" });
    setMarkerSaved(true);
    setTimeout(() => setMarkerSaved(false), 2500);
  };

  const autoFactors = [
    { label: `${student.missedAssignments} missing assignments`, active: student.missedAssignments > 0, severity: student.missedAssignments >= 2 ? "high" : "medium" },
    { label: `Last session ${student.lastSession}`, active: student.lastSession.includes("5") || student.lastSession.includes("6") || student.lastSession === "TBD - awaiting response", severity: "high" },
    { label: `Avg understanding ${student.avgUnderstanding}/5 — below threshold`, active: student.avgUnderstanding < 3, severity: student.avgUnderstanding < 2 ? "high" : "medium" },
    { label: `Avg effort ${student.avgEffort}/5 — below threshold`, active: student.avgEffort < 3, severity: student.avgEffort < 2 ? "high" : "medium" },
    { label: "High intake risk flagged at semester start", active: student.intakeRisk === "high", severity: "high" },
    { label: "Medium intake risk — monitor closely", active: student.intakeRisk === "medium", severity: "medium" },
  ].filter(f => f.active);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 22 }}>
      <SectionTitle sub="Review and manage risk flags across your caseload">Risk Markers</SectionTitle>

      {/* Student selector */}
      <Card style={{ padding: "16px 20px" }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 10 }}>Select Student</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {STUDENTS.map(s => {
            const selected = s.id === selectedId;
            const riskColor = s.dynamicRisk === "high" ? UA.red : s.dynamicRisk === "medium" ? UA.yellow : UA.green;
            return (
              <button key={s.id} onClick={() => setSelectedId(s.id)}
                style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 14px", borderRadius: 99, border: `1.5px solid ${selected ? UA.navy : UA.border}`, background: selected ? UA.navy : "white", cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s" }}>
                <Avatar initials={s.initials} size={24} color={selected ? "white" : riskColor} />
                <span style={{ fontSize: 13, fontWeight: 700, color: selected ? "white" : UA.text }}>{s.name.split(" ")[0]}</span>
                <span style={{ width: 8, height: 8, borderRadius: "50%", background: riskColor, flexShrink: 0 }} />
              </button>
            );
          })}
        </div>
      </Card>

      {/* Selected student header */}
      <div style={{ display: "flex", alignItems: "center", gap: 14, padding: "16px 20px", background: UA.navyLight, border: `1.5px solid ${UA.navyBorder}`, borderRadius: UA.radius }}>
        <Avatar initials={student.initials} size={44} color={student.dynamicRisk === "high" ? UA.red : student.dynamicRisk === "medium" ? UA.yellow : UA.navy} />
        <div style={{ flex: 1 }}>
          <div style={{ fontWeight: 900, fontSize: 16, color: UA.text }}>{student.name}</div>
          <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 2 }}>{student.sport} · {student.year} · GPA {student.gpa}</div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <div style={{ textAlign: "center", padding: "6px 14px", borderRadius: UA.radiusSm, background: "white", border: `1px solid ${UA.navyBorder}` }}>
            <div style={{ fontSize: 10, color: UA.textMuted, fontWeight: 600, textTransform: "uppercase" }}>Intake</div>
            <RiskBadge level={student.intakeRisk} />
          </div>
          <div style={{ textAlign: "center", padding: "6px 14px", borderRadius: UA.radiusSm, background: "white", border: `1px solid ${UA.navyBorder}` }}>
            <div style={{ fontSize: 10, color: UA.textMuted, fontWeight: 600, textTransform: "uppercase", marginBottom: 4 }}>Current</div>
            <RiskBadge level={student.dynamicRisk} score={student.riskScore} />
          </div>
        </div>
        <button onClick={() => onSelectStudent(student)} style={{ padding: "8px 16px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.navyBorder}`, background: "white", color: UA.navy, fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>
          View Full Profile →
        </button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18 }}>
        {/* Auto-calculated risk factors */}
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div style={{ fontWeight: 800, fontSize: 14, color: UA.text }}>Auto-Calculated Risk Factors</div>
          <div style={{ fontSize: 12, color: UA.textMuted }}>Generated from assignment data, session logs, and engagement ratings</div>
          {autoFactors.length === 0 ? (
            <Card style={{ background: UA.greenBg, border: `1px solid ${UA.greenBorder}` }}>
              <div style={{ fontSize: 13, color: UA.green, fontWeight: 700 }}>✓ No active risk factors for this student</div>
            </Card>
          ) : autoFactors.map((f, i) => {
            const sc = severityConfig[f.severity];
            return (
              <div key={i} style={{ display: "flex", alignItems: "flex-start", gap: 12, padding: "12px 16px", borderRadius: UA.radiusSm, background: sc.bg, border: `1px solid ${sc.border}` }}>
                <span style={{ width: 20, height: 20, borderRadius: "50%", background: sc.color, color: "white", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 800, flexShrink: 0, marginTop: 1 }}>!</span>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: UA.text }}>{f.label}</div>
                  <span style={{ fontSize: 11, fontWeight: 700, color: sc.color }}>{sc.label} severity</span>
                </div>
              </div>
            );
          })}

          {/* Intervention checklist */}
          <Card style={{ marginTop: 4 }}>
            <div style={{ fontWeight: 800, fontSize: 13, color: UA.text, marginBottom: 12 }}>Recommended Interventions</div>
            {["Schedule additional LS session this week", "Tutoring referral — identify lowest-rated course", "Email outreach to student", "Notify academic advisor", "Contact coach liaison"].map((item, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 12px", borderRadius: UA.radiusSm, background: UA.bg, border: `1px solid ${UA.border}`, marginBottom: 6, fontSize: 13, color: UA.text }}>
                <input type="checkbox" style={{ accentColor: UA.red, width: 15, height: 15, cursor: "pointer" }} />
                {item}
              </div>
            ))}
          </Card>
        </div>

        {/* Staff-added custom markers */}
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div style={{ fontWeight: 800, fontSize: 14, color: UA.text }}>Staff Risk Markers</div>
          <div style={{ fontSize: 12, color: UA.textMuted }}>Add your own clinical observations and risk flags</div>

          {/* Add marker form */}
          <Card>
            <div style={{ fontWeight: 700, fontSize: 13, color: UA.text, marginBottom: 12 }}>+ Add Marker</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
              <select value={newMarker.category} onChange={e => setNewMarker(p => ({ ...p, category: e.target.value }))}
                style={{ padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none", background: "white" }}>
                {markerCategories.map(c => <option key={c}>{c}</option>)}
              </select>
              <select value={newMarker.severity} onChange={e => setNewMarker(p => ({ ...p, severity: e.target.value }))}
                style={{ padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none", background: "white" }}>
                <option value="high">High Severity</option>
                <option value="medium">Medium Severity</option>
                <option value="low">Low Severity</option>
              </select>
            </div>
            <textarea value={newMarker.text} onChange={e => setNewMarker(p => ({ ...p, text: e.target.value }))}
              placeholder="Describe the risk factor or clinical observation..." rows={3}
              style={{ width: "100%", padding: "9px 12px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", resize: "none", outline: "none", boxSizing: "border-box", lineHeight: 1.6, marginBottom: 10 }}
              onFocus={e => e.target.style.borderColor = UA.navy} onBlur={e => e.target.style.borderColor = UA.border} />
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <Btn size="sm" onClick={handleAddMarker} disabled={!newMarker.text.trim()}>Add Marker</Btn>
              {markerSaved && <span style={{ fontSize: 12, color: UA.green, fontWeight: 700 }}>✓ Marker added</span>}
            </div>
          </Card>

          {/* Existing custom markers */}
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {(customMarkers[selectedId] || []).map(marker => {
              const sc = severityConfig[marker.severity] || severityConfig.medium;
              return (
                <div key={marker.id} style={{ background: UA.bgCard, border: `1px solid ${UA.border}`, borderRadius: UA.radius, padding: "14px 18px", borderLeft: `4px solid ${sc.color}` }}>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
                    <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                      <span style={{ fontSize: 11, fontWeight: 700, padding: "2px 8px", borderRadius: 99, background: sc.bg, color: sc.color, border: `1px solid ${sc.border}` }}>{marker.category}</span>
                      <span style={{ fontSize: 11, fontWeight: 700, color: sc.color }}>{sc.label}</span>
                    </div>
                    <div style={{ fontSize: 11, color: UA.textMuted }}>{marker.author} · {marker.date}</div>
                  </div>
                  <p style={{ fontSize: 13, color: UA.textSecondary, lineHeight: 1.7, margin: 0 }}>{marker.text}</p>
                </div>
              );
            })}
            {!(customMarkers[selectedId] || []).length && (
              <div style={{ textAlign: "center", padding: "24px 0", color: UA.textMuted, fontSize: 13 }}>No staff markers added yet</div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// --- SAVED DOCS TAB -----------------------------------------------------------
// Reusable component used in Entry Hub Saved tab and Student Profile Documents tab.
// Supports extract, add assignments with checkboxes, and delete per document.
function SavedDocsTab({ docs, setDocs, student, onAddAssignment, effectiveStudentId, sessionUser, isStudent }) {
  const [expandedDoc, setExpandedDoc] = useState(null);
  const [docState, setDocState] = useState({}); // per doc: { items, selected, added, extracting, showPaste, pasteText }

  const isRealUUID = (id) => id && typeof id === "string" && id.includes("-");

  const getDocState = (docId) => docState[docId] || { items: [], selected: {}, added: false, extracting: false, showPaste: false, pasteText: "" };
  const setDs = (docId, patch) => setDocState(prev => ({ ...prev, [docId]: { ...getDocState(docId), ...patch } }));

  const handleDelete = async (docId) => {
    if (!window.confirm("Delete this document?")) return;
    if (isRealUUID(docId)) {
      const { error } = await supabase.from("documents").delete().eq("id", docId);
      if (error) {
        console.error("Delete failed:", error.message);
        alert("Delete failed: " + error.message);
        return;
      }
      console.log("✅ Document deleted from Supabase:", docId);
    }
    setDocs(prev => prev.filter(d => d.id !== docId));
    if (expandedDoc === docId) setExpandedDoc(null);
  };

  const localExtract = (text, courseCode) => {
    const found = [];
    const seen = new Set();
    const datePattern = /(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\.?\s+\d{1,2}(?:,?\s*\d{4})?|\d{1,2}\/\d{1,2}(?:\/\d{2,4})?/gi;
    const typeMap = { exam:"Exam",test:"Exam",midterm:"Exam",final:"Exam",quiz:"Quiz",essay:"Essay",paper:"Essay",report:"Essay",project:"Project",presentation:"Project",homework:"Homework",assignment:"Homework",discussion:"Homework",lab:"Homework",reading:"Homework" };
    const lines = text.split("\n");
    for (const line of lines) {
      const trimmed = line.trim();
      if (trimmed.length < 5 || trimmed.length > 200) continue;
      const dateMatch = trimmed.match(datePattern);
      if (!dateMatch) continue;
      let dueDate = null;
      try {
        const raw = dateMatch[0];
        const parsed = new Date(raw.includes("/") ? raw : raw + (raw.match(/\d{4}/) ? "" : ", 2026"));
        if (!isNaN(parsed.getTime()) && parsed.getFullYear() >= 2024) dueDate = parsed.toISOString().split("T")[0];
      } catch(e) { continue; }
      if (!dueDate) continue;
      let title = trimmed.replace(dateMatch[0], "").replace(/[:\-–—|]+/g, " ").replace(/\s+/g, " ").trim().replace(/^[,.\s]+|[,.\s]+$/g, "");
      if (!title || title.length < 3 || seen.has(title.toLowerCase())) continue;
      seen.add(title.toLowerCase());
      const lower = title.toLowerCase();
      let type = "Homework";
      for (const [kw, t] of Object.entries(typeMap)) { if (lower.includes(kw)) { type = t; break; } }
      const pointsMatch = trimmed.match(/(\d+)\s*(?:pts?|points?)/i);
      const points = pointsMatch ? parseInt(pointsMatch[1]) : (type === "Exam" ? 100 : 25);
      found.push({ title, dueDate, points, type });
      if (found.length >= 20) break;
    }
    return found;
  };

  const handleExtract = async (doc) => {
    const ds = getDocState(doc.id);
    const text = ds.pasteText || "";
    if (!text.trim()) { setDs(doc.id, { showPaste: true }); return; }
    setDs(doc.id, { extracting: true });

    let found = [];
    // Call Edge Function (server-side, no CORS)
    const edgeResult = await callExtractSyllabus(text, doc.course_code, doc.course_name);
    if (edgeResult && edgeResult.length > 0) {
      found = edgeResult;
    } else {
      // Fallback to regex
      found = localExtract(text, doc.course_code);
    }

    const selected = {};
    found.forEach((_, i) => selected[i] = true);
    setDs(doc.id, { items: found, selected, extracting: false, showPaste: false });
  };

  const handleAddAssignments = async (doc) => {
    const ds = getDocState(doc.id);
    const toAdd = ds.items.filter((_, i) => ds.selected[i]);
    if (!toAdd.length) return;
    for (const a of toAdd) {
      const dueDateObj = a.dueDate instanceof Date ? a.dueDate : new Date(a.dueDate);
      const days = (dueDateObj - Date.now()) / 86400000;
      const urgency = days < 3 ? "red" : days < 7 ? "yellow" : "green";
      const item = {
        id: `doc-${Date.now()}-${Math.random()}`,
        title: a.title, course: doc.course_name || doc.course_code || "Course",
        courseCode: doc.course_code || "", dueDate: dueDateObj,
        points: a.points || 0, urgency, status: "not_started",
        description: "", instructions: "", rubric: "",
        d2lLink: "https://d2l.arizona.edu", studentId: effectiveStudentId,
      };
      if (onAddAssignment) {
        // onAddAssignment handles both state update AND Supabase insert
        await onAddAssignment(item);
      } else if (isRealUUID(effectiveStudentId)) {
        // No callback — insert directly as fallback
        await insertAssignment(item, effectiveStudentId, sessionUser?.id);
      }
    }
    setDs(doc.id, { added: true });
    setTimeout(() => setDs(doc.id, { added: false }), 3000);
  };

  const toggleItem = (docId, i) => {
    const ds = getDocState(docId);
    setDs(docId, { selected: { ...ds.selected, [i]: !ds.selected[i] } });
  };

  const selectAll = (docId, items) => {
    const all = {};
    items.forEach((_, i) => all[i] = true);
    setDs(docId, { selected: all });
  };

  if (docs.length === 0) return (
    <div style={{ textAlign: "center", padding: "48px 0", color: UA.textMuted }}>
      <div style={{ fontSize: 36, marginBottom: 12 }}>📄</div>
      <div style={{ fontSize: 14, fontWeight: 700, color: UA.text, marginBottom: 4 }}>No documents saved yet</div>
      <div style={{ fontSize: 13 }}>Upload a syllabus in the Syllabus tab to get started</div>
    </div>
  );

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      {docs.map(doc => {
        const isExpanded = expandedDoc === doc.id;
        const ds = getDocState(doc.id);
        const storedItems = doc.extracted_assignments || [];
        const displayItems = ds.items.length > 0 ? ds.items : storedItems;
        const selCount = Object.values(ds.selected).filter(Boolean).length;

        return (
          <div key={doc.id} style={{ background: "white", border: `1px solid ${isExpanded ? UA.navy : UA.border}`, borderRadius: UA.radius, overflow: "hidden", transition: "border-color 0.15s" }}>
            {/* Header row */}
            <div style={{ display: "flex", alignItems: "center", gap: 14, padding: "14px 18px" }}>
              <span style={{ fontSize: 26, flexShrink: 0 }}>📄</span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 700, fontSize: 14, color: UA.text, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{doc.file_name}</div>
                <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 2 }}>
                  {doc.course_code && `${doc.course_code} · `}
                  {doc.document_type} · {new Date(doc.created_at).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })}
                  {storedItems.length > 0 && ` · ${storedItems.length} assignments stored`}
                </div>
              </div>
              <div style={{ display: "flex", gap: 8, flexShrink: 0 }}>
                <button onClick={() => setExpandedDoc(isExpanded ? null : doc.id)}
                  style={{ padding: "5px 12px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.navyBorder}`, background: isExpanded ? UA.navy : UA.navyLight, color: isExpanded ? "white" : UA.navy, fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>
                  {isExpanded ? "Close" : "Open →"}
                </button>
                <button onClick={() => handleDelete(doc.id)}
                  style={{ padding: "5px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.redBorder}`, background: UA.redLight, color: UA.red, fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>🗑</button>
              </div>
            </div>

            {/* Expanded panel */}
            {isExpanded && (
              <div style={{ borderTop: `1px solid ${UA.border}`, padding: "16px 18px", background: "#F8F9FB" }}>

                {/* Extract section */}
                <div style={{ marginBottom: 16, padding: "12px 16px", borderRadius: UA.radiusSm, background: UA.navyLight, border: `1.5px solid ${UA.navyBorder}` }}>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: ds.showPaste ? 10 : 0 }}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: UA.navy }}>✨ Extract Assignments from Syllabus</div>
                    <button onClick={() => handleExtract(doc)} disabled={ds.extracting}
                      style={{ padding: "5px 14px", borderRadius: UA.radiusSm, border: "none", background: UA.navy, color: "white", fontSize: 12, fontWeight: 700, cursor: ds.extracting ? "wait" : "pointer", fontFamily: "inherit" }}>
                      {ds.extracting ? "Extracting..." : ds.showPaste ? "Run Extract" : "Extract →"}
                    </button>
                  </div>
                  {!ds.showPaste && !ds.extracting && displayItems.length === 0 && (
                    <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 6 }}>Paste the syllabus text below and click Extract → to pull out assignments and due dates.</div>
                  )}
                  {(ds.showPaste || displayItems.length === 0) && (
                    <textarea value={ds.pasteText} onChange={e => setDs(doc.id, { pasteText: e.target.value, showPaste: true })}
                      placeholder="Paste syllabus text here to extract assignments..."
                      rows={4}
                      style={{ width: "100%", marginTop: 8, padding: "8px 12px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.navyBorder}`, fontSize: 12, fontFamily: "inherit", resize: "vertical", outline: "none", boxSizing: "border-box" }} />
                  )}
                </div>

                {/* Assignments list */}
                {displayItems.length > 0 && (
                  <>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
                      <div style={{ fontWeight: 700, fontSize: 13, color: UA.text }}>{displayItems.length} assignments — select to add</div>
                      <button onClick={() => selectAll(doc.id, displayItems)}
                        style={{ fontSize: 11, fontWeight: 700, color: UA.navy, background: "white", border: `1px solid ${UA.navyBorder}`, borderRadius: 6, padding: "3px 10px", cursor: "pointer", fontFamily: "inherit" }}>Select All</button>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 5, marginBottom: 12 }}>
                      {displayItems.map((a, i) => (
                        <div key={i} onClick={() => toggleItem(doc.id, i)}
                          style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 12px", borderRadius: UA.radiusSm, background: ds.selected[i] ? "white" : "rgba(255,255,255,0.5)", border: `1.5px solid ${ds.selected[i] ? UA.navy : UA.border}`, cursor: "pointer", transition: "all 0.1s" }}>
                          <div style={{ width: 17, height: 17, borderRadius: 4, border: `2px solid ${ds.selected[i] ? UA.navy : UA.border}`, background: ds.selected[i] ? UA.navy : "white", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                            {ds.selected[i] && <span style={{ color: "white", fontSize: 10, fontWeight: 900 }}>✓</span>}
                          </div>
                          <div style={{ flex: 1, fontSize: 13 }}>
                            <span style={{ fontWeight: 700, color: UA.text }}>{a.title}</span>
                            <span style={{ color: UA.textMuted }}> · {a.type} · {a.points}pts</span>
                          </div>
                          <span style={{ fontSize: 11, color: UA.textMuted, flexShrink: 0 }}>{new Date(a.dueDate).toLocaleDateString("en-US", { month: "short", day: "numeric" })}</span>
                        </div>
                      ))}
                    </div>
                    <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                      <button onClick={() => handleAddAssignments(doc)} disabled={selCount === 0}
                        style={{ padding: "9px 18px", borderRadius: UA.radiusSm, border: "none", background: selCount > 0 ? UA.navy : UA.border, color: "white", fontSize: 13, fontWeight: 700, cursor: selCount > 0 ? "pointer" : "not-allowed", fontFamily: "inherit" }}>
                        + Add {selCount > 0 ? `${selCount} ` : ""}Assignment{selCount !== 1 ? "s" : ""} to {student?.name?.split(" ")[0] || "Student"}
                      </button>
                      {ds.added && <span style={{ fontSize: 13, color: UA.green, fontWeight: 700 }}>✓ Added to assignment list</span>}
                    </div>
                  </>
                )}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}



// --- COURSES TAB --------------------------------------------------------------
// Staff can add/edit/remove courses for any student directly in Entry Hub.
// Saves to the students.courses JSONB column in Supabase.
function CoursesTab({ student, effectiveStudentId, studentHasRealId, onCoursesUpdated }) {
  const [courses, setCourses] = useState(student?.courses || []);
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);
  const [newCourse, setNewCourse] = useState({ code: "", name: "", credits: "3" });
  const [adding, setAdding] = useState(false);
  const inp = { padding: "9px 12px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none", boxSizing: "border-box" };

  const saveCourses = async (updated) => {
    setSaving(true);
    if (studentHasRealId) {
      const { error } = await supabase
        .from("students")
        .update({ courses: updated })
        .eq("students", effectiveStudentId);
      if (error) console.warn("Courses save failed:", error.message);
      else { setSaved(true); setTimeout(() => setSaved(false), 2500); }
    }
    if (onCoursesUpdated) onCoursesUpdated(updated);
    setSaving(false);
  };

  const handleAdd = async () => {
    if (!newCourse.code.trim() || !newCourse.name.trim()) return;
    const updated = [...courses, {
      code: newCourse.code.trim().toUpperCase(),
      name: newCourse.name.trim(),
      credits: parseInt(newCourse.credits) || 3,
    }];
    setCourses(updated);
    setNewCourse({ code: "", name: "", credits: "3" });
    setAdding(false);
    await saveCourses(updated);
  };

  const handleRemove = async (code) => {
    if (!window.confirm(`Remove ${code} from this student's courses?`)) return;
    const updated = courses.filter(c => c.code !== code);
    setCourses(updated);
    await saveCourses(updated);
  };

  return (
    <Card>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
        <div>
          <div style={{ fontWeight: 800, fontSize: 14, color: UA.text }}>📚 Courses for {student?.name?.split(" ")[0] || "Student"}</div>
          <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 2 }}>Add courses here to enable course filtering and Quick Add dropdowns</div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          {saved && <span style={{ fontSize: 13, color: UA.green, fontWeight: 700 }}>✓ Saved</span>}
          {!studentHasRealId && <span style={{ fontSize: 12, color: UA.orange, fontWeight: 600 }}>⚠️ Select a real student first</span>}
          <Btn size="sm" onClick={() => setAdding(!adding)} disabled={!studentHasRealId}>{adding ? "✕ Cancel" : "+ Add Course"}</Btn>
        </div>
      </div>

      {/* Add course form */}
      {adding && (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 2fr 80px auto", gap: 10, marginBottom: 16, padding: "14px 16px", background: UA.navyLight, borderRadius: UA.radiusSm, border: `1.5px solid ${UA.navyBorder}` }}>
          <div>
            <div style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, marginBottom: 4 }}>CODE *</div>
            <input value={newCourse.code} onChange={e => setNewCourse(p => ({ ...p, code: e.target.value }))}
              placeholder="e.g. SOC101" style={{ ...inp, width: "100%" }}
              onKeyDown={e => e.key === "Enter" && handleAdd()} />
          </div>
          <div>
            <div style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, marginBottom: 4 }}>COURSE NAME *</div>
            <input value={newCourse.name} onChange={e => setNewCourse(p => ({ ...p, name: e.target.value }))}
              placeholder="e.g. Introduction to Sociology" style={{ ...inp, width: "100%" }}
              onKeyDown={e => e.key === "Enter" && handleAdd()} />
          </div>
          <div>
            <div style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, marginBottom: 4 }}>CREDITS</div>
            <input type="number" value={newCourse.credits} onChange={e => setNewCourse(p => ({ ...p, credits: e.target.value }))}
              min="1" max="6" style={{ ...inp, width: "100%" }} />
          </div>
          <div style={{ display: "flex", alignItems: "flex-end" }}>
            <Btn size="sm" disabled={!newCourse.code.trim() || !newCourse.name.trim() || saving} onClick={handleAdd}>
              {saving ? "..." : "Add"}
            </Btn>
          </div>
        </div>
      )}

      {/* Course list */}
      {courses.length === 0 ? (
        <div style={{ textAlign: "center", padding: "32px 0", color: UA.textMuted }}>
          <div style={{ fontSize: 28, marginBottom: 8 }}>📚</div>
          <div style={{ fontSize: 14, fontWeight: 700, color: UA.text, marginBottom: 4 }}>No courses added yet</div>
          <div style={{ fontSize: 13 }}>Click + Add Course to add this student{"’"}s current semester courses</div>
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 12 }}>
          {/* Header */}
          <div style={{ display: "grid", gridTemplateColumns: "100px 1fr 80px 40px", gap: 12, padding: "6px 12px" }}>
            {["Code", "Course Name", "Credits", ""].map((h, i) => (
              <div key={i} style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, textTransform: "uppercase", letterSpacing: "0.04em" }}>{h}</div>
            ))}
          </div>
          {courses.map((c, i) => (
            <div key={c.code} style={{ display: "grid", gridTemplateColumns: "100px 1fr 80px 40px", gap: 12, padding: "12px 14px", borderRadius: UA.radiusSm, background: i % 2 === 0 ? UA.bg : "white", border: `1px solid ${UA.border}`, alignItems: "center" }}>
              <div style={{ fontWeight: 800, fontSize: 13, color: UA.navy }}>{c.code}</div>
              <div style={{ fontSize: 13, color: UA.text }}>{c.name}</div>
              <div style={{ fontSize: 13, color: UA.textMuted }}>{c.credits} cr</div>
              <button onClick={() => handleRemove(c.code)}
                style={{ padding: "4px 8px", borderRadius: UA.radiusSm, border: `1px solid ${UA.redBorder}`, background: UA.redLight, color: UA.red, fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>🗑</button>
            </div>
          ))}
          <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 4 }}>
            {courses.length} course{courses.length !== 1 ? "s" : ""} · {courses.reduce((sum, c) => sum + (c.credits || 0), 0)} total credits
          </div>
        </div>
      )}
    </Card>
  );
}

// Assignment entry for staff — manual quick-add, ICS/D2L import, and sync status
// --- ENTRY HUB PAGE -----------------------------------------------------------
// Combined staff and student hub: D2L import, quick add, syllabus upload + extract, saved docs
// role prop determines which sections are visible (student hides quick add)
function EntryHubPage({ onAddAssignment, sessionUser, role = "staff", students = STUDENTS }) {
  const isStudent = role === "student";
  const [activeTab, setActiveTab] = useState("d2l");

  // Resolve real Supabase UUID — mock students have integer IDs, real ones have UUIDs
  const isRealUUID = (id) => id && typeof id === "string" && id.includes("-");

  // Auto-select first real Supabase student (UUID) — fall back to first student
  const firstRealStudent = students.find(s => isRealUUID(s.id));
  const [selectedStudentId, setSelectedStudentId] = useState(firstRealStudent?.id || students[0]?.id);

  // Re-select when students prop updates with real data
  useEffect(() => {
    const real = students.find(s => isRealUUID(s.id));
    if (real && !isRealUUID(selectedStudentId)) {
      setSelectedStudentId(real.id);
    }
  }, [students]);

  // D2L import state
  const [icsUrl, setIcsUrl] = useState("");
  const [importing, setImporting] = useState(false);
  const [icsResult, setIcsResult] = useState(null);

  // Quick add state (staff only)
  const [rows, setRows] = useState([{ title: "", courseCode: "", dueDate: "", points: "" }]);
  const [quickSaved, setQuickSaved] = useState(false);

  // Syllabus state
  const [syllabusFile, setSyllabusFile] = useState("");
  const [syllabusCode, setSyllabusCode] = useState("");
  const [syllabusCourseName, setSyllabusCourseName] = useState("");
  const [syllabusText, setSyllabusText] = useState("");
  const [isDragging, setIsDragging] = useState(false);
  const [extracting, setExtracting] = useState(false);
  const [extractedItems, setExtractedItems] = useState([]);
  const [selectedExtracted, setSelectedExtracted] = useState({});
  const [assignmentsAdded, setAssignmentsAdded] = useState(false);
  const [syllabusUploading, setSyllabusUploading] = useState(false);
  const [syllabusSaved, setSyllabusSaved] = useState(false);

  // Saved docs state
  const [docs, setDocs] = useState([]);
  const [docsLoading, setDocsLoading] = useState(true);
  const fileRef = useRef();

  const student = students.find(s => s.id === selectedStudentId) || students[0];

  const effectiveStudentId = isStudent
    ? (STUDENTS.find(s => s.email === sessionUser?.email)?.id || sessionUser?.studentId || null)
    : (isRealUUID(selectedStudentId) ? selectedStudentId : null);

  // For display — show which student is selected and whether they have a real UUID
  const studentHasRealId = isRealUUID(effectiveStudentId);

  useEffect(() => {
    const loadDocs = async () => {
      if (!effectiveStudentId) { setDocsLoading(false); return; }
      const d = await fetchDocumentsForStudent(effectiveStudentId);
      setDocs(d || []);
      setDocsLoading(false);
    };
    loadDocs();
  }, [effectiveStudentId]);

  // D2L import
  const handleD2LImport = async () => {
    if (!icsUrl.trim()) return;
    setImporting(true); setIcsResult(null);

    try {
      // Call Supabase Edge Function to fetch and parse the real ICS feed
      const response = await fetch(
        `${SUPABASE_URL}/functions/v1/parse-ics`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          },
          body: JSON.stringify({ icsUrl: icsUrl.trim() }),
        }
      );

      if (!response.ok) throw new Error(`Edge Function error: ${response.status}`);
      const result = await response.json();

      if (result.error) throw new Error(result.error);

      const parsed = result.assignments || [];
      if (parsed.length === 0) {
        setIcsResult({ count: 0, saved: 0, error: "No assignments found in this calendar feed. Make sure you copied the full D2L calendar URL." });
        setImporting(false);
        return;
      }

      // Save each assignment to Supabase
      let saved = 0;
      for (const a of parsed) {
        const dueDate = new Date(a.dueDate);
        const days = (dueDate - Date.now()) / 86400000;
        const urgency = days < 3 ? "red" : days < 7 ? "yellow" : "green";
        const item = {
          title: a.title,
          course: a.courseCode || a.title.split(" ").slice(0,2).join(" "),
          courseCode: a.courseCode || "",
          dueDate,
          points: a.points || 0,
          urgency,
          status: "not_started",
          description: a.description || "",
          instructions: "",
          rubric: "",
          d2lLink: a.d2lLink || "https://d2l.arizona.edu",
          studentId: effectiveStudentId,
        };
        if (onAddAssignment) await onAddAssignment(item);
        saved++;
      }

      setIcsResult({ count: parsed.length, saved });

    } catch (e) {
      console.error("D2L import failed:", e.message);
      setIcsResult({ count: 0, saved: 0, error: `Import failed: ${e.message}` });
    }

    setImporting(false);
    setIcsUrl("");
  };

  // Quick add (staff only)
  const updateRow = (i, k, v) => setRows(prev => prev.map((r, idx) => idx === i ? { ...r, [k]: v } : r));
  const handleSaveRows = () => {
    const valid = rows.filter(r => r.title.trim() && r.dueDate);
    if (!valid.length) return;
    valid.forEach(r => {
      const days = (new Date(r.dueDate) - Date.now()) / 86400000;
      const urgency = days < 3 ? "red" : days < 7 ? "yellow" : "green";
      const course = student?.courses?.find(c => c.code === r.courseCode);
      if (onAddAssignment) onAddAssignment({ id: Date.now() + Math.random(), title: r.title, course: course?.name || r.courseCode || "Other", courseCode: r.courseCode, dueDate: new Date(r.dueDate), points: parseInt(r.points) || 0, status: "not_started", urgency, description: "", instructions: "", rubric: "", d2lLink: "", studentId: effectiveStudentId });
    });
    setRows([{ title: "", courseCode: "", dueDate: "", points: "" }]);
    setQuickSaved(true); setTimeout(() => setQuickSaved(false), 2500);
  };

  // PDF/file reading
  const readFile = async (file) => {
    if (!file) return;
    if (!syllabusFile) setSyllabusFile(file.name);
    if (file.type === "application/pdf" || file.name.endsWith(".pdf")) {
      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let text = "";
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          // Group items by their Y position to preserve line breaks
          const lines = {};
          content.items.forEach(item => {
            const y = Math.round(item.transform[5]);
            if (!lines[y]) lines[y] = [];
            lines[y].push(item.str);
          });
          // Sort by Y position descending (top to bottom) and join
          const sortedYs = Object.keys(lines).map(Number).sort((a, b) => b - a);
          sortedYs.forEach(y => {
            const lineText = lines[y].join(" ").trim();
            if (lineText) text += lineText + "\n";
          });
          text += "\n";
        }
        // Clean up hyphenated words split across lines (PDF artifact)
        text = text.replace(/(\w)- \n(\w)/g, "$1$2\n");
        setSyllabusText(text.trim());
      } catch (e) {
        setSyllabusText("Could not extract text automatically. Please paste the syllabus text manually.");
      }
    } else {
      const reader = new FileReader();
      reader.onload = (e) => setSyllabusText(e.target.result || "");
      reader.readAsText(file);
    }
  };

  const handleDrop = (e) => { e.preventDefault(); setIsDragging(false); readFile(e.dataTransfer.files[0]); };

  // Extract assignments — calls Supabase Edge Function which uses Claude API server-side
  const handleExtract = async () => {
    if (!syllabusText.trim()) return;
    setExtracting(true); setExtractedItems([]);

    const text = syllabusText;

    // Try Edge Function first
    const edgeResult = await callExtractSyllabus(text, syllabusCode, syllabusCourseName);
    if (edgeResult && edgeResult.length > 0) {
      const sel = {};
      edgeResult.forEach((_, i) => sel[i] = true);
      setSelectedExtracted(sel);
      setExtractedItems(edgeResult);
      setExtracting(false);
      return;
    }

    // Fallback: local regex parser
    const courseContext = syllabusCourseName || syllabusCode || "this course";

    // Local regex parser fallback
    try {
      const found = [];
      const seen = new Set();

      // Broader date pattern — catches dates anywhere in a line
      const datePattern = /(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\.?\s+\d{1,2}(?:st|nd|rd|th)?(?:,?\s*\d{4})?|\d{1,2}\/\d{1,2}(?:\/\d{2,4})?/gi;

      // Assignment keywords — look for these near dates
      const assignmentKeywords = /\b(paper|essay|exam|quiz|test|midterm|final|project|presentation|discussion|journal|entry|entries|assignment|homework|report|response|draft|submission|due|submit|turn in|deadline)\b/i;

      const typeMap = {
        exam: "Exam", test: "Exam", midterm: "Exam", final: "Exam", quiz: "Quiz",
        essay: "Essay", paper: "Essay", report: "Essay", response: "Essay", draft: "Essay",
        project: "Project", presentation: "Project",
        homework: "Homework", assignment: "Homework", submission: "Homework",
        discussion: "Discussion", journal: "Discussion", entry: "Discussion", entries: "Discussion",
        lab: "Lab", reading: "Reading",
      };

      // Strategy 1: Look for lines containing "due" keyword with a date
      const lines = text.split("\n");
      for (const line of lines) {
        const trimmed = line.trim();
        if (trimmed.length < 5 || trimmed.length > 400) continue;
        const hasDate = trimmed.match(datePattern);
        if (!hasDate) continue;

        // Parse date
        let dueDate = null;
        for (const match of trimmed.matchAll(new RegExp(datePattern.source, "gi"))) {
          try {
            const raw = match[0];
            const parsed = new Date(raw.includes("/") ? raw : raw + (raw.match(/\d{4}/) ? "" : ", 2026"));
            if (!isNaN(parsed.getTime()) && parsed.getFullYear() >= 2025) {
              dueDate = parsed.toISOString().split("T")[0];
              break;
            }
          } catch(e) { continue; }
        }
        if (!dueDate) continue;

        // Check if this line has an assignment keyword
        if (!assignmentKeywords.test(trimmed)) continue;

        // Build title — extract the assignment type and context
        let title = trimmed;
        // Remove bracketed section headers like [Short paper is due...]
        title = title.replace(/\[([^\]]+)\]/g, "$1");
        // Clean up date from title
        title = title.replace(new RegExp(datePattern.source, "gi"), "").trim();
        // Clean up common prefixes/suffixes
        title = title.replace(/^(is due on?|due on?|due|:|-|–|—)\s*/i, "").replace(/\s*(is due|due).*$/i, "").trim();
        title = title.replace(/^[,.\s\[\]]+|[,.\s\[\]]+$/g, "").trim();

        if (!title || title.length < 3 || seen.has(title.toLowerCase())) continue;
        seen.add(title.toLowerCase());

        // Detect type
        const lower = title.toLowerCase();
        let type = "Homework";
        for (const [kw, t] of Object.entries(typeMap)) { if (lower.includes(kw)) { type = t; break; } }

        const pointsMatch = trimmed.match(/(\d+)%/);
        const points = pointsMatch ? parseInt(pointsMatch[1]) : (type === "Exam" ? 100 : 25);

        found.push({ title, dueDate, points, type });
        if (found.length >= 20) break;
      }

      // Strategy 2: If nothing found from line scan, look for week headers with dates
      if (found.length === 0) {
        const weekPattern = /Week\s+\d+.*?\(([^)]+)\)/gi;
        let weekMatch;
        while ((weekMatch = weekPattern.exec(text)) !== null) {
          const dateStr = weekMatch[1];
          const dateMatch = dateStr.match(datePattern);
          if (!dateMatch) continue;
          try {
            // Use the last date in the range as due date
            const allDates = [...dateStr.matchAll(new RegExp(datePattern.source, "gi"))];
            const lastDate = allDates[allDates.length - 1]?.[0];
            if (!lastDate) continue;
            const parsed = new Date(lastDate + (lastDate.match(/\d{4}/) ? "" : ", 2026"));
            if (isNaN(parsed.getTime())) continue;
            const dueDate = parsed.toISOString().split("T")[0];
            found.push({ title: `Week ${found.length + 1} Readings`, dueDate, points: 0, type: "Reading" });
          } catch(e) { continue; }
        }
      }

      if (found.length > 0) {
        const sel = {};
        found.forEach((_, i) => sel[i] = true);
        setSelectedExtracted(sel);
        setExtractedItems(found);
      } else {
        setExtractedItems([{ title: "Could not auto-extract — check dates are in Month Day format", dueDate: new Date(Date.now() + 30*86400000).toISOString().split("T")[0], points: 0, type: "Homework" }]);
        console.warn("No assignments found. Syllabus may use unusual date formatting.");
      }
    } catch (e) {
      console.error("Extraction error:", e);
      setExtractedItems([]);
    }
    setExtracting(false);
  };

  // Toggle individual extracted assignment selection
  const toggleExtracted = (i) => setSelectedExtracted(prev => ({ ...prev, [i]: !prev[i] }));

      if (onAddAssignment) {

      setSyllabusSaved(true);

  const inputStyle = { width: "100%", padding: "9px 12px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none", boxSizing: "border-box", background: "white" };

  const tabs = [
    { id: "d2l", label: "📅 D2L Import" },
    ...(!isStudent ? [{ id: "quickadd", label: "⚡ Quick Add" }] : []),
    ...(!isStudent ? [{ id: "courses", label: "📚 Courses" }] : []),
    { id: "syllabus", label: "📄 Syllabus" },
    { id: "saved", label: `📁 Saved (${docs.length})` },
  ];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 22 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div>
          <h2 style={{ fontSize: 22, fontWeight: 900, color: UA.text, margin: 0 }}>Entry Hub</h2>
          <p style={{ color: UA.textMuted, fontSize: 14, marginTop: 4 }}>Import assignments, upload syllabi, and manage course content{!isStudent ? " for your students" : ""}.</p>
        </div>
      </div>

      {/* Student selector — staff only */}
      {!isStudent && (
        <Card style={{ padding: "14px 18px" }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 10 }}>Working with</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
            {students.map(s => {
              const hasRealId = isRealUUID(s.id);
              return (
                <button key={s.id} onClick={() => setSelectedStudentId(s.id)}
                  style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 14px", borderRadius: 99, border: `1.5px solid ${selectedStudentId === s.id ? UA.navy : UA.border}`, background: selectedStudentId === s.id ? UA.navy : "white", cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s", opacity: hasRealId ? 1 : 0.6 }}>
                  <Avatar initials={s.initials} size={22} color={selectedStudentId === s.id ? "white" : UA.navy} />
                  <span style={{ fontSize: 13, fontWeight: 700, color: selectedStudentId === s.id ? "white" : UA.text }}>{s.name.split(" ")[0]}</span>
                  {!hasRealId && <span style={{ fontSize: 9, color: selectedStudentId === s.id ? "rgba(255,255,255,0.6)" : UA.textMuted }}>demo</span>}
                </button>
              );
            })}
          </div>
          {!studentHasRealId && (
            <div style={{ fontSize: 12, color: UA.orange, fontWeight: 600, padding: "6px 10px", borderRadius: UA.radiusSm, background: UA.orangeBg, border: `1px solid ${UA.orangeBorder}` }}>
              ⚠️ Selected student is demo data — saves will only work for real Supabase students like Cornelius Warren.
            </div>
          )}
        </Card>
      )}

      {/* Tabs */}
      <div style={{ display: "flex", gap: 0, border: `1.5px solid ${UA.border}`, borderRadius: UA.radiusSm, overflow: "hidden", alignSelf: "flex-start" }}>
        {tabs.map(t => (

            {t.label}
          </button>
        ))}
      </div>

      {/* D2L IMPORT TAB */}
      {activeTab === "d2l" && (
        <Card style={{ border: `1.5px solid ${UA.navyBorder}`, background: UA.navyLight }}>
          <div style={{ fontWeight: 800, fontSize: 14, color: UA.navy, marginBottom: 4 }}>🔗 Import from D2L Calendar</div>
          <div style={{ fontSize: 12, color: UA.textMuted, marginBottom: 14, lineHeight: 1.6 }}>
            In D2L: <strong>Calendar → Subscribe → Copy feed URL</strong>. Paste it below to import all your assignments automatically.
            {!isStudent && " Assignments will be saved under the selected student's account."}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr auto", gap: 10, marginBottom: 10 }}>
            <input value={icsUrl} onChange={e => setIcsUrl(e.target.value)}
              placeholder="https://d2l.arizona.edu/d2l/le/calendar/ics/..."
              style={{ ...inputStyle }} />
            <Btn onClick={handleD2LImport} disabled={!icsUrl.trim() || importing}>
              {importing ? "⏳ Importing..." : "Import →"}
            </Btn>
          </div>
          {icsResult && !icsResult.error && <div style={{ fontSize: 13, color: UA.green, fontWeight: 700, marginBottom: 10 }}>✓ {icsResult.count} assignments imported from your D2L calendar and saved to your account.</div>}
          {icsResult?.error && <div style={{ fontSize: 13, color: UA.red, fontWeight: 600, marginBottom: 10 }}>⚠️ {icsResult.error}</div>}
          <div style={{ padding: "10px 14px", borderRadius: UA.radiusSm, background: "rgba(0,51,102,0.06)", fontSize: 12, color: UA.navy, lineHeight: 1.6 }}>
            <strong>D2L Sync Status:</strong> Not yet connected — IT is working on the CATSCloud integration. Manual ICS import available in the meantime.
          </div>
        </Card>

      {/* QUICK ADD TAB — staff only */}
      {activeTab === "quickadd" && !isStudent && (
        <Card>
          <div style={{ fontWeight: 800, fontSize: 14, color: UA.text, marginBottom: 4 }}>⚡ Quick Add for {student?.name.split(" ")[0]}</div>
          <div style={{ fontSize: 12, color: UA.textMuted, marginBottom: 14 }}>Add one-off assignments manually — one row per assignment</div>
          <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr 80px 32px", gap: 8, marginBottom: 6 }}>
            {["Assignment Title", "Course", "Due Date", "Points", ""].map((h, i) => (
              <div key={i} style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, textTransform: "uppercase", letterSpacing: "0.04em" }}>{h}</div>
            ))}
          </div>
          {rows.map((row, i) => (
            <div key={i} style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr 80px 32px", gap: 8, marginBottom: 8 }}>
              <input value={row.title} onChange={e => updateRow(i, "title", e.target.value)} placeholder="Assignment title..."
                style={{ padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none" }}
                onFocus={e => e.target.style.borderColor = UA.navy} onBlur={e => e.target.style.borderColor = UA.border} />
              <select value={row.courseCode} onChange={e => updateRow(i, "courseCode", e.target.value)}
                style={{ padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none", background: "white" }}>
                <option value="">Course...</option>
                {(student?.courses || []).map(c => <option key={c.code} value={c.code}>{c.code}</option>)}
              </select>
              <input type="date" value={row.dueDate} onChange={e => updateRow(i, "dueDate", e.target.value)}
                style={{ padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none" }} />
              <input type="number" value={row.points} onChange={e => updateRow(i, "points", e.target.value)} placeholder="pts"
                style={{ padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none" }} />
              <button onClick={() => setRows(prev => prev.filter((_, idx) => idx !== i))} disabled={rows.length === 1}
                style={{ padding: "8px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, background: "white", cursor: rows.length === 1 ? "not-allowed" : "pointer", color: UA.textMuted, fontSize: 14, opacity: rows.length === 1 ? 0.3 : 1 }}>✕</button>
            </div>

          <div style={{ display: "flex", gap: 10, marginTop: 10 }}>
            <Btn variant="ghost" size="sm" onClick={() => setRows(prev => [...prev, { title: "", courseCode: "", dueDate: "", points: "" }])}>+ Add Row</Btn>
            <Btn size="sm" onClick={handleSaveRows}>Save All</Btn>

          </div>
        </Card>
      )}

      {/* SYLLABUS TAB */}
      {activeTab === "syllabus" && (
        <Card>
          <div style={{ fontWeight: 800, fontSize: 14, color: UA.text, marginBottom: 14 }}>📄 Upload Syllabus</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>

              <label style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 4 }}>Course Code *</label>
              <input value={syllabusCode} onChange={e => setSyllabusCode(e.target.value)} placeholder="e.g. ENGL101" style={inputStyle} />
            </div>
            <div>
              <label style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 4 }}>Course Name</label>
              <input value={syllabusCourseName} onChange={e => setSyllabusCourseName(e.target.value)} placeholder="e.g. English Composition" style={inputStyle} />
            </div>
          </div>
          <div style={{ marginBottom: 10 }}>
            <label style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 4 }}>File Name *</label>
            <input value={syllabusFile} onChange={e => setSyllabusFile(e.target.value)} placeholder="e.g. ENGL101 Syllabus Spring 2026.pdf" style={inputStyle} />
          </div>
          <div style={{ marginBottom: 14 }}>

              </label>

          {extractedItems.length > 0 && (

                </button>
                {assignmentsAdded && <span style={{ fontSize: 13, color: UA.green, fontWeight: 700 }}>✓ Added to assignment list</span>}
              </div>
            </div>

        </Card>
      )}


      {/* COURSES TAB — staff only */}
      {activeTab === "courses" && !isStudent && (
        <CoursesTab
          student={student}
          effectiveStudentId={effectiveStudentId}
          studentHasRealId={studentHasRealId}
          onCoursesUpdated={(updatedCourses) => {
            // Update STUDENTS array in memory so Quick Add dropdown refreshes
            const idx = STUDENTS.findIndex(s => s.id === effectiveStudentId);
            if (idx !== -1) STUDENTS[idx].courses = updatedCourses;
          }}
        />
      )}

      {/* SAVED DOCS TAB */}
      {activeTab === "saved" && (
        <SavedDocsTab
          docs={docs}
          setDocs={setDocs}
          student={student}
          syllabusCourseName={syllabusCourseName}
          syllabusCode={syllabusCode}
          onAddAssignment={onAddAssignment}
          effectiveStudentId={effectiveStudentId}
          sessionUser={sessionUser}
          isStudent={isStudent}
        />
      )}
    </div>
  );
}

// --- SESSION LOG TAB ----------------------------------------------------------
// Shows on student profile — every Work Mode session the student has logged.
// This is what the LS reviews before a meeting.
function SessionLogTab({ studentId }) {
  const [logs, setLogs] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const isRealUUID = studentId && typeof studentId === "string" && studentId.includes("-");
    if (!isRealUUID) { setLoading(false); return; }
    supabase.from("session_logs")
      .select("*")
      .eq("student_id", studentId)
      .order("created_at", { ascending: false })
      .then(({ data, error }) => {
        if (!error && data) {
          setLogs(data.map(l => ({
            id: l.id,
            date: new Date(l.created_at).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }),
            assignment: l.assignment_title || "—",
            timeSpent: l.duration_minutes || 0,
            effort: l.effort || 0,
            understanding: l.understanding || 0,
            completionType: l.completion_type || "in_progress",
            notes: l.notes || "",
          })));
        }
        setLoading(false);
      });
  }, [studentId]);

  if (loading) return <div style={{ textAlign: "center", padding: "32px 0", color: UA.textMuted, fontSize: 13 }}>Loading session logs...</div>;
  const effortColor = (v) => v >= 4 ? UA.green : v >= 3 ? UA.yellow : UA.red;

  if (logs.length === 0) return (
    <div style={{ textAlign: "center", padding: "48px 0", color: UA.textMuted, fontSize: 14 }}>
      <div style={{ fontSize: 32, marginBottom: 12 }}>📋</div>
      No work sessions logged yet for this student.
    </div>
  );

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      {logs.map(log => (
        <div key={log.id} style={{ background: UA.bgCard, border: `1px solid ${UA.border}`, borderRadius: UA.radius, padding: "18px 20px", boxShadow: UA.shadow }}>
          {/* Header */}
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 12 }}>
            <div>
              <div style={{ fontWeight: 800, fontSize: 14, color: UA.text }}>{log.assignment}</div>
              <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 3 }}>{log.date} · {log.timeSpent} min · {log.completionType.replace("_", " ")}</div>
            </div>
            <div style={{ display: "flex", gap: 8, flexShrink: 0 }}>
              <div style={{ textAlign: "center", padding: "6px 12px", borderRadius: UA.radiusSm, background: UA.bg, border: `1px solid ${UA.border}` }}>
                <div style={{ fontSize: 10, color: UA.textMuted, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.04em" }}>Effort</div>
                <div style={{ fontSize: 20, fontWeight: 900, color: effortColor(log.effort) }}>{log.effort}/5</div>
              </div>
              <div style={{ textAlign: "center", padding: "6px 12px", borderRadius: UA.radiusSm, background: UA.bg, border: `1px solid ${UA.border}` }}>
                <div style={{ fontSize: 10, color: UA.textMuted, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.04em" }}>Understanding</div>
                <div style={{ fontSize: 20, fontWeight: 900, color: effortColor(log.understanding) }}>{log.understanding}/5</div>
              </div>
            </div>
          </div>
          {/* Student notes */}
          {log.notes && (
            <div style={{ fontSize: 13, color: UA.textSecondary, lineHeight: 1.7, padding: "10px 14px", background: UA.bg, borderRadius: UA.radiusSm, borderLeft: `3px solid ${UA.navy}` }}>
              <strong style={{ color: UA.navy, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.04em" }}>Student notes: </strong>{log.notes}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

// --- EDIT ASSIGNMENT MODAL ---------------------------------------------------
function EditAssignmentModal({ assignment, onClose, onSave }) {
  const [form, setForm] = useState({
    title: assignment.title || "",
    course: assignment.course || "",
    courseCode: assignment.courseCode || "",
    dueDate: assignment.dueDate instanceof Date ? assignment.dueDate.toISOString().split("T")[0] : assignment.dueDate || "",
    points: String(assignment.points || ""),
    description: assignment.description || "",
    instructions: assignment.instructions || "",
    rubric: assignment.rubric || "",
  });
  const [saving, setSaving] = useState(false);
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const inp = { fontSize: 13, fontFamily: "inherit", outline: "none", boxSizing: "border-box", width: "100%", padding: "9px 12px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}` };

  const handleSave = async () => {
    if (!form.title.trim()) return;
    setSaving(true);
    const updated = {
      ...assignment,
      ...form,
      points: parseInt(form.points) || 0,
      dueDate: form.dueDate ? new Date(form.dueDate) : assignment.dueDate,
    };
    const isRealUUID = typeof assignment.id === "string" && assignment.id.includes("-") && !assignment.id.startsWith("temp-");
    if (isRealUUID) {
      await updateAssignmentInDB(assignment.id, updated);
    }
    onSave(updated);
    setSaving(false);
    onClose();
  };

  const lbl = (text) => <label style={{ fontSize: 12, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 5 }}>{text}</label>;

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <div style={{ background: "white", borderRadius: UA.radius, width: "100%", maxWidth: 560, maxHeight: "90vh", overflow: "auto", boxShadow: UA.shadowMd }}>
        <div style={{ padding: "20px 24px", borderBottom: `1px solid ${UA.border}`, display: "flex", justifyContent: "space-between", alignItems: "center", position: "sticky", top: 0, background: "white", zIndex: 1 }}>
          <div style={{ fontWeight: 800, fontSize: 16, color: UA.text }}>Edit Assignment</div>

// Manual assignment entry form — used until D2L sync is live.
function AddAssignmentModal({ onClose, onAdd }) {
  const [form, setForm] = useState({
    title: "", course: "", courseCode: "", dueDate: "", points: "",
    description: "", instructions: "", rubric: "", status: "not_started",
  });
  const [errors, setErrors] = useState({});

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const inp = { fontSize: 13, fontFamily: "inherit", outline: "none", boxSizing: "border-box", width: "100%", padding: "9px 12px", borderRadius: UA.radiusSm };

  const validate = () => {
    const e = {};
    if (!form.title.trim()) e.title = "Required";
    if (!form.course.trim()) e.course = "Required";
    if (!form.dueDate) e.dueDate = "Required";
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const handleSubmit = () => {
    if (!validate()) return;
    const urgency = (() => {
      const days = (new Date(form.dueDate) - Date.now()) / 86400000;
      if (days < 3) return "red";
      if (days < 7) return "yellow";
      return "green";
    })();
    onAdd({ id: Date.now(), ...form, points: parseInt(form.points) || 0, dueDate: new Date(form.dueDate), urgency, d2lLink: "" });

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <div style={{ background: "white", borderRadius: UA.radius, width: "100%", maxWidth: 560, maxHeight: "90vh", overflow: "auto", boxShadow: UA.shadowMd }}>
        <div style={{ padding: "20px 24px", borderBottom: `1px solid ${UA.border}`, display: "flex", justifyContent: "space-between", alignItems: "center", position: "sticky", top: 0, background: "white", zIndex: 1 }}>

          <button onClick={onClose} style={{ background: "none", border: "none", fontSize: 20, cursor: "pointer", color: UA.textMuted }}>✕</button>
        </div>
        <div style={{ padding: "20px 24px" }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 16px" }}>
            <div style={{ gridColumn: "1 / -1", marginBottom: 14 }}>
              {lbl("Assignment Title", true)}
              <input value={form.title} onChange={e => set("title", e.target.value)} placeholder="e.g. Essay: The Great Gatsby" style={{ ...inp, border: `1.5px solid ${errors.title ? UA.red : UA.border}` }} />
              {errors.title && <div style={{ fontSize: 11, color: UA.red, marginTop: 3 }}>{errors.title}</div>}

            <div style={{ marginBottom: 14 }}>
              {lbl("Course Name", true)}

              {errors.course && <div style={{ fontSize: 11, color: UA.red, marginTop: 3 }}>{errors.course}</div>}
            </div>
            <div style={{ marginBottom: 14 }}>
              {lbl("Course Code")}
              <input value={form.courseCode} onChange={e => set("courseCode", e.target.value)} placeholder="e.g. ENG201" style={{ ...inp, border: `1.5px solid ${UA.border}` }} />
