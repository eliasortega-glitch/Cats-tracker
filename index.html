<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CATS Weekly Tracker</title>
<style>
  :root{
    /* UA-inspired */
    --ua-red:#AB0520;
    --ua-blue:#0C234B;

    --bg:#F7F9FC;
    --card:#FFFFFF;
    --text:#111827;
    --muted:#6B7280;
    --line:#E5E7EB;

    --good:#12B76A;
    --warn:#F79009;
    --bad:#F04438;

    --shadow:0 1px 10px rgba(12,35,75,.08);
    --r:16px;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 12px 12px 92px;
  }

  .wrap{ max-width: 980px; margin: 0 auto; }

  /* Top bar (clean) */
  .top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
  }
  .mark{
    width:38px; height:38px; border-radius:12px;
    background: linear-gradient(135deg, var(--ua-red), var(--ua-blue));
    box-shadow: var(--shadow);
  }
  h1{ font-size:16px; margin:0; letter-spacing:.2px; }
  .sub{ font-size:12px; color:var(--muted); margin:2px 0 0; }

  .modeToggle{
    display:flex; gap:6px; padding:4px;
    background:#fff; border:1px solid var(--line);
    border-radius:999px; box-shadow: var(--shadow);
  }
  .modeBtn{
    border:0; background:transparent; cursor:pointer;
    padding:8px 10px; border-radius:999px;
    font-size:12px; color:var(--muted);
    user-select:none;
  }
  .modeBtn.active{
    color:#fff;
    background: linear-gradient(135deg, var(--ua-blue), rgba(12,35,75,.86));
  }

  /* Cards */
  .card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r);
    box-shadow: var(--shadow);
  }
  .pad{ padding:12px; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; }
  .col{ flex:1; min-width: 200px; }
  label{ display:block; font-size:11px; color:var(--muted); margin:0 0 4px; }
  input, select, textarea{
    width:100%;
    padding:10px 10px;
    border:1px solid var(--line);
    border-radius:12px;
    outline:none;
    font-size:14px;
    background:#fff;
    color:var(--text);
  }
  textarea{ min-height: 72px; resize: vertical; }

  /* Minimal actions */
  .actions{
    display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;
  }
  .btn{
    padding:10px 12px;
    border-radius:12px;
    border:1px solid var(--line);
    background:#fff;
    cursor:pointer;
    font-size:13px;
  }
  .btn:active{ transform: translateY(1px); }
  .btn.primary{
    border-color: transparent;
    color:#fff;
    background: linear-gradient(135deg, var(--ua-red), rgba(171,5,32,.85));
  }
  .btn.blue{
    border-color: transparent;
    color:#fff;
    background: linear-gradient(135deg, var(--ua-blue), rgba(12,35,75,.86));
  }

  /* Calendar strip */
  .calTop{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }
  .calStrip{
    display:flex; gap:8px;
    overflow:auto;
    padding:8px 2px 2px;
    scroll-snap-type:x mandatory;
  }
  .dayCard{
    flex: 0 0 auto;
    min-width: 112px;
    border:1px solid var(--line);
    border-radius: 14px;
    background:#fff;
    padding:10px;
    cursor:pointer;
    scroll-snap-align:start;
    user-select:none;
    transition: transform .08s ease, border-color .08s ease;
  }
  .dayCard:hover{ transform: translateY(-1px); }
  .dayCard.active{
    border-color: rgba(12,35,75,.18);
    box-shadow: 0 10px 25px rgba(12,35,75,.10);
    background: linear-gradient(180deg, rgba(12,35,75,.06), #fff);
  }
  .dow{ font-size:12px; color: var(--muted); }
  .date{ font-size:14px; font-weight:700; margin-top:2px; }
  .mini{
    font-size:11px; margin-top:6px; color:var(--muted);
    display:flex; justify-content:space-between; gap:6px;
  }
  .mini strong{ color:var(--text); }

  /* Progress bar */
  .progRow{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px; }
  .bar{
    width:100%; height:10px; border-radius:999px;
    background:#EEF2FF;
    overflow:hidden; border:1px solid rgba(12,35,75,.10);
  }
  .fill{
    height:100%;
    width:0%;
    border-radius:999px;
    background: linear-gradient(90deg, var(--ua-blue), var(--ua-red));
    transition: width .2s ease;
  }
  .kpi{
    font-size:12px; color:var(--muted); white-space:nowrap;
  }
  .flag{
    padding:6px 10px; border-radius:999px;
    font-size:12px; border:1px solid var(--line);
    background:#fff; color:var(--muted);
    white-space:nowrap;
  }
  .flag.good{ background: rgba(18,183,106,.10); border-color:transparent; color:#067647; }
  .flag.warn{ background: rgba(247,144,9,.12); border-color:transparent; color:#7A4B00; }
  .flag.bad{ background: rgba(240,68,56,.12); border-color:transparent; color:#8F1D14; }

  /* Tasks */
  .taskRow{
    display:flex; gap:8px; align-items:flex-start;
    padding:10px;
    border:1px solid var(--line);
    border-radius:14px;
    background:#fff;
    margin-top:8px;
  }
  .taskRow input[type="checkbox"]{ width:auto; margin-top:3px; }
  .taskRow input[type="text"]{ flex:1; }
  .x{
    cursor:pointer; user-select:none;
    font-weight:800; color:#B42318;
    padding:0 6px;
  }

  /* Staff-only area (clean) */
  .staffOnly{ display:none; }
  .staffOnly.show{ display:block; }

  /* Admin list editor */
  .miniGrid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
  }
  .hint{
    font-size:12px; color:var(--muted);
    margin-top:6px;
  }

  /* Toast */
  .toast{
    position:fixed;
    left:50%;
    transform: translateX(-50%);
    bottom: 84px;
    background: #111827;
    color:#fff;
    padding:10px 12px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,.18);
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition: opacity .16s ease, transform .16s ease;
    max-width: 92vw;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(-4px); }

  /* Sticky bottom bar */
  .sticky{
    position:fixed; left:0; right:0; bottom:0;
    background: rgba(247,249,252,.92);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--line);
  }
  .sticky .inner{
    max-width:980px; margin:0 auto;
    padding:10px 12px;
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; flex-wrap:wrap;
  }
  .status{
    font-size:12px; color:var(--muted);
  }
  .status strong{ color:var(--text); }

  /* Print snapshot */
  @media print{
    body{ padding:0; background:#fff; }
    .sticky, .modeToggle, .actions, #printBtn, #shareBtn, #loadWeekBtn, #saveNowBtn, #resetBtn { display:none !important; }
    .card{ box-shadow:none !important; }
    .wrap{ max-width:100%; }
  }

  @media(max-width:720px){
    .miniGrid{ grid-template-columns: 1fr; }
    .dayCard{ min-width: 104px; }
  }
</style>
</head>

<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div>
        <h1>CATS Weekly Tracker</h1>
        <div class="sub" id="subText">Student view</div>
      </div>
    </div>

    <div class="modeToggle" aria-label="Mode toggle">
      <button class="modeBtn active" id="studentModeBtn" type="button">Student</button>
      <button class="modeBtn" id="staffModeBtn" type="button">Staff</button>
    </div>
  </div>

  <!-- Core dashboard -->
  <div class="card pad">
    <div class="row">
      <div class="col">
        <label>Student</label>
        <input id="studentName" type="text" placeholder="First Last" autocomplete="off" />
      </div>

      <div class="col">
        <label>Sport</label>
        <select id="sport"></select>
      </div>

      <div class="col">
        <label>Start date</label>
        <input id="startDate" type="date" />
      </div>
    </div>

    <div class="row" style="margin-top:10px; align-items:flex-end;">
      <div class="col staffOnly" id="staffMetaCard">
        <div class="miniGrid">
          <div>
            <label>Learning Specialist</label>
            <select id="ls"></select>
          </div>
          <div>
            <label>Academic Counselor</label>
            <select id="counselor"></select>
          </div>
        </div>
      </div>

      <div class="col" style="min-width:260px;">
        <div class="actions">
          <button class="btn blue" id="loadWeekBtn" type="button">Load current week</button>
          <button class="btn" id="shareBtn" type="button">Share</button>
          <button class="btn" id="printBtn" type="button">Print snapshot</button>
        </div>
      </div>
    </div>

    <div class="calTop" style="margin-top:10px;">
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
        <div class="flag" id="flagPill">—</div>
        <div class="kpi" id="kpiText">0/0</div>
      </div>
      <div class="actions" style="justify-content:flex-start;">
        <button class="btn primary" id="addTaskBtn" type="button">Add task</button>
        <button class="btn" id="studyHallBtn" type="button">Study Hall</button>
      </div>
    </div>

    <div class="progRow">
      <div class="bar" aria-label="Progress bar">
        <div class="fill" id="fillBar"></div>
      </div>
    </div>

    <div class="calStrip" id="calStrip" aria-label="7-day strip"></div>

    <div id="tasksArea" style="margin-top:8px;"></div>

    <div class="staffOnly" id="staffNotes" style="margin-top:10px;">
      <label>Staff note</label>
      <textarea id="note" placeholder=""></textarea>
    </div>
  </div>

  <!-- Staff: editable lists -->
  <div class="card pad staffOnly" id="adminLists" style="margin-top:10px;">
    <div class="row">
      <div class="col">
        <label>Learning Specialists (one per line)</label>
        <textarea id="lsList"></textarea>
      </div>
      <div class="col">
        <label>Academic Counselors (one per line)</label>
        <textarea id="counselorList"></textarea>
      </div>
    </div>
    <div class="row" style="margin-top:10px;">
      <div class="col">
        <label>Sports (one per line)</label>
        <textarea id="sportList"></textarea>
        <div class="hint">Edits save on this device and update the dropdowns instantly.</div>
      </div>
      <div class="col" style="min-width:260px;">
        <div class="actions" style="justify-content:flex-end; height:100%; align-items:flex-end;">
          <button class="btn" id="saveListsBtn" type="button">Save lists</button>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Sticky bar -->
<div class="sticky">
  <div class="inner">
    <div class="status" id="status">
      <strong>Idle</strong> · set Student + Start date
    </div>
    <div class="actions">
      <button class="btn" id="saveNowBtn" type="button">Save</button>
      <button class="btn" id="resetBtn" type="button">Reset</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================================
   CONFIG
================================== */
const webAppURL = "https://script.google.com/macros/s/AKfycby6NVVsDPuOT6oYJ-6Uq8_F12bqhTDCtu0to1k76T3jDTDMaaZquy-oKwFwib2qrpt-/exec";

/* ================================
   STATE
================================== */
let mode = "student"; // student | staff
let selectedDateISO = ""; // yyyy-mm-dd
let weekDates = []; // array of ISO dates (7 days)
let saveTimer = null;
let isApplyingLoad = false;
let lastSavedHash = "";

/* ================================
   UTIL
================================== */
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove("show"), 1400);
}
function fmtDow(date){
  return date.toLocaleDateString(undefined, { weekday:"short" });
}
function fmtMD(date){
  return date.toLocaleDateString(undefined, { month:"short", day:"numeric" });
}
function iso(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const da = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${da}`;
}
function parseISO(s){
  // interpret as local date
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y, m-1, d);
}
function nowStamp(){
  return new Date().toLocaleString();
}
function setStatus(title, detail){
  const el = document.getElementById("status");
  el.innerHTML = `<strong>${title}</strong>` + (detail ? ` · ${detail}` : "");
}

/* ================================
   LISTS (editable in-page)
================================== */
const DEFAULTS = {
  ls: ["Elias Ortega","Other LS"],
  counselors: ["Jennifer","Sarah"],
  sports: [
    "Baseball","Men's Basketball","Women's Basketball","Beach Volleyball","Cross Country",
    "Football","Men's Golf","Women's Golf","Gymnastics","Soccer","Softball",
    "Men's Swimming & Diving","Women's Swimming & Diving","Men's Tennis","Women's Tennis",
    "Track & Field","Triathlon","Volleyball"
  ]
};

function listStoreKey(name){ return `cats_lists_${name}`; }

function loadLists(){
  const ls = JSON.parse(localStorage.getItem(listStoreKey("ls")) || "null") || DEFAULTS.ls;
  const counselors = JSON.parse(localStorage.getItem(listStoreKey("counselors")) || "null") || DEFAULTS.counselors;
  const sports = JSON.parse(localStorage.getItem(listStoreKey("sports")) || "null") || DEFAULTS.sports;
  return { ls, counselors, sports };
}

function saveListsToStorage(lists){
  localStorage.setItem(listStoreKey("ls"), JSON.stringify(lists.ls));
  localStorage.setItem(listStoreKey("counselors"), JSON.stringify(lists.counselors));
  localStorage.setItem(listStoreKey("sports"), JSON.stringify(lists.sports));
}

function fillSelect(selectEl, items, placeholder){
  selectEl.innerHTML = "";
  const opt0 = document.createElement("option");
  opt0.value = "";
  opt0.textContent = placeholder || "Select";
  selectEl.appendChild(opt0);
  items.forEach(v=>{
    const o=document.createElement("option");
    o.value=v; o.textContent=v;
    selectEl.appendChild(o);
  });
}

function initListEditor(){
  const lists = loadLists();
  document.getElementById("lsList").value = lists.ls.join("\n");
  document.getElementById("counselorList").value = lists.counselors.join("\n");
  document.getElementById("sportList").value = lists.sports.join("\n");
  applyListsToUI(lists);
}

function applyListsToUI(lists){
  fillSelect(document.getElementById("ls"), lists.ls, "Select LS");
  fillSelect(document.getElementById("counselor"), lists.counselors, "Select counselor");
  fillSelect(document.getElementById("sport"), lists.sports, "Select sport");
}

/* ================================
   RECORD KEY + LOCAL CACHE
================================== */
function stableKey(){
  const student = (document.getElementById("studentName").value || "").trim();
  const start = document.getElementById("startDate").value || "";
  return { student, start, key: (student + "|" + start).toLowerCase() };
}
function hasRequiredKey(){
  const sk = stableKey();
  return !!(sk.student && sk.start);
}
function cacheKey(){ return "cats_week_data_" + stableKey().key; }
function metaKey(){ return "cats_week_meta_" + stableKey().key; }

function cacheSave(data){
  try{
    localStorage.setItem(cacheKey(), JSON.stringify(data));
    localStorage.setItem(metaKey(), JSON.stringify({ savedAt: nowStamp() }));
  }catch(e){}
}
function cacheLoad(){
  try{
    const raw = localStorage.getItem(cacheKey());
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

/* ================================
   WEEK GENERATION (7 days from selected start date)
================================== */
function buildWeekFrom(startISO){
  const d0 = parseISO(startISO);
  const dates = [];
  for(let i=0;i<7;i++){
    const d = new Date(d0);
    d.setDate(d0.getDate()+i);
    dates.push(iso(d));
  }
  return dates;
}

function ensureWeek(){
  const startISO = document.getElementById("startDate").value;
  if(!startISO) return;
  weekDates = buildWeekFrom(startISO);
  if(!selectedDateISO || !weekDates.includes(selectedDateISO)){
    selectedDateISO = weekDates[0];
  }
  renderCalendarStrip();
  renderTasksForSelectedDay();
  updateProgressAndFlag();
}

/* ================================
   TASKS MODEL (DOM as source of truth)
   Stored fields:
   - task_{ISO}_{id}_text
   - task_{ISO}_{id}_done
================================== */
function uid(){
  return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function tasksArea(){ return document.getElementById("tasksArea"); }

function addTaskRow(dateISO, text="", done=false){
  const id = uid();
  const row = document.createElement("div");
  row.className = "taskRow";
  row.dataset.date = dateISO;
  row.dataset.tid = id;
  row.innerHTML = `
    <input type="checkbox" data-key="task_${dateISO}_${id}_done" aria-label="Done">
    <input type="text" data-key="task_${dateISO}_${id}_text" placeholder="Task" aria-label="Task">
    <span class="x" role="button" aria-label="Remove">×</span>
  `;
  row.querySelector(`[data-key="task_${dateISO}_${id}_done"]`).checked = !!done;
  row.querySelector(`[data-key="task_${dateISO}_${id}_text"]`).value = text || "";
  row.querySelector(".x").addEventListener("click", ()=>{
    row.remove();
    updateProgressAndFlag();
    debounceSave();
    renderCalendarStrip(); // update mini counts
  });
  tasksArea().appendChild(row);
}

function getAllTaskRows(){
  return Array.from(document.querySelectorAll(".taskRow"));
}

function renderTasksForSelectedDay(){
  // show only tasks for selected date (simple)
  getAllTaskRows().forEach(r=>{
    r.style.display = (r.dataset.date === selectedDateISO) ? "flex" : "none";
  });

  // if none exist, keep it clean (no filler text)
  const visible = getAllTaskRows().some(r => r.dataset.date === selectedDateISO);
  if(!visible){
    // do nothing; empty state is fine (simplicity)
  }
}

function seedNewRecordIfEmpty(){
  // if there are no tasks at all, create 1 blank on day 1 to reduce friction
  if(getAllTaskRows().length === 0 && weekDates.length){
    addTaskRow(weekDates[0], "", false);
  }
}

/* ================================
   CALENDAR STRIP RENDER
================================== */
function countForDate(dateISO){
  const rows = getAllTaskRows().filter(r => r.dataset.date === dateISO);
  const total = rows.length;
  const done = rows.filter(r => r.querySelector('input[type="checkbox"]').checked).length;
  return { total, done };
}

function renderCalendarStrip(){
  const strip = document.getElementById("calStrip");
  strip.innerHTML = "";

  weekDates.forEach(dateISO=>{
    const d = parseISO(dateISO);
    const { total, done } = countForDate(dateISO);

    const card = document.createElement("div");
    card.className = "dayCard" + (dateISO === selectedDateISO ? " active" : "");
    card.innerHTML = `
      <div class="dow">${fmtDow(d)}</div>
      <div class="date">${fmtMD(d)}</div>
      <div class="mini"><span>Done</span><strong>${done}/${total}</strong></div>
    `;
    card.addEventListener("click", ()=>{
      selectedDateISO = dateISO;
      renderCalendarStrip();
      renderTasksForSelectedDay();
      updateProgressAndFlag();
      debounceSave();
    });

    strip.appendChild(card);
  });
}

/* ================================
   PROGRESS + FLAG
================================== */
function updateProgressAndFlag(){
  const all = getAllTaskRows();
  const checks = all.map(r => r.querySelector('input[type="checkbox"]'));
  const total = checks.length;
  const done = checks.filter(c => c.checked).length;

  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById("kpiText").textContent = `${done}/${total}`;

  const fill = document.getElementById("fillBar");
  fill.style.width = pct + "%";

  const pill = document.getElementById("flagPill");
  pill.className = "flag";
  if(total === 0){
    pill.textContent = "—";
    pill.classList.add();
  } else if(pct >= 70){
    pill.textContent = "On track";
    pill.classList.add("good");
  } else if(pct >= 35){
    pill.textContent = "Watch";
    pill.classList.add("warn");
  } else {
    pill.textContent = "Urgent";
    pill.classList.add("bad");
  }

  // Update subtext
  const sub = document.getElementById("subText");
  sub.textContent = (mode === "staff") ? "Staff view" : "Student view";
}

/* ================================
   DATA COLLECTION / APPLY
================================== */
function allFields(){
  // include dynamic task inputs (data-key), plus core inputs
  return document.querySelectorAll(
    "[data-key], #studentName, #sport, #startDate, #ls, #counselor, #note"
  );
}

function collectData(){
  const data = {};
  allFields().forEach(el=>{
    const key = el.getAttribute("data-key") || el.id;
    data[key] = (el.type === "checkbox") ? el.checked : el.value;
  });

  // meta
  const sk = stableKey();
  data["recordKey"] = sk.key;
  data["Student Name"] = sk.student;
  data["Start Date"] = sk.start;
  data["selectedDateISO"] = selectedDateISO || "";
  data["weekDates"] = JSON.stringify(weekDates || []);

  return data;
}

function applyLoaded(obj){
  isApplyingLoad = true;

  // Core
  document.getElementById("sport").value = obj.sport || "";
  document.getElementById("ls").value = obj.ls || "";
  document.getElementById("counselor").value = obj.counselor || "";
  document.getElementById("note").value = obj.note || "";

  // Week dates + selected date
  try{
    const w = JSON.parse(obj.weekDates || "[]");
    if(Array.isArray(w) && w.length === 7) weekDates = w;
  }catch(e){}
  selectedDateISO = obj.selectedDateISO || (weekDates[0] || document.getElementById("startDate").value || "");

  // Clear tasks and rebuild from keys
  tasksArea().innerHTML = "";
  Object.keys(obj).forEach(k=>{
    const m = k.match(/^task_(\d{4}-\d{2}-\d{2})_(.+)_text$/);
    if(m){
      const dateISO = m[1];
      const id = m[2];
      const text = obj[k] || "";
      const doneKey = `task_${dateISO}_${id}_done`;
      const done = (obj[doneKey] === true || obj[doneKey] === "true");
      // recreate with same id (to preserve)
      const row = document.createElement("div");
      row.className = "taskRow";
      row.dataset.date = dateISO;
      row.dataset.tid = id;
      row.innerHTML = `
        <input type="checkbox" data-key="task_${dateISO}_${id}_done" aria-label="Done">
        <input type="text" data-key="task_${dateISO}_${id}_text" placeholder="Task" aria-label="Task">
        <span class="x" role="button" aria-label="Remove">×</span>
      `;
      row.querySelector(`[data-key="task_${dateISO}_${id}_done"]`).checked = !!done;
      row.querySelector(`[data-key="task_${dateISO}_${id}_text"]`).value = text || "";
      row.querySelector(".x").addEventListener("click", ()=>{
        row.remove();
        updateProgressAndFlag();
        debounceSave();
        renderCalendarStrip();
      });
      tasksArea().appendChild(row);
    }
  });

  // If weekDates missing, rebuild from startDate
  const startISO = document.getElementById("startDate").value;
  if(!weekDates.length && startISO) weekDates = buildWeekFrom(startISO);

  // Ensure selection in range
  if(!weekDates.includes(selectedDateISO)) selectedDateISO = weekDates[0] || selectedDateISO;

  seedNewRecordIfEmpty();
  renderCalendarStrip();
  renderTasksForSelectedDay();
  updateProgressAndFlag();

  lastSavedHash = JSON.stringify(collectData());
  isApplyingLoad = false;
}

/* ================================
   SAVE / LOAD (server + local)
================================== */
function debounceSave(){
  if(isApplyingLoad) return;
  if(!hasRequiredKey()){
    setStatus("Idle","set Student + Start date");
    return;
  }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>saveAll(false), 650);
  setStatus("Typing","autosave");
}

async function saveAll(force=false){
  if(!hasRequiredKey()){
    setStatus("Idle","set Student + Start date");
    return;
  }

  const data = collectData();
  const h = JSON.stringify(data);
  if(!force && h === lastSavedHash){
    setStatus("Saved","up to date");
    return;
  }

  cacheSave(data);

  try{
    setStatus("Saving","syncing");
    await fetch(webAppURL, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(data)
    });
    lastSavedHash = h;
    setStatus("Saved", nowStamp());
  }catch(err){
    setStatus("Offline","saved locally");
  }
}

async function loadRecord(silent=false){
  if(!hasRequiredKey()){
    setStatus("Idle","set Student + Start date");
    if(!silent) toast("Set Student + Start date");
    return;
  }

  setStatus("Loading","shared");
  const sk = stableKey();

  // server first
  try{
    const url = webAppURL + "?studentName=" + encodeURIComponent(sk.student) + "&weekOf=" + encodeURIComponent(sk.start);
    const res = await fetch(url, { method:"GET" });
    const obj = await res.json();
    if(obj && !obj.error){
      applyLoaded(obj);
      setStatus("Loaded", nowStamp());
      if(!silent) toast("Loaded");
      return;
    }
  }catch(e){}

  // local fallback
  const cached = cacheLoad();
  if(cached){
    applyLoaded(cached);
    setStatus("Loaded (local)", nowStamp());
    if(!silent) toast("Loaded (local)");
  }else{
    setStatus("Not found","");
    if(!silent) toast("No record found");
  }
}

/* ================================
   MODE TOGGLE
================================== */
function setMode(next){
  mode = next;
  const sBtn = document.getElementById("studentModeBtn");
  const tBtn = document.getElementById("staffModeBtn");
  sBtn.classList.toggle("active", mode === "student");
  tBtn.classList.toggle("active", mode === "staff");

  document.querySelectorAll(".staffOnly").forEach(el=>{
    el.classList.toggle("show", mode === "staff");
  });

  updateProgressAndFlag();
}

document.getElementById("studentModeBtn").addEventListener("click", ()=>setMode("student"));
document.getElementById("staffModeBtn").addEventListener("click", ()=>setMode("staff"));

/* ================================
   BUTTONS
================================== */
document.getElementById("loadWeekBtn").addEventListener("click", ()=>{
  // set startDate to today; week begins today
  const todayISO = iso(new Date());
  document.getElementById("startDate").value = todayISO;
  selectedDateISO = todayISO;
  ensureWeek();
  toast("Week loaded");
  onKeyChanged();
});

document.getElementById("printBtn").addEventListener("click", ()=>{
  window.print();
});

document.getElementById("shareBtn").addEventListener("click", async ()=>{
  const sk = stableKey();
  if(!sk.student || !sk.start){ toast("Set Student + Start date"); return; }
  const url = new URL(window.location.href);
  url.searchParams.set("student", sk.student);
  url.searchParams.set("start", sk.start);
  url.searchParams.set("day", selectedDateISO || "");
  try{
    await navigator.clipboard.writeText(url.toString());
    toast("Copied");
  }catch(e){
    toast("Copy failed");
  }
});

document.getElementById("addTaskBtn").addEventListener("click", ()=>{
  if(!selectedDateISO){
    toast("Pick a date");
    return;
  }
  addTaskRow(selectedDateISO, "", false);
  renderTasksForSelectedDay();
  updateProgressAndFlag();
  renderCalendarStrip();
  debounceSave();
});

document.getElementById("studyHallBtn").addEventListener("click", ()=>{
  if(!selectedDateISO){ toast("Pick a date"); return; }
  [
    "Open LMS + check due dates",
    "Work 25 minutes (no phone)",
    "Submit + confirm submission"
  ].forEach(t=>addTaskRow(selectedDateISO, t, false));
  renderTasksForSelectedDay();
  updateProgressAndFlag();
  renderCalendarStrip();
  debounceSave();
  toast("Added");
});

document.getElementById("saveNowBtn").addEventListener("click", ()=>saveAll(true));

document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(confirm("Reset page?")) location.reload();
});

/* ================================
   LIST EDITOR SAVE
================================== */
document.getElementById("saveListsBtn").addEventListener("click", ()=>{
  const ls = document.getElementById("lsList").value.split("\n").map(s=>s.trim()).filter(Boolean);
  const counselors = document.getElementById("counselorList").value.split("\n").map(s=>s.trim()).filter(Boolean);
  const sports = document.getElementById("sportList").value.split("\n").map(s=>s.trim()).filter(Boolean);

  const lists = {
    ls: ls.length ? ls : DEFAULTS.ls,
    counselors: counselors.length ? counselors : DEFAULTS.counselors,
    sports: sports.length ? sports : DEFAULTS.sports
  };
  saveListsToStorage(lists);
  applyListsToUI(lists);
  toast("Lists saved");
});

/* ================================
   KEY CHANGES
================================== */
function onKeyChanged(){
  if(!hasRequiredKey()){
    setStatus("Idle","set Student + Start date");
    return;
  }
  ensureWeek();

  // If local exists, load silently to reduce friction
  const cached = cacheLoad();
  if(cached){
    applyLoaded(cached);
    setStatus("Ready","local");
  }else{
    seedNewRecordIfEmpty();
    renderCalendarStrip();
    renderTasksForSelectedDay();
    updateProgressAndFlag();
    setStatus("Ready","new");
  }

  // try silent server load (freshness)
  loadRecord(true);
}

/* ================================
   INPUT / CHANGE HANDLERS
================================== */
document.addEventListener("input", (e)=>{
  if(isApplyingLoad) return;

  // ignore key fields in autosave until set
  if(e.target && (e.target.id === "studentName" || e.target.id === "startDate")) return;

  updateProgressAndFlag();
  renderCalendarStrip();
  debounceSave();
});

document.addEventListener("change", (e)=>{
  if(isApplyingLoad) return;

  if(e.target && (e.target.id === "studentName" || e.target.id === "startDate")){
    // when start date changes, rebuild week from that date
    if(e.target.id === "startDate"){
      selectedDateISO = document.getElementById("startDate").value || "";
    }
    onKeyChanged();
    return;
  }

  updateProgressAndFlag();
  renderCalendarStrip();
  debounceSave();
});

/* ================================
   URL PREFILL (share)
================================== */
(function prefillFromURL(){
  const url = new URL(window.location.href);
  const student = url.searchParams.get("student");
  const start = url.searchParams.get("start");
  const day = url.searchParams.get("day");

  if(student) document.getElementById("studentName").value = student;
  if(start) document.getElementById("startDate").value = start;

  if(start){
    weekDates = buildWeekFrom(start);
    selectedDateISO = (day && weekDates.includes(day)) ? day : weekDates[0];
    renderCalendarStrip();
  }

  // Initialize editor + selects
  initListEditor();

  // default mode student
  setMode("student");

  if(student && start){
    onKeyChanged();
  }else{
    setStatus("Idle","set Student + Start date");
    ensureWeek();
    seedNewRecordIfEmpty();
    renderCalendarStrip();
    renderTasksForSelectedDay();
    updateProgressAndFlag();
  }
})();

/* ================================
   INITIAL BOOT (lists + selects)
================================== */
if(!document.getElementById("sport").options.length){
  initListEditor();
}
</script>
</body>
</html>
