// Returns true when viewport is 768px or narrower (phone/small tablet)
function useIsMobile() {
  const [isMobile, setIsMobile] = useState(typeof window !== "undefined" && window.innerWidth <= 768);
  useEffect(() => {
    const handler = () => setIsMobile(window.innerWidth <= 768);
    window.addEventListener("resize", handler);
    return () => window.removeEventListener("resize", handler);
  }, []);
  return isMobile;
}

function WorkModePage({ assignment: a, onBack, onSessionSaved }) {
  const [time, setTime] = useState(0);
  const [timerOn, setTimerOn] = useState(false);
  const [effort, setEffort] = useState(3);
  const [understanding, setUnderstanding] = useState(3);
  const [notes, setNotes] = useState("");
  const [completionType, setCompletionType] = useState("in_progress");
  const [saved, setSaved] = useState(false);
  const [activePrompt, setActivePrompt] = useState(null);
  const [promptResponses, setPromptResponses] = useState({});
  const [expandedBreakdown, setExpandedBreakdown] = useState({});
  const [isLoadingBreakdown, setIsLoadingBreakdown] = useState({});
  // CHANGED: Added aiBreakdownText to store real AI responses keyed by promptId
  const [aiBreakdownText, setAiBreakdownText] = useState({});
  const timerRef = useRef(null);
 
  useEffect(() => {
    if (timerOn) timerRef.current = setInterval(() => setTime(p=>p+1), 1000);
    else clearInterval(timerRef.current);
    return () => clearInterval(timerRef.current);
  }, [timerOn]);
 
  const fmt = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
 
  // CHANGED: Removed direct Anthropic API call from frontend.
  // Now calls /api/ai-breakdown on the backend which holds the API key securely.
  // Frontend only sends assignment data and the selected prompt — no API key ever touches the browser.
  const handleBreakdown = async (promptId) => {
    const prompt = GUIDED_PROMPTS.find(p => p.id === promptId);
    if (!prompt) return;
 
    setIsLoadingBreakdown(p => ({ ...p, [promptId]: true }));
 
    try {
      const response = await fetch("/api/ai-breakdown", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          // Assignment context
          assignment: {
            title: a.title,
            course: a.course,
            courseCode: a.courseCode || "",
            dueDate: a.dueDate ? a.dueDate.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }) : "",
            points: a.points || "",
            description: a.description || "",
            instructions: a.instructions || "",
            rubric: a.rubric || "",
          },
          // The specific guided prompt being expanded
          prompt: {
            id: prompt.id,
            question: prompt.question,
            aiPrompt: prompt.aiPrompt,
          },
        }),
      });
 
      const data = await response.json();
 
      if (data?.text) {
        setAiBreakdownText(p => ({ ...p, [promptId]: data.text }));
      } else {
        // Fallback if backend returns empty

// Weekly schedule view — shows today's appointments prominently,
// full week below, and caseload health summary at a glance.
function StaffDashboard({ onSelectStudent }) {
  const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
  const today = new Date();
  // 0=Sun,1=Mon...6=Sat — map to our 1-5 day index
  const todayIdx = today.getDay() === 0 ? 6 : today.getDay(); // 1=Mon..5=Fri
 
  // Build schedule: for each student, for each slot, create appointment object
  const allAppts = [];
  STUDENTS.forEach(s => {
    (s.schedule || []).forEach(slot => {
      allAppts.push({ student: s, day: slot.day, time: slot.time, room: slot.room });
    });
  });
 
  // Sort by time
  const sortByTime = (a, b) => {
    const toMins = t => {
      const [time, ampm] = t.split(" ");
      let [h, m] = time.split(":").map(Number);
      if (ampm === "PM" && h !== 12) h += 12;
      if (ampm === "AM" && h === 12) h = 0;
      return h * 60 + m;
    };
    return toMins(a.time) - toMins(b.time);
  };
 
  const todayAppts = allAppts.filter(a => a.day === todayIdx).sort(sortByTime);
  const isWeekend = todayIdx > 5;
 
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>
 
      {/* Header */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div>
          <h1 style={{ fontSize: 26, fontWeight: 900, color: UA.text, margin: 0, letterSpacing: "-0.02em" }}>
            Good morning, Dr. Martinez 👋
          </h1>
          <p style={{ color: UA.textMuted, marginTop: 4, fontSize: 14 }}>
            {isWeekend ? "No sessions scheduled today — enjoy your weekend" : `${todayAppts.length} appointment${todayAppts.length !== 1 ? "s" : ""} today · ${today.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })}`}
          </p>
        </div>
      </div>
 
      {/* Caseload health summary */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 14 }}>
        {[
          { label: "Total Students", value: STUDENTS.length, color: UA.navy, icon: "👥", sub: "in your caseload" },
          { label: "High Risk", value: STUDENTS.filter(s => s.dynamicRisk === "high").length, color: UA.red, icon: "🔴", sub: "need attention" },
          { label: "Sessions Today", value: isWeekend ? 0 : todayAppts.length, color: UA.navy, icon: "📅", sub: "appointments" },
          { label: "Missing Work", value: STUDENTS.reduce((sum, s) => sum + s.missedAssignments, 0), color: UA.orange, icon: "⚠️", sub: "across caseload" },
        ].map((s, i) => (
          <Card key={i} style={{ padding: "18px 20px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div>
                <div style={{ fontSize: 11, color: UA.textMuted, fontWeight: 600, letterSpacing: "0.04em", textTransform: "uppercase", marginBottom: 8 }}>{s.label}</div>
                <div style={{ fontSize: 34, fontWeight: 900, color: s.color, lineHeight: 1 }}>{s.value}</div>
                <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 5 }}>{s.sub}</div>
              </div>
              <span style={{ fontSize: 22 }}>{s.icon}</span>
            </div>
          </Card>
        ))}
      </div>
 
      {/* High risk alert */}
      {STUDENTS.filter(s => s.dynamicRisk === "high").length > 0 && (
        <div style={{ background: UA.redLight, border: `1px solid ${UA.redBorder}`, borderRadius: UA.radius, padding: "14px 18px", display: "flex", gap: 12, alignItems: "flex-start" }}>
          <span style={{ fontSize: 18 }}>⚠️</span>
          <div>
            <div style={{ fontWeight: 700, color: UA.red, fontSize: 13, marginBottom: 3 }}>Students requiring intervention</div>
            <div style={{ fontSize: 13, color: UA.redDark, lineHeight: 1.5 }}>
              {STUDENTS.filter(s => s.dynamicRisk === "high").map(s => s.name).join(" and ")} {STUDENTS.filter(s => s.dynamicRisk === "high").length === 1 ? "is" : "are"} flagged High Risk. Review their profiles before your next session.
            </div>
          </div>
        </div>
      )}
 
      {/* Today's appointments */}
      <Card style={{ padding: "22px 24px" }}>
        <div style={{ fontWeight: 800, fontSize: 16, color: UA.text, marginBottom: 4 }}>
          📅 {isWeekend ? "No Sessions Today" : `Today — ${today.toLocaleDateString("en-US", { weekday: "long" })}`}
        </div>
        <div style={{ fontSize: 12, color: UA.textMuted, marginBottom: 16 }}>All sessions 45 minutes · You are the host</div>
        {isWeekend || todayAppts.length === 0 ? (
          <div style={{ textAlign: "center", padding: "28px 0", color: UA.textMuted, fontSize: 14 }}>
            {isWeekend ? "No sessions on weekends — see you Monday!" : "No appointments scheduled for today"}
          </div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {todayAppts.map((appt, i) => {

                  {/* Room */}
                  <div style={{ textAlign: "right", flexShrink: 0 }}>

                  </div>
                  {/* Risk badge */}
                  <RiskBadge level={s.dynamicRisk} />

                  <span style={{ color: UA.textMuted, fontSize: 16 }}>›</span>

// ADDED: Fast inline assignment entry — type multiple assignments rapidly
// without opening a modal for each one. Replaces the Teamworks free-text workflow
// where staff typed all assignments into one description box.
function QuickAddAssignments({ courses, onAdd }) {
  const [rows, setRows] = useState([{ title: "", courseCode: "", dueDate: "", points: "" }]);
  const [saved, setSaved] = useState(false);
 
  const updateRow = (i, k, v) => setRows(prev => prev.map((r, idx) => idx === i ? { ...r, [k]: v } : r));
  const addRow = () => setRows(prev => [...prev, { title: "", courseCode: "", dueDate: "", points: "" }]);
  const removeRow = (i) => setRows(prev => prev.filter((_, idx) => idx !== i));
 
  const handleSave = () => {
    const valid = rows.filter(r => r.title.trim() && r.dueDate);
    if (!valid.length) return;
    valid.forEach(r => {
      const days = (new Date(r.dueDate) - Date.now()) / 86400000;
      const urgency = days < 3 ? "red" : days < 7 ? "yellow" : "green";
      const course = courses?.find(c => c.code === r.courseCode);
      onAdd({
        id: Date.now() + Math.random(),
        title: r.title,
        course: course?.name || r.courseCode || "Other",
        courseCode: r.courseCode,
        dueDate: new Date(r.dueDate),
        points: parseInt(r.points) || 0,
        status: "not_started",
        urgency,
        description: "", instructions: "", rubric: "", d2lLink: "",
      });
    });
    setRows([{ title: "", courseCode: "", dueDate: "", points: "" }]);
    setSaved(true);
    setTimeout(() => setSaved(false), 2500);
  };
 
  return (
    <Card>
      <div style={{ fontWeight: 800, fontSize: 14, color: UA.text, marginBottom: 4 }}>⚡ Quick Add Assignments</div>
      <div style={{ fontSize: 12, color: UA.textMuted, marginBottom: 14 }}>Add multiple assignments fast — one row per assignment</div>
      {/* Column headers */}
      <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr 80px 32px", gap: 8, marginBottom: 6 }}>
        {["Assignment Title", "Course", "Due Date", "Points", ""].map((h, i) => (
          <div key={i} style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, textTransform: "uppercase", letterSpacing: "0.04em" }}>{h}</div>
        ))}
      </div>
      {rows.map((row, i) => (
        <div key={i} style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr 80px 32px", gap: 8, marginBottom: 8 }}>
          <input value={row.title} onChange={e => updateRow(i, "title", e.target.value)} placeholder="Assignment title..."
            style={{ padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none" }}
            onFocus={e => e.target.style.borderColor = UA.navy} onBlur={e => e.target.style.borderColor = UA.border} />
          <select value={row.courseCode} onChange={e => updateRow(i, "courseCode", e.target.value)}
            style={{ padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none", background: "white" }}>
            <option value="">Course...</option>
            {(courses || []).map(c => <option key={c.code} value={c.code}>{c.code}</option>)}
          </select>
          <input type="date" value={row.dueDate} onChange={e => updateRow(i, "dueDate", e.target.value)}
            style={{ padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none" }} />
          <input type="number" value={row.points} onChange={e => updateRow(i, "points", e.target.value)} placeholder="pts"
            style={{ padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none" }} />
          <button onClick={() => removeRow(i)} disabled={rows.length === 1}
            style={{ padding: "8px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, background: "white", cursor: rows.length === 1 ? "not-allowed" : "pointer", color: UA.textMuted, fontSize: 14, opacity: rows.length === 1 ? 0.3 : 1 }}>✕</button>
        </div>
      ))}
      <div style={{ display: "flex", gap: 10, marginTop: 10 }}>
        <Btn variant="ghost" size="sm" onClick={addRow}>+ Add Row</Btn>
        <Btn size="sm" onClick={handleSave}>Save All</Btn>
        {saved && <span style={{ fontSize: 13, color: UA.green, fontWeight: 700, alignSelf: "center" }}>✓ Assignments added</span>}
      </div>
    </Card>
  );
}

// Student view: personal assignment and effort progress

function AnalyticsPage({ role, assignments = ASSIGNMENTS }) {

    const statusData = [
      { name: "Completed", value: assignments.filter(a=>a.status==="completed").length, fill: UA.green },

              <PieChart><Pie data={statusData} cx="50%" cy="50%" outerRadius={80} dataKey="value" label={({name,value})=>value>0?`${name}: ${value}`:""}>
                {statusData.map((e,i)=><Cell key={i} fill={e.fill}/>)}

            </ResponsiveContainer>
          </Card>
          <Card>
            <div style={{ fontWeight: 800, fontSize: 14, color: UA.text, marginBottom: 4 }}>Effort & Understanding</div>
            <div style={{ fontSize: 12, color: UA.textMuted, marginBottom: 16 }}>Weekly trend (out of 5)</div>
            <ResponsiveContainer width="100%" height={220}>
              <LineChart data={EFFORT_TREND}>
                <CartesianGrid strokeDasharray="3 3" stroke={UA.border} />
                <XAxis dataKey="week" tick={{ fontSize: 11, fill: UA.textMuted }} axisLine={false} tickLine={false} />

            </ResponsiveContainer>
          </Card>
        </div>
      </div>
    );
  }
 
  // -- STAFF / CASELOAD VIEW ------------------------------------------------
  // Students who haven't logged a session recently
  const needsAttention = STUDENTS.filter(s => s.lastSession.includes("3 days") || s.lastSession.includes("4 days") || s.lastSession.includes("5 days") || s.lastSession.includes("6 days") || s.lastSession === "TBD - awaiting response");
 
  // Missing assignments by course across caseload
  const missingByCourse = {};
  ASSIGNMENTS.filter(a => a.status === "missing").forEach(a => {
    missingByCourse[a.course] = (missingByCourse[a.course] || 0) + 1;

  const courseData = Object.entries(missingByCourse).map(([course, count]) => ({ course: course.split(" ").slice(0,2).join(" "), count })).sort((a,b) => b.count - a.count);
 
  // Effort by risk level
  const riskEffort = [
    { risk: "High Risk", effort: +(STUDENTS.filter(s=>s.dynamicRisk==="high").reduce((s,st)=>s+st.avgEffort,0)/Math.max(1,STUDENTS.filter(s=>s.dynamicRisk==="high").length)).toFixed(1), understanding: +(STUDENTS.filter(s=>s.dynamicRisk==="high").reduce((s,st)=>s+st.avgUnderstanding,0)/Math.max(1,STUDENTS.filter(s=>s.dynamicRisk==="high").length)).toFixed(1) },
    { risk: "Med Risk", effort: +(STUDENTS.filter(s=>s.dynamicRisk==="medium").reduce((s,st)=>s+st.avgEffort,0)/Math.max(1,STUDENTS.filter(s=>s.dynamicRisk==="medium").length)).toFixed(1), understanding: +(STUDENTS.filter(s=>s.dynamicRisk==="medium").reduce((s,st)=>s+st.avgUnderstanding,0)/Math.max(1,STUDENTS.filter(s=>s.dynamicRisk==="medium").length)).toFixed(1) },
    { risk: "Low Risk", effort: +(STUDENTS.filter(s=>s.dynamicRisk==="low").reduce((s,st)=>s+st.avgEffort,0)/Math.max(1,STUDENTS.filter(s=>s.dynamicRisk==="low").length)).toFixed(1), understanding: +(STUDENTS.filter(s=>s.dynamicRisk==="low").reduce((s,st)=>s+st.avgUnderstanding,0)/Math.max(1,STUDENTS.filter(s=>s.dynamicRisk==="low").length)).toFixed(1) },
  ];
 
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 22 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <SectionTitle sub="Caseload-level trends and intervention signals">Caseload Analytics</SectionTitle>
        <Btn variant="secondary">📄 Export Weekly Report</Btn>

      {/* Summary stats */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 14 }}>
        {[
          { label: "Avg Caseload Effort", value: (STUDENTS.reduce((s,st)=>s+st.avgEffort,0)/STUDENTS.length).toFixed(1)+"/5", color: UA.navy, icon: "💪" },
          { label: "Avg Understanding", value: (STUDENTS.reduce((s,st)=>s+st.avgUnderstanding,0)/STUDENTS.length).toFixed(1)+"/5", color: UA.navy, icon: "🧠" },
          { label: "Total Missing", value: STUDENTS.reduce((s,st)=>s+st.missedAssignments,0), color: UA.red, icon: "⚠️" },
          { label: "Total Study Hours", value: STUDENTS.reduce((s,st)=>s+st.totalHours,0)+"h", color: UA.green, icon: "⏱" },
        ].map((s,i)=>(
          <Card key={i} style={{ padding: "18px 20px" }}>
            <div style={{ display: "flex", justifyContent: "space-between" }}>
              <div>
                <div style={{ fontSize: 11, color: UA.textMuted, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 8 }}>{s.label}</div>

              </div>
              <span style={{ fontSize: 24 }}>{s.icon}</span>

          </Card>

      </div>
 
      {/* Needs attention */}
      {needsAttention.length > 0 && (
        <Card style={{ border: `1.5px solid ${UA.redBorder}`, background: UA.redLight }}>
          <div style={{ fontWeight: 800, fontSize: 14, color: UA.red, marginBottom: 12 }}>⚠️ Students with no recent session</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {needsAttention.map(s => (
              <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 14px", borderRadius: UA.radiusSm, background: "white", border: `1px solid ${UA.redBorder}` }}>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18 }}>
        {/* Missing assignments by course */}

        {/* Effort & understanding by risk level */}
        <Card>
          <div style={{ fontWeight: 800, fontSize: 14, color: UA.text, marginBottom: 4 }}>Effort & Understanding by Risk Level</div>
          <div style={{ fontSize: 12, color: UA.textMuted, marginBottom: 16 }}>Average across each risk group</div>
          <ResponsiveContainer width="100%" height={200}>
            <BarChart data={riskEffort}>
              <CartesianGrid strokeDasharray="3 3" stroke={UA.border} />
              <XAxis dataKey="risk" tick={{ fontSize: 11, fill: UA.textMuted }} axisLine={false} tickLine={false} />
              <YAxis domain={[0,5]} tick={{ fontSize: 11, fill: UA.textMuted }} axisLine={false} tickLine={false} />
              <Tooltip contentStyle={{ borderRadius: UA.radiusSm, border: `1px solid ${UA.border}` }} />
              <Legend wrapperStyle={{ fontSize: 12 }} />

      {/* Individual student comparison */}
      <Card>
        <div style={{ fontWeight: 800, fontSize: 14, color: UA.text, marginBottom: 4 }}>Student Comparison</div>
        <div style={{ fontSize: 12, color: UA.textMuted, marginBottom: 16 }}>Effort and understanding ratings across your caseload</div>

function SettingsPage({ role }) {
  const [saved, setSaved] = useState(false);
  const [notifPrefs, setNotifPrefs] = useState({
    highRisk: true, missedSession: true, missingAssignment: true,
    lowUnderstanding: true, sessionComplete: false, weeklyReport: true,
  });
  const toggleNotif = (key) => setNotifPrefs(p => ({ ...p, [key]: !p[key] }));
  const isStaff = role !== "student";
 
  // LS can add their own students directly for the pilot
  const [caseload, setCaseload] = useState(STUDENTS);
  const [showAddStudent, setShowAddStudent] = useState(false);
  const [newStudent, setNewStudent] = useState({ name: "", sport: "", year: "Freshman", email: "", counselor: "" });
  const [studentSaved, setStudentSaved] = useState(false);
 
  const handleAddStudent = () => {
    if (!newStudent.name.trim() || !newStudent.sport.trim()) return;
    const initials = newStudent.name.split(" ").map(n => n[0]).join("").toUpperCase().slice(0,2);
    const student = {
      id: Date.now(), name: newStudent.name, email: newStudent.email,
      sport: newStudent.sport, initials, year: newStudent.year,
      gpa: 0, intakeRisk: "medium", dynamicRisk: "medium", riskScore: 50,
      lastSession: "Not yet", missedAssignments: 0, avgEffort: 0,
      avgUnderstanding: 0, totalHours: 0, counselor: newStudent.counselor || "TBD",
      courses: [], weeklyPlan: "", nextSession: "Not scheduled", schedule: [],
    };
    setCaseload(prev => [...prev, student]);
    setNewStudent({ name: "", sport: "", year: "Freshman", email: "", counselor: "" });
    setShowAddStudent(false);
    setStudentSaved(true);
    setTimeout(() => setStudentSaved(false), 3000);
  };
 
  const profileFields = isStaff

  return (

// Assignment entry for staff — manual quick-add, ICS/D2L import, and sync status
function EntryHubPage({ onAddAssignment }) {
  const [selectedStudentId, setSelectedStudentId] = useState(STUDENTS[0].id);
  const [rows, setRows] = useState([{ title: "", courseCode: "", dueDate: "", points: "" }]);
  const [saved, setSaved] = useState(false);
  const [icsUrl, setIcsUrl] = useState("");
  const [icsStatus, setIcsStatus] = useState(null);
  const [importing, setImporting] = useState(false);
  const [importedCount, setImportedCount] = useState(0);
 
  const student = STUDENTS.find(s => s.id === selectedStudentId);
 
  const updateRow = (i, k, v) => setRows(prev => prev.map((r, idx) => idx === i ? { ...r, [k]: v } : r));
  const addRow = () => setRows(prev => [...prev, { title: "", courseCode: "", dueDate: "", points: "" }]);
  const removeRow = (i) => setRows(prev => prev.filter((_, idx) => idx !== i));
 
  const handleSaveRows = () => {
    const valid = rows.filter(r => r.title.trim() && r.dueDate);
    if (!valid.length) return;
    valid.forEach(r => {
      const days = (new Date(r.dueDate) - Date.now()) / 86400000;
      const urgency = days < 3 ? "red" : days < 7 ? "yellow" : "green";
      const course = student.courses?.find(c => c.code === r.courseCode);
      onAddAssignment({
        id: Date.now() + Math.random(),
        title: r.title,
        course: course?.name || r.courseCode || "Other",
        courseCode: r.courseCode,
        dueDate: new Date(r.dueDate),
        points: parseInt(r.points) || 0,
        status: "not_started", urgency,
        description: "", instructions: "", rubric: "", d2lLink: "",
      });
    });
    setRows([{ title: "", courseCode: "", dueDate: "", points: "" }]);
    setSaved(true);
    setTimeout(() => setSaved(false), 2500);
  };
 
  // Simulates parsing a D2L ICS calendar feed and importing assignments
  const handleICSImport = () => {
    if (!icsUrl.trim()) return;
    setImporting(true);
    setIcsStatus(null);
    // Simulate async fetch + parse of ICS feed
    setTimeout(() => {
      const mockImported = [
        { title: "SPAN 304 VHL Assignment", courseCode: "SPAN304", dueDate: new Date(Date.now() + 3*86400000) },
        { title: "RELI 150 Discussion Post", courseCode: "RELI150", dueDate: new Date(Date.now() + 5*86400000) },
        { title: "SPAN 102 Intro Video", courseCode: "SPAN102", dueDate: new Date(Date.now() + 2*86400000) },
      ];
      mockImported.forEach(a => {
        const days = (a.dueDate - Date.now()) / 86400000;
        onAddAssignment({
          id: Date.now() + Math.random(),
          title: a.title, course: a.courseCode, courseCode: a.courseCode,
          dueDate: a.dueDate, points: 0, status: "not_started",
          urgency: days < 3 ? "red" : days < 7 ? "yellow" : "green",
          description: "", instructions: "", rubric: "", d2lLink: "",
        });
      });
      setImportedCount(mockImported.length);
      setIcsStatus("success");
      setImporting(false);
      setIcsUrl("");
    }, 1800);
  };
 
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 22 }}>
      <SectionTitle sub="Manually enter assignments or import from D2L — until automatic sync is live">Entry Hub</SectionTitle>
 
      {/* Student selector */}
      <Card style={{ padding: "16px 20px" }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 10 }}>Entering assignments for</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {STUDENTS.map(s => (
            <button key={s.id} onClick={() => setSelectedStudentId(s.id)}
              style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 14px", borderRadius: 99, border: `1.5px solid ${selectedStudentId === s.id ? UA.navy : UA.border}`, background: selectedStudentId === s.id ? UA.navy : "white", cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s" }}>
              <Avatar initials={s.initials} size={22} color={selectedStudentId === s.id ? "white" : UA.navy} />
              <span style={{ fontSize: 13, fontWeight: 700, color: selectedStudentId === s.id ? "white" : UA.text }}>{s.name.split(" ")[0]}</span>
            </button>
          ))}
        </div>
      </Card>
 
      {/* D2L ICS Import */}
      <Card style={{ border: `1.5px solid ${UA.navyBorder}`, background: UA.navyLight }}>
        <div style={{ fontWeight: 800, fontSize: 14, color: UA.navy, marginBottom: 4 }}>🔗 Import from D2L Calendar</div>
        <div style={{ fontSize: 12, color: UA.textMuted, marginBottom: 14, lineHeight: 1.6 }}>
          Paste a D2L calendar feed URL (ICS format) to import assignments automatically. In D2L: Calendar → Subscribe → Copy feed URL.
          Once IT connects the full sync this will happen automatically every 6 hours.
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr auto", gap: 10, marginBottom: 10 }}>
          <input value={icsUrl} onChange={e => setIcsUrl(e.target.value)}
            placeholder="https://d2l.arizona.edu/d2l/le/calendar/ics/..."
            style={{ padding: "9px 12px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.navyBorder}`, fontSize: 13, fontFamily: "inherit", outline: "none", background: "white" }} />
          <Btn variant="navy" onClick={handleICSImport} disabled={!icsUrl.trim() || importing}>
            {importing ? "⏳ Importing..." : "Import →"}
          </Btn>
        </div>
        {icsStatus === "success" && (
          <div style={{ fontSize: 13, color: UA.green, fontWeight: 700 }}>✓ {importedCount} assignments imported from D2L calendar</div>
        )}
        <div style={{ marginTop: 12, padding: "10px 14px", borderRadius: UA.radiusSm, background: "rgba(0,51,102,0.06)", fontSize: 12, color: UA.navy, lineHeight: 1.6 }}>
          <strong>D2L Sync Status:</strong> Not yet connected — IT is working on the CATSCloud integration.
          Manual entry and ICS import are available in the meantime.
        </div>
      </Card>
 
      {/* Quick add table */}
      <Card>
        <div style={{ fontWeight: 800, fontSize: 14, color: UA.text, marginBottom: 4 }}>⚡ Quick Add for {student?.name.split(" ")[0]}</div>
        <div style={{ fontSize: 12, color: UA.textMuted, marginBottom: 14 }}>Add multiple assignments at once — one row per assignment</div>
        <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr 80px 32px", gap: 8, marginBottom: 6 }}>
          {["Assignment Title", "Course", "Due Date", "Points", ""].map((h, i) => (
            <div key={i} style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, textTransform: "uppercase", letterSpacing: "0.04em" }}>{h}</div>
          ))}
        </div>
        {rows.map((row, i) => (
          <div key={i} style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr 80px 32px", gap: 8, marginBottom: 8 }}>
            <input value={row.title} onChange={e => updateRow(i, "title", e.target.value)} placeholder="Assignment title..."
              style={{ padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none" }}
              onFocus={e => e.target.style.borderColor = UA.navy} onBlur={e => e.target.style.borderColor = UA.border} />
            <select value={row.courseCode} onChange={e => updateRow(i, "courseCode", e.target.value)}
              style={{ padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none", background: "white" }}>
              <option value="">Course...</option>
              {(student?.courses || []).map(c => <option key={c.code} value={c.code}>{c.code}</option>)}
            </select>
            <input type="date" value={row.dueDate} onChange={e => updateRow(i, "dueDate", e.target.value)}
              style={{ padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none" }} />
            <input type="number" value={row.points} onChange={e => updateRow(i, "points", e.target.value)} placeholder="pts"
              style={{ padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none" }} />
            <button onClick={() => removeRow(i)} disabled={rows.length === 1}
              style={{ padding: "8px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, background: "white", cursor: rows.length === 1 ? "not-allowed" : "pointer", color: UA.textMuted, fontSize: 14, opacity: rows.length === 1 ? 0.3 : 1 }}>✕</button>
          </div>
        ))}
        <div style={{ display: "flex", gap: 10, marginTop: 10 }}>
          <Btn variant="ghost" size="sm" onClick={addRow}>+ Add Row</Btn>
          <Btn size="sm" onClick={handleSaveRows}>Save All</Btn>
          {saved && <span style={{ fontSize: 13, color: UA.green, fontWeight: 700, alignSelf: "center" }}>✓ Assignments added</span>}
        </div>
      </Card>
    </div>
  );
}

                  <div key={log.id} style={{ display: "flex", alignItems: "center", gap: 14, padding: "10px 14px", borderRadius: UA.radiusSm, background: UA.bg, border: `1px solid ${UA.border}` }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontWeight: 700, fontSize: 13, color: UA.text }}>{log.assignment}</div>
                      <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 2 }}>{log.date} · {log.timeSpent} min</div>
                    </div>
                    <div style={{ display: "flex", gap: 10, fontSize: 12, color: UA.textMuted }}>
                      <span>Effort <strong style={{ color: log.effort >= 3 ? UA.green : UA.red }}>{log.effort}/5</strong></span>
                      <span>Understanding <strong style={{ color: log.understanding >= 3 ? UA.green : UA.red }}>{log.understanding}/5</strong></span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </Card>
 
          {/* Staff notes summary */}
          <Card>
            <div style={{ fontWeight: 800, fontSize: 14, color: UA.text, marginBottom: 14 }}>Staff Notes ({notes.length})</div>
            {notes.length === 0 ? <div style={{ color: UA.textMuted, fontSize: 13 }}>No notes in this period</div> : (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {notes.map(note => <NoteCard key={note.id} note={note} />)}
              </div>
            )}
          </Card>
 
          {/* FERPA footer */}
          <div style={{ textAlign: "center", fontSize: 12, color: UA.textMuted, padding: "8px 0", borderTop: `1px solid ${UA.border}` }}>
            CATS Academic Companion · University of Arizona · CONFIDENTIAL — FERPA-protected educational record. Authorized sharing only.
          </div>
        </div>
      )}
 
      {!generated && (
        <div style={{ textAlign: "center", padding: "60px 0", color: UA.textMuted }}>
          <div style={{ fontSize: 48, marginBottom: 16 }}>📊</div>
          <div style={{ fontSize: 16, fontWeight: 700, color: UA.text, marginBottom: 8 }}>Select a student and date range</div>
          <div style={{ fontSize: 14 }}>Then click Generate Report to build a shareable progress summary</div>
        </div>
      )}
    </div>
  );
}
 
// --- GLOBAL NOTES FEED --------------------------------------------------------

function GlobalNotesFeed() {

  const catColors = {

    "Follow-Up Required": { bg: UA.yellowBg, color: UA.yellow, border: UA.yellowBorder },
    "Intake Observation": { bg: UA.greenBg, color: UA.green, border: UA.greenBorder },
  };
  const filtered = ALL_NOTES_FEED.filter(n => filterCategory === "all" || n.category === filterCategory);
 
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <SectionTitle sub="All staff notes across your caseload — most recent first">Notes Feed</SectionTitle>
      </div>
      {/* Category filter */}
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
        {["all", "Session Note", "Concern Flag", "Follow-Up Required", "Intake Observation"].map(cat => (
          <button key={cat} onClick={() => setFilterCategory(cat)}
            style={{ padding: "5px 14px", borderRadius: 99, fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", border: `1.5px solid ${filterCategory === cat ? UA.navy : UA.border}`, background: filterCategory === cat ? UA.navy : "white", color: filterCategory === cat ? "white" : UA.textMuted, transition: "all 0.15s" }}>
            {cat === "all" ? "All Notes" : cat}

        ))}

          const riskColor = note.studentRisk === "high" ? UA.red : note.studentRisk === "medium" ? UA.yellow : UA.green;
          return (
            <div key={note.id} style={{ background: UA.bgCard, border: `1px solid ${UA.border}`, borderRadius: UA.radius, padding: "16px 20px", borderLeft: `4px solid ${c.color}`, boxShadow: UA.shadow }}>
              {/* Student + category header */}
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>

                  <div>
                    <div style={{ fontSize: 13, fontWeight: 800, color: UA.text }}>{note.studentName}</div>
                    <div style={{ fontSize: 11, color: UA.textMuted }}>{note.author} · {note.date}</div>
                  </div>
                  <RiskBadge level={note.studentRisk} />

                <span style={{ fontSize: 11, fontWeight: 700, padding: "3px 10px", borderRadius: 99, background: c.bg, color: c.color, border: `1px solid ${c.border}` }}>{note.category}</span>
              </div>

            </div>
          );
        })}
        {filtered.length === 0 && <div style={{ textAlign: "center", padding: "40px 0", color: UA.textMuted, fontSize: 14 }}>No notes matching this filter</div>}
      </div>
    </div>
  );
}
 
// --- SESSION LOG TAB ----------------------------------------------------------

      <div style={{ fontSize: 32, marginBottom: 12 }}>📋</div>

    </div>
  );
 
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      {logs.map(log => (
        <div key={log.id} style={{ background: UA.bgCard, border: `1px solid ${UA.border}`, borderRadius: UA.radius, padding: "18px 20px", boxShadow: UA.shadow }}>
          {/* Header */}
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 12 }}>
            <div>
              <div style={{ fontWeight: 800, fontSize: 14, color: UA.text }}>{log.assignment}</div>
              <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 3 }}>{log.date} · {log.timeSpent} min · {log.completionType.replace("_", " ")}</div>
            </div>
            <div style={{ display: "flex", gap: 8, flexShrink: 0 }}>
              <div style={{ textAlign: "center", padding: "6px 12px", borderRadius: UA.radiusSm, background: UA.bg, border: `1px solid ${UA.border}` }}>
                <div style={{ fontSize: 10, color: UA.textMuted, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.04em" }}>Effort</div>
                <div style={{ fontSize: 20, fontWeight: 900, color: effortColor(log.effort) }}>{log.effort}/5</div>
              </div>
              <div style={{ textAlign: "center", padding: "6px 12px", borderRadius: UA.radiusSm, background: UA.bg, border: `1px solid ${UA.border}` }}>
                <div style={{ fontSize: 10, color: UA.textMuted, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.04em" }}>Understanding</div>
                <div style={{ fontSize: 20, fontWeight: 900, color: effortColor(log.understanding) }}>{log.understanding}/5</div>

            <div style={{ fontSize: 13, color: UA.textSecondary, lineHeight: 1.7, padding: "10px 14px", background: UA.bg, borderRadius: UA.radiusSm, borderLeft: `3px solid ${UA.navy}` }}>
              <strong style={{ color: UA.navy, fontSize: 11, textTransform: "uppercase", letterSpacing: "0.04em" }}>Student notes: </strong>{log.notes}
            </div>
          )}

      ))}
    </div>
  );
}
 
// --- NOTIFICATION SYSTEM ------------------------------------------------------
// Push-style in-app notification center. In production these would also trigger
// server-side push notifications to the student, LS, and counselor via web push API.
function NotificationBell({ notifications, onClear }) {
  const [open, setOpen] = useState(false);
  const unread = notifications.filter(n => !n.read).length;
  return (
    <div style={{ position: "relative" }}>
      <button onClick={() => setOpen(!open)} style={{ position: "relative", background: "none", border: "none", cursor: "pointer", padding: "6px 8px", borderRadius: UA.radiusSm, display: "flex", alignItems: "center", gap: 4 }}>
        <span style={{ fontSize: 20 }}>🔔</span>
        {unread > 0 && <span style={{ position: "absolute", top: 2, right: 2, width: 16, height: 16, borderRadius: "50%", background: UA.red, color: "white", fontSize: 10, fontWeight: 800, display: "flex", alignItems: "center", justifyContent: "center" }}>{unread}</span>}
      </button>
      {open && (
        <div style={{ position: "absolute", right: 0, top: 44, width: 320, background: "white", border: `1px solid ${UA.border}`, borderRadius: UA.radius, boxShadow: UA.shadowMd, zIndex: 100, overflow: "hidden" }}>
          <div style={{ padding: "12px 16px", borderBottom: `1px solid ${UA.border}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontWeight: 800, fontSize: 13, color: UA.text }}>Notifications</span>
            {unread > 0 && <button onClick={onClear} style={{ fontSize: 11, color: UA.red, background: "none", border: "none", cursor: "pointer", fontWeight: 600 }}>Mark all read</button>}
          </div>
          <div style={{ maxHeight: 320, overflowY: "auto" }}>
            {notifications.length === 0 && <div style={{ padding: "24px 16px", textAlign: "center", color: UA.textMuted, fontSize: 13 }}>No notifications</div>}
            {notifications.map(n => (
              <div key={n.id} style={{ padding: "12px 16px", borderBottom: `1px solid ${UA.border}`, background: n.read ? "white" : UA.redLight, display: "flex", gap: 10, alignItems: "flex-start" }}>
                <span style={{ fontSize: 18, flexShrink: 0 }}>{n.icon}</span>
                <div>
                  <div style={{ fontSize: 13, fontWeight: n.read ? 500 : 700, color: UA.text, lineHeight: 1.4 }}>{n.message}</div>
                  <div style={{ fontSize: 11, color: UA.textMuted, marginTop: 3 }}>{n.time}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}
 
// --- ADD ASSIGNMENT MODAL -----------------------------------------------------
// Manual assignment entry form — used until D2L sync is live.
function AddAssignmentModal({ onClose, onAdd }) {
  const [form, setForm] = useState({
    title: "", course: "", courseCode: "", dueDate: "", points: "",
    description: "", instructions: "", rubric: "", status: "not_started",
  });
  const [errors, setErrors] = useState({});
 
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
 
  const validate = () => {
    const e = {};
    if (!form.title.trim()) e.title = "Required";
    if (!form.course.trim()) e.course = "Required";
    if (!form.dueDate) e.dueDate = "Required";
    setErrors(e);
    return Object.keys(e).length === 0;
  };
 
  const handleSubmit = () => {
    if (!validate()) return;
    const urgency = (() => {
      const days = (new Date(form.dueDate) - Date.now()) / 86400000;
      if (days < 3) return "red";
      if (days < 7) return "yellow";
      return "green";
    })();
    onAdd({
      id: Date.now(),
      ...form,
      points: parseInt(form.points) || 0,
      dueDate: new Date(form.dueDate),
      urgency,
      d2lLink: "",
    });
    onClose();
  };
 
  const Field = ({ label, k, type = "text", placeholder = "", required, rows }) => (
    <div style={{ marginBottom: 14 }}>
      <label style={{ fontSize: 12, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 5 }}>
        {label}{required && <span style={{ color: UA.red }}> *</span>}
      </label>
      {rows ? (
        <textarea value={form[k]} onChange={e => set(k, e.target.value)} placeholder={placeholder} rows={rows}
          style={{ width: "100%", padding: "9px 12px", borderRadius: UA.radiusSm, border: `1.5px solid ${errors[k] ? UA.red : UA.border}`, fontSize: 13, fontFamily: "inherit", resize: "vertical", outline: "none", boxSizing: "border-box" }} />
      ) : (
        <input type={type} value={form[k]} onChange={e => set(k, e.target.value)} placeholder={placeholder}
          style={{ width: "100%", padding: "9px 12px", borderRadius: UA.radiusSm, border: `1.5px solid ${errors[k] ? UA.red : UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none", boxSizing: "border-box" }} />
      )}
      {errors[k] && <div style={{ fontSize: 11, color: UA.red, marginTop: 3 }}>{errors[k]}</div>}
    </div>
  );
 
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <div style={{ background: "white", borderRadius: UA.radius, width: "100%", maxWidth: 560, maxHeight: "90vh", overflow: "auto", boxShadow: UA.shadowMd }}>
        <div style={{ padding: "20px 24px", borderBottom: `1px solid ${UA.border}`, display: "flex", justifyContent: "space-between", alignItems: "center", position: "sticky", top: 0, background: "white", zIndex: 1 }}>
          <div style={{ fontWeight: 800, fontSize: 16, color: UA.text }}>Add Assignment</div>
          <button onClick={onClose} style={{ background: "none", border: "none", fontSize: 20, cursor: "pointer", color: UA.textMuted }}>✕</button>
        </div>
        <div style={{ padding: "20px 24px" }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 16px" }}>
            <div style={{ gridColumn: "1 / -1" }}><Field label="Assignment Title" k="title" placeholder="e.g. Essay: The Great Gatsby" required /></div>
            <Field label="Course Name" k="course" placeholder="e.g. English 201" required />
            <Field label="Course Code" k="courseCode" placeholder="e.g. ENG201" />
            <Field label="Due Date" k="dueDate" type="date" required />
            <Field label="Points" k="points" type="number" placeholder="e.g. 100" />
          </div>
          <Field label="Description" k="description" placeholder="Brief overview of the assignment..." rows={2} />
          <Field label="Instructions" k="instructions" placeholder="What specifically does the student need to do?" rows={3} />
          <Field label="Rubric" k="rubric" placeholder="e.g. Thesis (25pts) · Analysis (30pts) · Citations (25pts) · Grammar (20pts)" rows={2} />
          <div style={{ marginBottom: 14 }}>
            <label style={{ fontSize: 12, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 5 }}>Status</label>
            <select value={form.status} onChange={e => set("status", e.target.value)} style={{ width: "100%", padding: "9px 12px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none" }}>
              <option value="not_started">Not Started</option>
              <option value="in_progress">In Progress</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <div style={{ display: "flex", gap: 10, marginTop: 20 }}>
            <Btn variant="outline" fullWidth onClick={onClose}>Cancel</Btn>
            <Btn fullWidth onClick={handleSubmit}>Add Assignment</Btn>
          </div>
        </div>
      </div>
    </div>
  );
}
 
// --- PDF REPORT EXPORT --------------------------------------------------------
// Generates a printable HTML report for internal staff records and counselors.
// In production this would use a server-side PDF library. For now it opens a
// formatted print window the user can Save as PDF from the browser.
function exportStudentReport(student, notes, assignments) {
  const riskColor = student.dynamicRisk === "high" ? "#CC0033" : student.dynamicRisk === "medium" ? "#D97706" : "#16A34A";
  const now = new Date().toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
  const html = `
    <!DOCTYPE html><html><head><title>CATS Report — ${student.name}</title>
    <style>
      body { font-family: Arial, sans-serif; color: #0F1623; padding: 40px; max-width: 720px; margin: 0 auto; }
      .header { border-bottom: 3px solid #CC0033; padding-bottom: 16px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-end; }
      .logo { font-size: 22px; font-weight: 900; color: #003366; }
      .logo span { color: #CC0033; }
      .date { font-size: 12px; color: #8890A8; }
      h2 { font-size: 14px; font-weight: 800; color: #003366; text-transform: uppercase; letter-spacing: 0.06em; margin: 24px 0 10px; border-bottom: 1px solid #E8EAF0; padding-bottom: 6px; }
      .badge { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
      .metric { background: #F8F9FB; padding: 12px 16px; border-radius: 8px; }
      .metric-label { font-size: 11px; color: #8890A8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
      .metric-value { font-size: 22px; font-weight: 900; }
      .note { border-left: 3px solid #003366; padding: 10px 14px; margin-bottom: 10px; background: #F8F9FB; border-radius: 0 8px 8px 0; }
      .note-meta { font-size: 11px; color: #8890A8; margin-bottom: 4px; }
      .note-text { font-size: 13px; line-height: 1.6; }
      .assignment { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #E8EAF0; font-size: 13px; }
      .footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid #E8EAF0; font-size: 11px; color: #8890A8; text-align: center; }
      @media print { body { padding: 20px; } }
    </style></head><body>
    <div class="header">
      <div><div class="logo"><span>A</span> CATS Academic Companion</div><div style="font-size:13px;color:#4A5068;margin-top:4px;">University of Arizona — Academic Support Report</div></div>
      <div class="date">Generated ${now}</div>
    </div>
 
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:8px;">
      <div style="width:52px;height:52px;border-radius:50%;background:#003366;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:white;">${student.initials}</div>
      <div>
        <div style="font-size:22px;font-weight:900;">${student.name}</div>
        <div style="font-size:13px;color:#4A5068;">${student.sport} · ${student.year} · GPA ${student.gpa} · Counselor: ${student.counselor}</div>
      </div>
      <div style="margin-left:auto;"><span class="badge" style="background:${riskColor}22;color:${riskColor};border:1px solid ${riskColor}44;">${student.dynamicRisk.toUpperCase()} RISK · ${student.riskScore}</span></div>
    </div>
 
    <h2>Academic Metrics</h2>
    <div class="grid">
      <div class="metric"><div class="metric-label">Avg Effort</div><div class="metric-value" style="color:${student.avgEffort>=3.5?"#16A34A":"#CC0033"}">${student.avgEffort}/5</div></div>
      <div class="metric"><div class="metric-label">Avg Understanding</div><div class="metric-value" style="color:${student.avgUnderstanding>=3?"#16A34A":"#CC0033"}">${student.avgUnderstanding}/5</div></div>
      <div class="metric"><div class="metric-label">Total Study Hours</div><div class="metric-value" style="color:#003366">${student.totalHours}h</div></div>
      <div class="metric"><div class="metric-label">Missing Assignments</div><div class="metric-value" style="color:${student.missedAssignments>0?"#CC0033":"#16A34A"}">${student.missedAssignments}</div></div>
    </div>
 
    <h2>Assignments</h2>
    ${assignments.map(a => `<div class="assignment"><span>${a.title} <span style="color:#8890A8;font-size:12px;">(${a.course})</span></span><span style="color:${a.status==="completed"?"#16A34A":a.status==="missing"?"#CC0033":"#4A5068"};font-weight:600;">${a.status.replace("_"," ")}</span></div>`).join("")}
 
    <h2>Staff Notes & Observations</h2>
    ${notes.length === 0 ? '<div style="color:#8890A8;font-size:13px;">No notes on record.</div>' : notes.map(n => `<div class="note"><div class="note-meta">${n.author} · ${n.date} · <strong>${n.category}</strong></div><div class="note-text">${n.text}</div></div>`).join("")}
 
    <div class="footer">CATS Academic Companion · University of Arizona · CONFIDENTIAL — For internal use and authorized counselor sharing only. This document contains FERPA-protected educational records.</div>
    </body></html>
  `;
  const win = window.open("", "_blank");
  win.document.write(html);
  win.document.close();
  setTimeout(() => win.print(), 600);
}
