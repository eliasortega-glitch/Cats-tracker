// Returns true when viewport is 768px or narrower (phone/small tablet)
function useIsMobile() {
  const [isMobile, setIsMobile] = useState(typeof window !== "undefined" && window.innerWidth <= 768);
  useEffect(() => {
    const handler = () => setIsMobile(window.innerWidth <= 768);
    window.addEventListener("resize", handler);
    return () => window.removeEventListener("resize", handler);
  }, []);
  return isMobile;
}

const RiskBadge = ({ level, score }) => {

    high: { label: "High Risk", bg: UA.redLight, color: UA.red, border: UA.redBorder, dot: UA.red },

    low: { label: "Low Risk", bg: UA.greenBg, color: UA.green, border: UA.greenBorder, dot: UA.green },
  };
  const c = config[level] || config.low;
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 11, fontWeight: 700, padding: "3px 10px", borderRadius: 99, background: c.bg, color: c.color, border: `1px solid ${c.border}`, letterSpacing: "0.02em" }}>

};

  const [hov, setHov] = useState(false);
  const sizes = { xs: { fontSize: 12, padding: "5px 12px", gap: 4 }, sm: { fontSize: 13, padding: "7px 14px", gap: 5 }, md: { fontSize: 14, padding: "9px 20px", gap: 6 }, lg: { fontSize: 15, padding: "12px 28px", gap: 8 } };
  const variants = {
    primary: { background: hov ? UA.redDark : UA.red, color: "#FFF", border: "none" },
    secondary: { background: hov ? UA.navyLight : UA.navyLight, color: UA.navy, border: `1.5px solid ${UA.navyBorder}` },
    outline: { background: hov ? UA.bg : "transparent", color: UA.text, border: `1.5px solid ${UA.border}` },
    ghost: { background: hov ? UA.bg : "transparent", color: UA.textSecondary, border: "none" },
    danger: { background: hov ? UA.redDark : UA.redLight, color: UA.red, border: `1.5px solid ${UA.redBorder}` },
    navy: { background: hov ? "#004080" : UA.navy, color: "#FFF", border: "none" },
  };
  return (
    <button onClick={!disabled ? onClick : undefined} onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", borderRadius: UA.radiusSm, cursor: disabled ? "not-allowed" : "pointer", fontFamily: "inherit", fontWeight: 600, transition: "all 0.15s", opacity: disabled ? 0.5 : 1, width: fullWidth ? "100%" : "auto", whiteSpace: "nowrap", ...sizes[size], ...variants[variant], ...style }}>
      {children}
    </button>
  );
};

  const week = ASSIGNMENTS.filter(a => a.dueDate >= ws && a.dueDate < we);

    <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>

  const [showAddModal, setShowAddModal] = useState(false);
  const filtered = assignments.filter(a =>
    (a.title + a.course).toLowerCase().includes(search.toLowerCase()) &&
    (filterStatus === "all" || a.status === filterStatus)
  );
  const groups = {
    missing: filtered.filter(a=>a.status==="missing"),
    in_progress: filtered.filter(a=>a.status==="in_progress"),
    not_started: filtered.filter(a=>a.status==="not_started"),
    completed: filtered.filter(a=>a.status==="completed"),
  };
  const gMeta = {
    missing: { label: "Missing", accent: UA.red },
    in_progress: { label: "In Progress", accent: UA.navy },
    not_started: { label: "Not Started", accent: UA.textMuted },
    completed: { label: "Completed", accent: UA.green },
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 22 }}>
      {showAddModal && <AddAssignmentModal onClose={() => setShowAddModal(false)} onAdd={a => { onAddAssignment && onAddAssignment(a); setShowAddModal(false); }} />}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <SectionTitle>Assignments</SectionTitle>
        <Btn onClick={() => setShowAddModal(true)}>+ Add Assignment</Btn>
      </div>

      <Card style={{ padding: "16px 20px" }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr auto", gap: 12 }}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍  Search assignments or courses..." style={{ padding: "9px 14px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none", background: UA.bg }} />
          <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} style={{ padding: "9px 14px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none", background: "white", cursor: "pointer" }}>
            <option value="all">All Statuses</option>
            <option value="missing">Missing</option>
            <option value="in_progress">In Progress</option>
            <option value="not_started">Not Started</option>
            <option value="completed">Completed</option>
          </select>
        </div>
      </Card>

      {Object.entries(groups).map(([key, items]) => {
        if (!items.length) return null;
        const meta = gMeta[key];
        return (
          <div key={key}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
              <div style={{ width: 8, height: 8, borderRadius: "50%", background: meta.accent }} />
              <span style={{ fontWeight: 800, fontSize: 13, color: meta.accent, letterSpacing: "0.02em" }}>{meta.label} · {items.length}</span>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {items.map(a => (
                <div key={a.id} style={{ background: UA.bgCard, border: `1px solid ${UA.border}`, borderRadius: UA.radius, padding: "14px 18px", display: "flex", alignItems: "center", gap: 14, cursor: "pointer", transition: "all 0.15s", boxShadow: UA.shadow }}
                  onClick={() => onNavigate("workmode", a)}
                  onMouseEnter={e => { e.currentTarget.style.borderColor = meta.accent; e.currentTarget.style.boxShadow = UA.shadowMd; }}
                  onMouseLeave={e => { e.currentTarget.style.borderColor = UA.border; e.currentTarget.style.boxShadow = UA.shadow; }}>
                  <UrgencyBar urgency={a.urgency} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 700, fontSize: 14, color: UA.text }}>{a.title}</div>
                    <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 2 }}>{a.course} · {a.points} pts · Due {a.dueDate.toLocaleDateString("en-US", { month: "short", day: "numeric" })}</div>
                  </div>
                  <StatusBadge status={a.status} />
                  <Btn size="sm" variant="outline" onClick={e => { e.stopPropagation(); onNavigate("workmode", a); }}>Open →</Btn>
                </div>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// --- WORK MODE -----------------------------------------------------------------
function WorkModePage({ assignment: a, onBack, onSessionSaved, onNeedSupport }) {
  const [time, setTime] = useState(0);
  const [timerOn, setTimerOn] = useState(false);
  const [effort, setEffort] = useState(3);
  const [understanding, setUnderstanding] = useState(3);
  const [notes, setNotes] = useState("");
  const [completionType, setCompletionType] = useState("in_progress");
  const [saved, setSaved] = useState(false);
  const [activePrompt, setActivePrompt] = useState(null);
  const [promptResponses, setPromptResponses] = useState({});
  const [expandedBreakdown, setExpandedBreakdown] = useState({});
  const [isLoadingBreakdown, setIsLoadingBreakdown] = useState({});
  // CHANGED: Added aiBreakdownText to store real AI responses keyed by promptId
  const [aiBreakdownText, setAiBreakdownText] = useState({});
  const timerRef = useRef(null);

  // Timer auto-starts when Work Mode opens — invisible to student, logged on save
  useEffect(() => {
    setTimerOn(true);
    return () => clearInterval(timerRef.current);
  }, []);

  useEffect(() => {
    if (timerOn) timerRef.current = setInterval(() => setTime(p=>p+1), 1000);
    else clearInterval(timerRef.current);
    return () => clearInterval(timerRef.current);
  }, [timerOn]);

  const fmt = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;

  // PROTOTYPE MODE: Smart static responses that demonstrate the AI feature
  // without requiring a backend connection. In production, this calls
  // /api/ai-breakdown on the server which uses the real Anthropic Claude API.
  const handleBreakdown = (promptId) => {
    const prompt = GUIDED_PROMPTS.find(p => p.id === promptId);
    if (!prompt) return;

    setIsLoadingBreakdown(p => ({ ...p, [promptId]: true }));

    // Simulate a brief loading delay so it feels like an AI call
    setTimeout(() => {
      const text = generateStaticGuidance(prompt.id, a);
      setAiBreakdownText(p => ({ ...p, [promptId]: text }));
      setIsLoadingBreakdown(p => ({ ...p, [promptId]: false }));
      setExpandedBreakdown(p => ({ ...p, [promptId]: true }));
    }, 1200);
  };

  // Smart static guidance — reads the actual assignment data and generates
  // specific, relevant responses. Replaced by real Claude API call in production.
  const generateStaticGuidance = (promptId, assignment) => {
    const { title, description, instructions, rubric, courseCode, course, points } = assignment;
    const text = (description + " " + instructions).toLowerCase();

    // Extract action verbs from instructions
    const verbs = ["analyze", "argue", "compare", "evaluate", "explain", "describe",
      "discuss", "define", "examine", "identify", "write", "create", "develop", "research"];
    const foundVerbs = verbs.filter(v => text.includes(v));

    // Extract highest rubric point value
    const rubricMatches = (rubric || "").match(/\((\d+)pts?\)/g) || [];
    const pointValues = rubricMatches.map(m => parseInt(m.replace(/\D/g, ""))).sort((a,b) => b-a);
    const highestPoints = pointValues[0];
    const highestSection = rubric ? rubric.split("·").find(s => s.includes(`(${highestPoints}pts)`) || s.includes(`(${highestPoints}pt)`)) : null;

    // Detect assignment type from course code
    const isWriting = courseCode?.match(/ENG|COMM|HIST|SOC|PSYC|RELI|SPAN/) || text.includes("essay") || text.includes("response") || text.includes("paper");
    const isMath = courseCode?.match(/MATH|CALC|STAT/) || text.includes("problem") || text.includes("equation");
    const isLab = courseCode?.match(/BIOC|CHEM|PHYS/) || text.includes("lab report") || text.includes("experiment");

    if (promptId === 1) {
      // What is this assignment asking you to do?
      if (foundVerbs.length > 0) {
        return `This assignment is asking you to ${foundVerbs.slice(0,2).join(" and ")}. Those are the key action words — they mean your professor wants more than a summary. For "${title}", focus on building an argument or interpretation, not just describing what happened. Re-read the instructions and circle every action word you find. That's your roadmap.`;
      }
      return `"${title}" is asking you to produce a ${isWriting ? "written analysis" : isMath ? "set of worked solutions" : isLab ? "formal lab report" : "completed assignment"} for ${course}. Read the instructions once all the way through before you start — most students lose points by answering the wrong question, not by getting the content wrong.`;
    }

    if (promptId === 2) {
      // Where do the most points come from?
      if (highestPoints && highestSection) {
        return `The highest point value in your rubric is ${highestPoints} out of ${points} total points — that section is "${highestSection.trim()}". That's where you should invest your best effort and most time. Don't spread yourself equally — do your strongest work on the highest-value section first, then fill in the rest.`;
      }
      if (points) {
        return `This assignment is worth ${points} points total. Without a detailed rubric breakdown, focus your energy on directly answering what the instructions ask. Professors typically weight the core argument or main task most heavily — make sure that part is your strongest work before polishing smaller details.`;
      }
      return `Review your rubric carefully and identify which section carries the most points. That's where your time and energy should go first. It's common for students to over-invest in easier sections and underinvest in the high-value ones.`;
    }

    if (promptId === 3) {
      // What's the very first thing you need to do?
      if (isWriting) {
        return `Your first step is to re-read the prompt one more time and write one sentence — even a rough one — that says what you're going to argue or respond to. It doesn't have to be perfect. A bad thesis you can improve is infinitely better than a blank page. Do that in the next 5 minutes and you've already started.`;
      }
      if (isMath) {
        return `Your first step is to open to problem 1 and identify which concept or technique it's testing — don't try to solve all ${title.match(/\d+/) ? title.match(/\d+/)[0] : "the"} problems at once. Read problem 1, write down what formula or method applies, and attempt it fully before moving on. One problem completely done beats five problems half-started.`;
      }
      if (isLab) {
        return `Your first step is to open your lab notes from the session and re-read them. Then write your Abstract — even a rough draft — before anything else. The Abstract forces you to summarize what you did and found, which makes writing every other section easier. Keep it under 150 words.`;
      }
      return `Your first step is to re-read the instructions slowly, then write one sentence describing exactly what you need to submit when this is done. Once you know clearly what the finished product looks like, working backwards to get there becomes much easier.`;
    }

    if (promptId === 4) {
      // What part feels most confusing?
      if (isWriting) {
        return `For most students, the hardest part of "${title}" is moving from summary to analysis — it's tempting to just retell what happened instead of making an argument about what it means. If that's where you're stuck, try asking yourself: "So what does this mean? Why does it matter?" That pushes you from description into analysis. Bring that specific question to your learning specialist session.`;
      }
      if (isMath) {
        return `The most commonly confusing part of this type of assignment is knowing which technique to apply when. If integration by parts, substitution, and partial fractions all blur together, write each one on a notecard with one example. Look at the problem structure — not just the numbers — and it usually becomes clearer which method fits. Your LS or a tutor can walk through a practice problem with you.`;
      }
      return `It's completely normal to feel unsure about where to start or whether you're doing it right. The most useful thing you can do right now is name the one specific thing that feels unclear — not "the whole assignment" but one specific requirement or concept. Write it down and bring it to your next session. That's exactly what your learning specialist is there for.`;
    }

    return `Take a moment to re-read the instructions carefully and identify the single most important thing this assignment is asking you to do. When you've got that, you've got a starting point. Bring any specific questions to your learning specialist.`;
  };

  if (saved) return (
    <div style={{ height: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: UA.bg }}>
      <Card style={{ textAlign: "center", padding: "52px 64px", maxWidth: 420 }}>
        <div style={{ width: 64, height: 64, borderRadius: "50%", background: UA.greenBg, border: `2px solid ${UA.greenBorder}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 28, margin: "0 auto 20px" }}>✅</div>
        <div style={{ fontWeight: 900, fontSize: 22, color: UA.text, marginBottom: 8 }}>Session Saved!</div>
        <div style={{ color: UA.textMuted, fontSize: 14, marginBottom: 28, lineHeight: 1.6 }}>Great work. Your session has been logged and your learning specialist can see your progress.</div>
        <Btn onClick={onBack} fullWidth>← Back to Assignments</Btn>
      </Card>
    </div>
  );

  return (
    <div style={{ height: "100vh", display: "flex", flexDirection: "column", background: UA.bg, fontFamily: "'DM Sans', system-ui, sans-serif" }}>
      {/* Header */}
      <div style={{ background: UA.bgCard, borderBottom: `1px solid ${UA.border}`, padding: "0 28px", height: 60, display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0, boxShadow: "0 1px 4px rgba(0,0,0,0.04)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
          <div style={{ width: 8, height: 8, borderRadius: "50%", background: a.urgency === "red" ? UA.red : a.urgency === "yellow" ? UA.yellow : UA.green }} />
          <div>
            <div style={{ fontWeight: 800, fontSize: 16, color: UA.text }}>{a.title}</div>
            <div style={{ fontSize: 12, color: UA.textMuted }}>{a.course} · {a.points} pts · Due {a.dueDate.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })}</div>
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <a href={a.d2lLink || "https://d2l.arizona.edu"} target="_blank" rel="noreferrer" style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "7px 14px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.navyBorder}`, background: UA.navyLight, color: UA.navy, fontSize: 13, fontWeight: 700, textDecoration: "none", transition: "all 0.15s" }}
            onMouseEnter={e => e.currentTarget.style.background = "#D8E6F5"}
            onMouseLeave={e => e.currentTarget.style.background = UA.navyLight}>
            🔗 Open in D2L
          </a>
          <Btn variant="outline" size="sm" onClick={() => { setTimerOn(false); onBack(); }}>✕ Close</Btn>
        </div>
      </div>

      {/* Split panel — stacks vertically on mobile via .work-split CSS class */}
      <div className="work-split" style={{ flex: 1, display: "grid", gridTemplateColumns: "1fr 1fr", overflow: "hidden" }}>

        {/* LEFT: Assignment details + guided prompts */}
        <div style={{ borderRight: `1px solid ${UA.border}`, overflow: "auto", padding: 24, display: "flex", flexDirection: "column", gap: 18 }}>

          {/* Assignment details — pinned at top */}
          <Card style={{ padding: "20px 22px", border: `1.5px solid ${UA.navyBorder}`, background: UA.navyLight }}>
            <div style={{ fontSize: 11, fontWeight: 800, color: UA.navy, letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 14 }}>Assignment Details</div>
            {[["Description", a.description], ["Instructions", a.instructions], ["Rubric", a.rubric]].map(([label, val]) => val && (
              <div key={label} style={{ marginBottom: 14 }}>
                <div style={{ fontSize: 11, fontWeight: 800, color: UA.textMuted, letterSpacing: "0.06em", textTransform: "uppercase", marginBottom: 6 }}>{label}</div>
                <div style={{ fontSize: 13, color: UA.text, lineHeight: 1.7 }}>{val}</div>
              </div>
            ))}
          </Card>

          {/* Guided prompts — interactive */}
          <div>
            <div style={{ fontSize: 11, fontWeight: 800, color: UA.textMuted, letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 12 }}>Guided Prompts — click to explore</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {GUIDED_PROMPTS.map((prompt, idx) => {
                const isActive = activePrompt === prompt.id;
                const hasBreakdown = expandedBreakdown[prompt.id];
                const isLoading = isLoadingBreakdown[prompt.id];
                const isComplete = !!promptResponses[prompt.id]?.trim();
                // CHANGED: aiText pulls the real AI response for this prompt from state
                return (
                  <div key={prompt.id} style={{ borderRadius: UA.radius, border: `1.5px solid ${isActive ? UA.red : isComplete ? UA.greenBorder : UA.border}`, background: isActive ? UA.redLight : isComplete ? UA.greenBg : UA.bgCard, overflow: "hidden", transition: "all 0.2s" }}>
                    {/* Prompt header */}
                    <div onClick={() => setActivePrompt(isActive ? null : prompt.id)} style={{ padding: "14px 18px", cursor: "pointer", display: "flex", alignItems: "center", gap: 12 }}>
                      <div style={{ width: 26, height: 26, borderRadius: "50%", background: isComplete ? UA.greenBg : isActive ? UA.redLight : UA.bg, border: `2px solid ${isComplete ? UA.green : isActive ? UA.red : UA.border}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 800, color: isComplete ? UA.green : isActive ? UA.red : UA.textMuted, flexShrink: 0 }}>
                        {isComplete ? "✓" : idx + 1}
                      </div>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 13, fontWeight: 700, color: isActive ? UA.red : UA.text, lineHeight: 1.4 }}>{prompt.question}</div>
                      </div>
                      <span style={{ fontSize: 14, color: UA.textMuted, transition: "transform 0.2s", transform: isActive ? "rotate(180deg)" : "none" }}>▾</span>
                    </div>

                    {/* Expanded content */}
                    {isActive && (
                      <div style={{ padding: "0 18px 18px", display: "flex", flexDirection: "column", gap: 12 }}>
                        <div style={{ fontSize: 12, color: UA.textSecondary, lineHeight: 1.6, padding: "10px 14px", background: "rgba(0,51,102,0.05)", borderRadius: UA.radiusSm, borderLeft: `3px solid ${UA.navy}` }}>
                          <strong style={{ color: UA.navy }}>Why this matters:</strong> {prompt.why}
                        </div>

                        {/* AI breakdown button */}
                        {!hasBreakdown && (
                          <button onClick={() => handleBreakdown(prompt.id)} disabled={isLoading}
                            style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 14px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.navyBorder}`, background: UA.navyLight, color: UA.navy, fontSize: 12, fontWeight: 700, cursor: isLoading ? "wait" : "pointer", fontFamily: "inherit", transition: "all 0.15s" }}>
                            {isLoading ? <><span style={{ animation: "spin 1s linear infinite", display: "inline-block" }}>⏳</span> Analyzing your assignment...</> : <>✨ Break this down for my assignment</>}
                          </button>
                        )}

                        {/* AI breakdown result — CHANGED: renders real AI response from aiBreakdownText state */}
                        {hasBreakdown && (
                          <div style={{ padding: "12px 14px", background: "white", border: `1px solid ${UA.navyBorder}`, borderRadius: UA.radiusSm, fontSize: 13, color: UA.text, lineHeight: 1.7 }}>
                            <div style={{ fontSize: 11, fontWeight: 800, color: UA.navy, letterSpacing: "0.06em", textTransform: "uppercase", marginBottom: 8 }}>✨ Assignment-specific guidance</div>
                            {aiBreakdownText[prompt.id] || "Loading guidance..."}
                          </div>
                        )}

                        {/* Response input */}
                        <div>
                          <div style={{ fontSize: 12, fontWeight: 600, color: UA.textMuted, marginBottom: 6 }}>{prompt.followUp}</div>
                          <textarea value={promptResponses[prompt.id] || ""} onChange={e => setPromptResponses(p => ({ ...p, [prompt.id]: e.target.value }))}
                            placeholder="Jot a quick thought — even a few words helps..." rows={3}
                            style={{ width: "100%", padding: "10px 12px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", resize: "none", outline: "none", boxSizing: "border-box", transition: "border-color 0.15s" }}
                            onFocus={e => e.target.style.borderColor = UA.red}
                            onBlur={e => e.target.style.borderColor = UA.border} />
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {/* Progress indicator */}
            <div style={{ marginTop: 12, display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ flex: 1, height: 4, borderRadius: 99, background: UA.border, overflow: "hidden" }}>
                <div style={{ height: "100%", width: `${(Object.keys(promptResponses).filter(k=>promptResponses[k]?.trim()).length / GUIDED_PROMPTS.length) * 100}%`, background: UA.green, borderRadius: 99, transition: "width 0.4s" }} />
              </div>
              <span style={{ fontSize: 11, color: UA.textMuted, fontWeight: 600, whiteSpace: "nowrap" }}>
                {Object.keys(promptResponses).filter(k=>promptResponses[k]?.trim()).length}/{GUIDED_PROMPTS.length} prompts
              </span>
            </div>
          </div>
        </div>

        {/* RIGHT: Workspace — timer runs silently in background, not shown to student */}
        <div style={{ overflow: "auto", padding: 24, display: "flex", flexDirection: "column", gap: 18 }}>

          {/* Notes */}
          <Card>
            <div style={{ fontWeight: 800, fontSize: 15, color: UA.text, marginBottom: 10 }}>📝 Your Notes</div>
            <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Take notes, write questions, jot ideas... this is your space." rows={6}
              style={{ width: "100%", padding: "12px 14px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", resize: "vertical", outline: "none", boxSizing: "border-box", lineHeight: 1.6 }}
              onFocus={e => e.target.style.borderColor = UA.navy}
              onBlur={e => e.target.style.borderColor = UA.border} />
          </Card>

          {/* Self assessment — simplified to 3-option emoji for higher completion */}
          <Card>
            <div style={{ fontWeight: 800, fontSize: 15, color: UA.text, marginBottom: 6 }}>Quick Check-In</div>
            <div style={{ fontSize: 12, color: UA.textMuted, marginBottom: 18 }}>One tap each — how are you feeling about this assignment?</div>

            {/* Effort */}
            <div style={{ marginBottom: 20 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: UA.text, marginBottom: 10 }}>Effort today</div>

                  { val: 2, emoji: "😕", label: "Low" },
                  { val: 3, emoji: "🙂", label: "Medium" },
                  { val: 5, emoji: "💪", label: "High" },

            </div>
          </Card>

          {/* Completion status */}
          <Card>
            <div style={{ fontWeight: 800, fontSize: 15, color: UA.text, marginBottom: 12 }}>Where are you with this?</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {[
                { value: "in_progress", label: "Still working on it", icon: "🔄" },
                { value: "independent", label: "Done — did it myself", icon: "💪" },
                { value: "with_support", label: "Done — needed help", icon: "🤝" },
              ].map(opt => (
                <div key={opt.value} onClick={() => setCompletionType(opt.value)}
                  style={{ padding: "13px 16px", borderRadius: UA.radiusSm, border: `1.5px solid ${completionType === opt.value ? UA.navy : UA.border}`, background: completionType === opt.value ? UA.navyLight : "white", cursor: "pointer", display: "flex", alignItems: "center", gap: 12, fontSize: 14, fontWeight: completionType === opt.value ? 700 : 500, color: completionType === opt.value ? UA.navy : UA.text, transition: "all 0.15s" }}>
                  <span style={{ fontSize: 20 }}>{opt.icon}</span>{opt.label}
                  {completionType === opt.value && <span style={{ marginLeft: "auto", color: UA.navy, fontSize: 16 }}>✓</span>}
                </div>
              ))}
            </div>
          </Card>

          {/* I need support button — fires notification directly to LS */}
          <div onClick={() => { if (onNeedSupport) onNeedSupport(a.title); }}
            style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 10, padding: "13px 20px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.redBorder}`, background: UA.redLight, cursor: "pointer", transition: "all 0.15s" }}
            onMouseEnter={e => e.currentTarget.style.background = "#FFCCD6"}
            onMouseLeave={e => e.currentTarget.style.background = UA.redLight}>
            <span style={{ fontSize: 18 }}>🙋</span>
            <span style={{ fontSize: 14, fontWeight: 700, color: UA.red }}>I need support on this</span>
          </div>

          <Btn variant="primary" size="lg" fullWidth onClick={() => { setTimerOn(false); if (onSessionSaved) onSessionSaved({ title: a.title, effort, understanding, time }); setSaved(true); }}>
            💾 Save Session
          </Btn>
        </div>
      </div>
      <style>{`
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @media (max-width: 768px) {
          .work-split { grid-template-columns: 1fr !important; }
          .work-split > div:first-child { border-right: none !important; border-bottom: 1px solid #E8EAF0; max-height: none !important; }
        }
      `}</style>
    </div>
  );
}


// --- POST SESSION NOTE --------------------------------------------------------
// Inline note panel that opens on appointment card after clicking Finish.
// Mirrors the Teamworks workflow: attendance + outcome + free text.
function PostSessionNote({ student, appt, onSave }) {
  const [attendance, setAttendance] = useState(null);
  const [outcome, setOutcome] = useState(null);
  const [noteText, setNoteText] = useState("");
  const [saving, setSaving] = useState(false);

  const attendanceOpts = [
    { value: "on_time", label: "On time", icon: "✅" },
    { value: "late", label: "Arrived late", icon: "🕐" },
    { value: "no_show", label: "No show", icon: "❌" },
  ];

  const outcomeOpts = [
    { value: "completed", label: "Completed work", icon: "💪" },
    { value: "partial", label: "Partial — still in progress", icon: "🔄" },
    { value: "did_not_complete", label: "Did not complete", icon: "⚠️" },
  ];

  const handleSave = () => {
    if (!attendance || !outcome) return;
    setSaving(true);
    const attendanceLabel = attendanceOpts.find(o => o.value === attendance)?.label;
    const outcomeLabel = outcomeOpts.find(o => o.value === outcome)?.label;
    const fullNote = [attendanceLabel, outcomeLabel, noteText.trim()].filter(Boolean).join(" · ");
    setTimeout(() => {
      onSave({ attendance, outcome, text: noteText, fullNote, student: student.name, time: appt.time, date: new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) });
      setSaving(false);
    }, 600);
  };

  const canSave = attendance && outcome;

  return (
    <div style={{ borderTop: `1px solid ${UA.border}`, padding: "18px 20px", background: "white" }}>
      {/* Student context bar */}
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 18, padding: "10px 14px", borderRadius: UA.radiusSm, background: UA.navyLight, border: `1px solid ${UA.navyBorder}` }}>
        <Avatar initials={student.initials} size={30} color={UA.navy} />
        <div>
          <div style={{ fontWeight: 800, fontSize: 13, color: UA.navy }}>{student.name}</div>
          <div style={{ fontSize: 11, color: UA.textMuted }}>{appt.time} · {appt.room} · {student.sport}</div>
        </div>
        {student.missedAssignments > 0 && (
          <span style={{ marginLeft: "auto", fontSize: 11, fontWeight: 700, color: UA.red, background: UA.redLight, padding: "2px 8px", borderRadius: 99, border: `1px solid ${UA.redBorder}` }}>
            {student.missedAssignments} missing assignment{student.missedAssignments > 1 ? "s" : ""}
          </span>
        )}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18, marginBottom: 16 }}>
        {/* Attendance */}
        <div>
          <div style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 8 }}>Attendance</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {attendanceOpts.map(opt => (
              <div key={opt.value} onClick={() => setAttendance(opt.value)}
                style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 12px", borderRadius: UA.radiusSm, border: `1.5px solid ${attendance === opt.value ? UA.navy : UA.border}`, background: attendance === opt.value ? UA.navyLight : "white", cursor: "pointer", fontSize: 13, fontWeight: attendance === opt.value ? 700 : 500, color: attendance === opt.value ? UA.navy : UA.text, transition: "all 0.12s" }}>
                <span style={{ fontSize: 16 }}>{opt.icon}</span>
                {opt.label}
                {attendance === opt.value && <span style={{ marginLeft: "auto", color: UA.navy }}>✓</span>}
              </div>
            ))}
          </div>
        </div>

        {/* Outcome */}
        <div>
          <div style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 8 }}>Session Outcome</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {outcomeOpts.map(opt => (
              <div key={opt.value} onClick={() => setOutcome(opt.value)}
                style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 12px", borderRadius: UA.radiusSm, border: `1.5px solid ${outcome === opt.value ? UA.navy : UA.border}`, background: outcome === opt.value ? UA.navyLight : "white", cursor: "pointer", fontSize: 13, fontWeight: outcome === opt.value ? 700 : 500, color: outcome === opt.value ? UA.navy : UA.text, transition: "all 0.12s" }}>
                <span style={{ fontSize: 16 }}>{opt.icon}</span>
                {opt.label}
                {outcome === opt.value && <span style={{ marginLeft: "auto", color: UA.navy }}>✓</span>}
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Free text */}
      <div style={{ marginBottom: 14 }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 8 }}>Session Notes</div>
        <textarea value={noteText} onChange={e => setNoteText(e.target.value)}
          placeholder={`e.g. Student worked on AFAS essay, completed questionnaire and emailed professor. Needs to follow up with advisor re: incomplete grade.`}
          rows={3}
          style={{ width: "100%", padding: "10px 14px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", resize: "none", outline: "none", boxSizing: "border-box", lineHeight: 1.6 }}
          onFocus={e => e.target.style.borderColor = UA.navy}
          onBlur={e => e.target.style.borderColor = UA.border} />
        <div style={{ fontSize: 11, color: UA.textMuted, marginTop: 4 }}>
          What did they work on? What was completed? Any follow-up needed?
        </div>
      </div>

      {/* Note preview */}
      {(attendance || outcome || noteText) && (
        <div style={{ padding: "10px 14px", borderRadius: UA.radiusSm, background: UA.bg, border: `1px solid ${UA.border}`, marginBottom: 14, fontSize: 13, color: UA.textSecondary, lineHeight: 1.6 }}>
          <span style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, textTransform: "uppercase", letterSpacing: "0.04em", display: "block", marginBottom: 4 }}>Note preview</span>
          {[
            attendanceOpts.find(o => o.value === attendance)?.label,
            outcomeOpts.find(o => o.value === outcome)?.label,
            noteText.trim()
          ].filter(Boolean).join(" · ") || "—"}
        </div>
      )}

      {/* Save */}
      <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
        <Btn onClick={handleSave} disabled={!canSave || saving} size="sm">
          {saving ? "Saving..." : "💾 Save Session Note"}
        </Btn>
        {!canSave && (
          <span style={{ fontSize: 12, color: UA.textMuted }}>Select attendance and outcome to save</span>
        )}
      </div>
    </div>
  );
}


// --- STAFF DASHBOARD ----------------------------------------------------------
// Weekly schedule view — shows today's appointments prominently,
// full week below, and caseload health summary at a glance.
function StaffDashboard({ onSelectStudent, onAddNote }) {
  const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
  const today = new Date();
  const [activeNote, setActiveNote] = useState(null);
  const [savedNotes, setSavedNotes] = useState({});
  // 0=Sun,1=Mon...6=Sat — map to our 1-5 day index
  const todayIdx = today.getDay() === 0 ? 6 : today.getDay(); // 1=Mon..5=Fri

  // Build schedule: for each student, for each slot, create appointment object
  const allAppts = [];
  STUDENTS.forEach(s => {
    (s.schedule || []).forEach(slot => {
      allAppts.push({ student: s, day: slot.day, time: slot.time, room: slot.room });
    });
  });

  // Sort by time
  const sortByTime = (a, b) => {
    const toMins = t => {
      const [time, ampm] = t.split(" ");
      let [h, m] = time.split(":").map(Number);
      if (ampm === "PM" && h !== 12) h += 12;
      if (ampm === "AM" && h === 12) h = 0;
      return h * 60 + m;
    };
    return toMins(a.time) - toMins(b.time);
  };

  const todayAppts = allAppts.filter(a => a.day === todayIdx).sort(sortByTime);
  const isWeekend = todayIdx > 5;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>

      {/* Header */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div>
          <h1 style={{ fontSize: 26, fontWeight: 900, color: UA.text, margin: 0, letterSpacing: "-0.02em" }}>
            Good morning, Dr. Martinez 👋
          </h1>
          <p style={{ color: UA.textMuted, marginTop: 4, fontSize: 14 }}>
            {isWeekend ? "No sessions scheduled today — enjoy your weekend" : `${todayAppts.length} appointment${todayAppts.length !== 1 ? "s" : ""} today · ${today.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })}`}
          </p>
        </div>
      </div>

      {/* Caseload health summary */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 14 }}>
        {[
          { label: "Total Students", value: STUDENTS.length, color: UA.navy, icon: "👥", sub: "in your caseload" },
          { label: "High Risk", value: STUDENTS.filter(s => s.dynamicRisk === "high").length, color: UA.red, icon: "🔴", sub: "need attention" },
          { label: "Sessions Today", value: isWeekend ? 0 : todayAppts.length, color: UA.navy, icon: "📅", sub: "appointments" },
          { label: "Missing Work", value: STUDENTS.reduce((sum, s) => sum + s.missedAssignments, 0), color: UA.orange, icon: "⚠️", sub: "across caseload" },
        ].map((s, i) => (
          <Card key={i} style={{ padding: "18px 20px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div>
                <div style={{ fontSize: 11, color: UA.textMuted, fontWeight: 600, letterSpacing: "0.04em", textTransform: "uppercase", marginBottom: 8 }}>{s.label}</div>
                <div style={{ fontSize: 34, fontWeight: 900, color: s.color, lineHeight: 1 }}>{s.value}</div>
                <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 5 }}>{s.sub}</div>
              </div>
              <span style={{ fontSize: 22 }}>{s.icon}</span>
            </div>
          </Card>
        ))}
      </div>

      {/* High risk alert */}
      {STUDENTS.filter(s => s.dynamicRisk === "high").length > 0 && (
        <div style={{ background: UA.redLight, border: `1px solid ${UA.redBorder}`, borderRadius: UA.radius, padding: "14px 18px", display: "flex", gap: 12, alignItems: "flex-start" }}>
          <span style={{ fontSize: 18 }}>⚠️</span>
          <div>
            <div style={{ fontWeight: 700, color: UA.red, fontSize: 13, marginBottom: 3 }}>Students requiring intervention</div>
            <div style={{ fontSize: 13, color: UA.redDark, lineHeight: 1.5 }}>
              {STUDENTS.filter(s => s.dynamicRisk === "high").map(s => s.name).join(" and ")} {STUDENTS.filter(s => s.dynamicRisk === "high").length === 1 ? "is" : "are"} flagged High Risk. Review their profiles before your next session.
            </div>
          </div>
        </div>
      )}

      {/* Today's appointments */}
      <Card style={{ padding: "22px 24px" }}>
        <div style={{ fontWeight: 800, fontSize: 16, color: UA.text, marginBottom: 4 }}>
          📅 {isWeekend ? "No Sessions Today" : `Today — ${today.toLocaleDateString("en-US", { weekday: "long" })}`}
        </div>
        <div style={{ fontSize: 12, color: UA.textMuted, marginBottom: 16 }}>All sessions 45 minutes · You are the host · Click Finish to log a session note</div>
        {isWeekend || todayAppts.length === 0 ? (
          <div style={{ textAlign: "center", padding: "28px 0", color: UA.textMuted, fontSize: 14 }}>
            {isWeekend ? "No sessions on weekends — see you Monday!" : "No appointments scheduled for today"}
          </div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {todayAppts.map((appt, i) => {
              const s = appt.student;
              const riskColor = s.dynamicRisk === "high" ? UA.red : s.dynamicRisk === "medium" ? UA.yellow : UA.green;
              const isOpen = activeNote === i;
              const saved = savedNotes[i];
              return (
                <div key={i} style={{ borderRadius: UA.radius, border: `1.5px solid ${isOpen ? UA.navy : saved ? UA.greenBorder : UA.border}`, background: saved ? UA.greenBg : "white", overflow: "hidden", transition: "all 0.2s" }}>
                  {/* Appointment row */}
                  <div style={{ display: "flex", alignItems: "center", gap: 14, padding: "14px 16px" }}>
                  {/* Time block */}
                  <div style={{ width: 72, flexShrink: 0, textAlign: "center" }}>
                    <div style={{ fontSize: 14, fontWeight: 900, color: UA.navy }}>{appt.time}</div>
                    <div style={{ fontSize: 10, color: UA.textMuted, marginTop: 2 }}>45 min</div>
                  </div>
                  {/* Divider */}
                  <div style={{ width: 2, height: 40, borderRadius: 2, background: riskColor, flexShrink: 0 }} />
                  {/* Student info */}
                  <Avatar initials={s.initials} size={38} color={riskColor} />
                  <div style={{ flex: 1, cursor: "pointer" }} onClick={() => onSelectStudent(s)}>
                    <div style={{ fontWeight: 800, fontSize: 14, color: UA.text }}>{s.name}</div>
                    <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 2 }}>{s.sport} · {s.year}</div>
                  </div>
                  {/* Room */}
                  <div style={{ textAlign: "right", flexShrink: 0 }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: UA.navy, background: UA.navyLight, padding: "3px 10px", borderRadius: 6, border: `1px solid ${UA.navyBorder}` }}>🚪 {appt.room}</div>
                  </div>
                  {/* Risk + missing */}
                  <RiskBadge level={s.dynamicRisk} />
                  {s.missedAssignments > 0 && (
                    <span style={{ fontSize: 11, padding: "3px 8px", borderRadius: 99, background: UA.redLight, color: UA.red, fontWeight: 700, border: `1px solid ${UA.redBorder}`, whiteSpace: "nowrap" }}>{s.missedAssignments} missing</span>
                  )}
                  {/* Finish button */}
                  {saved ? (
                    <span style={{ fontSize: 12, fontWeight: 700, color: UA.green, padding: "5px 12px", borderRadius: UA.radiusSm, background: UA.greenBg, border: `1px solid ${UA.greenBorder}` }}>✓ Logged</span>
                  ) : (
                    <button onClick={e => { e.stopPropagation(); setActiveNote(isOpen ? null : i); }}
                      style={{ padding: "6px 14px", borderRadius: UA.radiusSm, border: `1.5px solid ${isOpen ? UA.navy : UA.border}`, background: isOpen ? UA.navy : "white", color: isOpen ? "white" : UA.navy, fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", flexShrink: 0, transition: "all 0.15s" }}>
                      {isOpen ? "✕ Close" : "Finish →"}
                    </button>
                  )}
                  </div>

                  {/* Post-session note panel */}
                  {isOpen && !saved && (
                    <PostSessionNote
                      student={s}
                      appt={appt}
                      onSave={(note) => {
                        setSavedNotes(prev => ({ ...prev, [i]: note }));
                        setActiveNote(null);
                        // File note to student profile + global feed
                        if (onAddNote) onAddNote(s.id, {
                          id: Date.now(),
                          author: "Dr. Martinez",
                          authorInitials: "DM",
                          date: new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }),
                          category: note.outcome === "did_not_complete" ? "Follow-Up Required" : "Session Note",
                          text: note.fullNote,
                        });
                      }}
                    />
                  )}
                </div>
              );
            })}
          </div>
        )}
      </Card>

      {/* Weekly schedule */}
      <Card style={{ padding: "22px 24px" }}>
        <div style={{ fontWeight: 800, fontSize: 16, color: UA.text, marginBottom: 16 }}>📆 This Week</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 0 }}>
          {DAYS.map((dayName, i) => {
            const dayIdx = i + 1;
            const dayAppts = allAppts.filter(a => a.day === dayIdx).sort(sortByTime);
            const isToday = dayIdx === todayIdx;
            return (
              <div key={dayIdx} style={{ display: "grid", gridTemplateColumns: "100px 1fr", borderBottom: `1px solid ${UA.border}`, padding: "12px 0" }}>
                {/* Day label */}
                <div style={{ display: "flex", alignItems: "flex-start", paddingTop: 2 }}>
                  <div style={{ fontSize: 13, fontWeight: isToday ? 900 : 600, color: isToday ? UA.red : UA.textMuted, display: "flex", alignItems: "center", gap: 6 }}>
                    {isToday && <div style={{ width: 6, height: 6, borderRadius: "50%", background: UA.red, flexShrink: 0 }} />}
                    {dayName}
                  </div>
                </div>
                {/* Appointments */}
                <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                  {dayAppts.length === 0 ? (
                    <div style={{ fontSize: 12, color: UA.textMuted, padding: "4px 0" }}>No sessions</div>
                  ) : (
                    dayAppts.map((appt, j) => {
                      const s = appt.student;
                      const riskColor = s.dynamicRisk === "high" ? UA.red : s.dynamicRisk === "medium" ? UA.yellow : UA.green;
                      return (
                        <div key={j} onClick={() => onSelectStudent(s)}
                          style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 12px", borderRadius: UA.radiusSm, background: isToday ? UA.redLight : UA.bg, border: `1px solid ${isToday ? UA.redBorder : UA.border}`, cursor: "pointer", transition: "all 0.15s" }}
                          onMouseEnter={e => { e.currentTarget.style.background = UA.navyLight; e.currentTarget.style.borderColor = UA.navyBorder; }}
                          onMouseLeave={e => { e.currentTarget.style.background = isToday ? UA.redLight : UA.bg; e.currentTarget.style.borderColor = isToday ? UA.redBorder : UA.border; }}>
                          <span style={{ fontSize: 12, fontWeight: 700, color: UA.navy, minWidth: 64, flexShrink: 0 }}>{appt.time}</span>
                          <div style={{ width: 3, height: 20, borderRadius: 2, background: riskColor, flexShrink: 0 }} />
                          <Avatar initials={s.initials} size={26} color={riskColor} />
                          <div style={{ flex: 1 }}>
                            <span style={{ fontSize: 13, fontWeight: 700, color: UA.text }}>{s.name}</span>
                            <span style={{ fontSize: 12, color: UA.textMuted }}> · {s.sport}</span>
                          </div>
                          <span style={{ fontSize: 11, fontWeight: 700, color: UA.navy, background: UA.navyLight, padding: "2px 8px", borderRadius: 5, border: `1px solid ${UA.navyBorder}`, flexShrink: 0 }}>🚪 {appt.room}</span>
                          <RiskBadge level={s.dynamicRisk} />
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </Card>
    </div>
  );
}

// --- QUICK ADD ASSIGNMENTS ----------------------------------------------------
// ADDED: Fast inline assignment entry — type multiple assignments rapidly
// without opening a modal for each one. Replaces the Teamworks free-text workflow
// where staff typed all assignments into one description box.
function QuickAddAssignments({ courses, onAdd }) {
  const [rows, setRows] = useState([{ title: "", courseCode: "", dueDate: "", points: "" }]);
  const [saved, setSaved] = useState(false);

  const updateRow = (i, k, v) => setRows(prev => prev.map((r, idx) => idx === i ? { ...r, [k]: v } : r));
  const addRow = () => setRows(prev => [...prev, { title: "", courseCode: "", dueDate: "", points: "" }]);
  const removeRow = (i) => setRows(prev => prev.filter((_, idx) => idx !== i));

  const handleSave = () => {
    const valid = rows.filter(r => r.title.trim() && r.dueDate);
    if (!valid.length) return;
    valid.forEach(r => {
      const days = (new Date(r.dueDate) - Date.now()) / 86400000;
      const urgency = days < 3 ? "red" : days < 7 ? "yellow" : "green";
      const course = courses?.find(c => c.code === r.courseCode);
      onAdd({
        id: Date.now() + Math.random(),
        title: r.title,
        course: course?.name || r.courseCode || "Other",
        courseCode: r.courseCode,
        dueDate: new Date(r.dueDate),
        points: parseInt(r.points) || 0,
        status: "not_started",
        urgency,
        description: "", instructions: "", rubric: "", d2lLink: "",
      });
    });
    setRows([{ title: "", courseCode: "", dueDate: "", points: "" }]);
    setSaved(true);
    setTimeout(() => setSaved(false), 2500);
  };

  return (
    <Card>
      <div style={{ fontWeight: 800, fontSize: 14, color: UA.text, marginBottom: 4 }}>⚡ Quick Add Assignments</div>
      <div style={{ fontSize: 12, color: UA.textMuted, marginBottom: 14 }}>Add multiple assignments fast — one row per assignment</div>
      {/* Column headers */}
      <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr 80px 32px", gap: 8, marginBottom: 6 }}>
        {["Assignment Title", "Course", "Due Date", "Points", ""].map((h, i) => (
          <div key={i} style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, textTransform: "uppercase", letterSpacing: "0.04em" }}>{h}</div>
        ))}
      </div>
      {rows.map((row, i) => (
        <div key={i} style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr 80px 32px", gap: 8, marginBottom: 8 }}>
          <input value={row.title} onChange={e => updateRow(i, "title", e.target.value)} placeholder="Assignment title..."
            style={{ padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none" }}
            onFocus={e => e.target.style.borderColor = UA.navy} onBlur={e => e.target.style.borderColor = UA.border} />
          <select value={row.courseCode} onChange={e => updateRow(i, "courseCode", e.target.value)}
            style={{ padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none", background: "white" }}>
            <option value="">Course...</option>
            {(courses || []).map(c => <option key={c.code} value={c.code}>{c.code}</option>)}
          </select>
          <input type="date" value={row.dueDate} onChange={e => updateRow(i, "dueDate", e.target.value)}
            style={{ padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none" }} />
          <input type="number" value={row.points} onChange={e => updateRow(i, "points", e.target.value)} placeholder="pts"
            style={{ padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none" }} />
          <button onClick={() => removeRow(i)} disabled={rows.length === 1}
            style={{ padding: "8px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, background: "white", cursor: rows.length === 1 ? "not-allowed" : "pointer", color: UA.textMuted, fontSize: 14, opacity: rows.length === 1 ? 0.3 : 1 }}>✕</button>
        </div>
      ))}
      <div style={{ display: "flex", gap: 10, marginTop: 10 }}>
        <Btn variant="ghost" size="sm" onClick={addRow}>+ Add Row</Btn>
        <Btn size="sm" onClick={handleSave}>Save All</Btn>
        {saved && <span style={{ fontSize: 13, color: UA.green, fontWeight: 700, alignSelf: "center" }}>✓ Assignments added</span>}
      </div>
    </Card>
  );
}

}

// Stores syllabi and other documents per student. Supports PDF upload,
// viewing, and optional AI-powered assignment extraction via Claude API.
function DocumentsTab({ student }) {
  const [docs, setDocs] = useState([
    { id: 1, name: "ENG201 Syllabus - Spring 2026.pdf", course: "ENG201", type: "Syllabus", uploadedBy: "Dr. Martinez", date: "Jan 15, 2026", size: "284 KB" },
    { id: 2, name: "MATH129 Syllabus - Spring 2026.pdf", course: "MATH129", type: "Syllabus", uploadedBy: "Dr. Martinez", date: "Jan 15, 2026", size: "198 KB" },
  ]);
  const [uploading, setUploading] = useState(false);
  const [showUpload, setShowUpload] = useState(false);
  const [newDoc, setNewDoc] = useState({ name: "", course: "", type: "Syllabus" });
  const [extracting, setExtracting] = useState(null);
  const [extractedAssignments, setExtractedAssignments] = useState(null);
  const [extractError, setExtractError] = useState(null);
  const fileRef = React.useRef();

  const handleUpload = () => {
    if (!newDoc.name.trim()) return;
    setUploading(true);
    setTimeout(() => {
      setDocs(prev => [...prev, {
        id: Date.now(),
        name: newDoc.name,
        course: newDoc.course,
        type: newDoc.type,
        uploadedBy: "Dr. Martinez",
        date: new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }),
        size: "—",
      }]);
      setNewDoc({ name: "", course: "", type: "Syllabus" });
      setShowUpload(false);
      setUploading(false);
    }, 800);
  };

  // Uses Claude API to extract assignments from syllabus text
  const handleExtract = async (doc) => {
    setExtracting(doc.id);
    setExtractedAssignments(null);
    setExtractError(null);
    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          messages: [{
            role: "user",
            content: `You are helping a learning specialist extract assignments from a course syllabus for a student-athlete academic support system.

Here is information about the document: "${doc.name}" for course ${doc.course}.

Since this is a prototype demonstration, generate 3-4 realistic sample assignments that would typically appear in a ${doc.course} course syllabus. Format your response as JSON only, no other text:
{
  "assignments": [
    { "title": "Assignment name", "dueDate": "2026-04-15", "points": 100, "type": "Essay/Exam/Quiz/Project/Homework" }
  ]
}`
          }]
        })
      });
      const data = await response.json();
      const text = data.content?.[0]?.text || "";
      const clean = text.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(clean);
      setExtractedAssignments(parsed.assignments || []);
    } catch (err) {
      // Fallback mock extraction for prototype
      setExtractedAssignments([
        { title: `${doc.course} Midterm Exam`, dueDate: "2026-04-01", points: 100, type: "Exam" },
        { title: `${doc.course} Final Paper`, dueDate: "2026-05-01", points: 150, type: "Essay" },
        { title: `${doc.course} Weekly Assignments`, dueDate: "2026-04-15", points: 50, type: "Homework" },
      ]);
    }
    setExtracting(null);
  };

  const typeColors = {
    Syllabus: { bg: UA.navyLight, color: UA.navy, border: UA.navyBorder },
    "Course Outline": { bg: UA.yellowBg, color: UA.yellow, border: UA.yellowBorder },
    Other: { bg: UA.bg, color: UA.textMuted, border: UA.border },
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
      {/* Header */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div>
          <div style={{ fontWeight: 800, fontSize: 15, color: UA.text }}>Documents</div>
          <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 2 }}>Syllabi and course documents for {student.name.split(" ")[0]}. Accessible to all CATS staff.</div>
        </div>
        <Btn size="sm" onClick={() => setShowUpload(!showUpload)}>{showUpload ? "✕ Cancel" : "+ Upload Document"}</Btn>
      </div>

      {/* Upload form */}
      {showUpload && (
        <Card style={{ border: `1.5px solid ${UA.navyBorder}`, background: UA.navyLight }}>
          <div style={{ fontWeight: 700, fontSize: 13, color: UA.navy, marginBottom: 12 }}>Upload Document</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginBottom: 12 }}>
            <div>
              <label style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 4 }}>File Name *</label>
              <input value={newDoc.name} onChange={e => setNewDoc(p => ({ ...p, name: e.target.value }))}
                placeholder="e.g. ENG201 Syllabus Spring 2026.pdf"
                style={{ width: "100%", padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.navyBorder}`, fontSize: 13, fontFamily: "inherit", outline: "none", boxSizing: "border-box", background: "white" }} />
            </div>
            <div>
              <label style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 4 }}>Course Code</label>
              <input value={newDoc.course} onChange={e => setNewDoc(p => ({ ...p, course: e.target.value }))}
                placeholder="e.g. ENG201"
                style={{ width: "100%", padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.navyBorder}`, fontSize: 13, fontFamily: "inherit", outline: "none", boxSizing: "border-box", background: "white" }} />
            </div>
            <div>
              <label style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 4 }}>Document Type</label>
              <select value={newDoc.type} onChange={e => setNewDoc(p => ({ ...p, type: e.target.value }))}
                style={{ width: "100%", padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.navyBorder}`, fontSize: 13, fontFamily: "inherit", outline: "none", background: "white" }}>
                <option>Syllabus</option>
                <option>Course Outline</option>
                <option>Other</option>
              </select>
            </div>
          </div>
          <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
            <Btn size="sm" onClick={handleUpload} disabled={!newDoc.name.trim() || uploading}>
              {uploading ? "Uploading..." : "💾 Save Document"}
            </Btn>
            <span style={{ fontSize: 12, color: UA.textMuted }}>In production, attach a PDF file. For the prototype, enter the file name manually.</span>
          </div>
        </Card>
      )}

      {/* Document list */}
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {docs.map(doc => {
          const tc = typeColors[doc.type] || typeColors.Other;
          const isExtracting = extracting === doc.id;
          return (
            <div key={doc.id} style={{ background: UA.bgCard, border: `1px solid ${UA.border}`, borderRadius: UA.radius, overflow: "hidden", boxShadow: UA.shadow }}>
              {/* Document row */}
              <div style={{ display: "flex", alignItems: "center", gap: 14, padding: "14px 18px" }}>
                <div style={{ width: 40, height: 40, borderRadius: UA.radiusSm, background: UA.redLight, border: `1px solid ${UA.redBorder}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, flexShrink: 0 }}>📄</div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 700, fontSize: 14, color: UA.text }}>{doc.name}</div>
                  <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 2 }}>Uploaded by {doc.uploadedBy} · {doc.date}{doc.size !== "—" ? ` · ${doc.size}` : ""}</div>
                </div>
                <span style={{ fontSize: 11, fontWeight: 700, padding: "3px 10px", borderRadius: 99, background: tc.bg, color: tc.color, border: `1px solid ${tc.border}`, flexShrink: 0 }}>{doc.type}</span>
                {doc.course && <span style={{ fontSize: 11, fontWeight: 700, padding: "3px 10px", borderRadius: 99, background: UA.navyLight, color: UA.navy, border: `1px solid ${UA.navyBorder}`, flexShrink: 0 }}>{doc.course}</span>}
                <div style={{ display: "flex", gap: 8, flexShrink: 0 }}>

                    {isExtracting ? "⏳ Extracting..." : "✨ Extract Assignments"}
                  </button>
                </div>
              </div>

              {/* Extracted assignments */}
              {extractedAssignments && extracting !== doc.id && docs.indexOf(doc) === docs.findIndex(d => d.id === doc.id) && (

  );

                <CartesianGrid strokeDasharray="3 3" stroke={UA.border} />

        </div>

    );

  ASSIGNMENTS.filter(a => a.status === "missing").forEach(a => {
    missingByCourse[a.course] = (missingByCourse[a.course] || 0) + 1;

    { risk: "Low Risk", effort: +(STUDENTS.filter(s=>s.dynamicRisk==="low").reduce((s,st)=>s+st.avgEffort,0)/Math.max(1,STUDENTS.filter(s=>s.dynamicRisk==="low").length)).toFixed(1), understanding: +(STUDENTS.filter(s=>s.dynamicRisk==="low").reduce((s,st)=>s+st.avgUnderstanding,0)/Math.max(1,STUDENTS.filter(s=>s.dynamicRisk==="low").length)).toFixed(1) },
  ];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 22 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <SectionTitle sub="Caseload-level trends and intervention signals">Caseload Analytics</SectionTitle>
        <Btn variant="secondary">📄 Export Weekly Report</Btn>
      </div>

      {/* Summary stats */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 14 }}>

          { label: "Avg Caseload Effort", value: (STUDENTS.reduce((s,st)=>s+st.avgEffort,0)/STUDENTS.length).toFixed(1)+"/5", color: UA.navy, icon: "💪" },
          { label: "Avg Understanding", value: (STUDENTS.reduce((s,st)=>s+st.avgUnderstanding,0)/STUDENTS.length).toFixed(1)+"/5", color: UA.navy, icon: "🧠" },

          { label: "Total Study Hours", value: STUDENTS.reduce((s,st)=>s+st.totalHours,0)+"h", color: UA.green, icon: "⏱" },
        ].map((s,i)=>(
          <Card key={i} style={{ padding: "18px 20px" }}>
            <div style={{ display: "flex", justifyContent: "space-between" }}>
              <div>
                <div style={{ fontSize: 11, color: UA.textMuted, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 8 }}>{s.label}</div>
                <div style={{ fontSize: 28, fontWeight: 900, color: s.color }}>{s.value}</div>
              </div>
              <span style={{ fontSize: 24 }}>{s.icon}</span>
            </div>
          </Card>

          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>

              <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 14px", borderRadius: UA.radiusSm, background: "white", border: `1px solid ${UA.redBorder}` }}>

function SettingsPage({ role }) {
  const [saved, setSaved] = useState(false);

    highRisk: true, missedSession: true, missingAssignment: true,
    lowUnderstanding: true, sessionComplete: false, weeklyReport: true,
  });
  const toggleNotif = (key) => setNotifPrefs(p => ({ ...p, [key]: !p[key] }));
  const isStaff = role !== "student";

  // LS can add their own students directly for the pilot
  const [caseload, setCaseload] = useState(STUDENTS);

    if (!newStudent.name.trim() || !newStudent.sport.trim()) return;
    const initials = newStudent.name.split(" ").map(n => n[0]).join("").toUpperCase().slice(0,2);
    const student = {
      id: Date.now(), name: newStudent.name, email: newStudent.email,
      sport: newStudent.sport, initials, year: newStudent.year,
      gpa: 0, intakeRisk: "medium", dynamicRisk: "medium", riskScore: 50,
      lastSession: "Not yet", missedAssignments: 0, avgEffort: 0,
      avgUnderstanding: 0, totalHours: 0, counselor: newStudent.counselor || "TBD",
      courses: [], weeklyPlan: "", nextSession: "Not scheduled", schedule: [],

    setCaseload(prev => [...prev, student]);

    setStudentSaved(true);
    setTimeout(() => setStudentSaved(false), 3000);

  const profileFields = isStaff

  return (

            { key: "missedSession", label: "Student hasn't logged a session in 5+ days", desc: "Sent at the 5-day mark if no Work Mode session recorded" },

                  <label style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 4 }}>Full Name *</label>

                    style={{ width: "100%", padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none", boxSizing: "border-box" }} />

          {studentSaved && <div style={{ fontSize: 13, color: UA.green, fontWeight: 700, marginBottom: 10 }}>✓ Student added to your caseload</div>}

          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>

// Management dashboard — aggregate view only. No clinical details.
// Purpose: department oversight, caseload balance, program health, staff management.
function AdminPage() {
  const [staff, setStaff] = useState(STAFF_MEMBERS);
  const [allStudents, setAllStudents] = useState(STUDENTS);
  const [activeTab, setActiveTab] = useState("overview");
  const [showAddStaff, setShowAddStaff] = useState(false);
  const [newStaff, setNewStaff] = useState({ name: "", email: "", title: "Learning Specialist", room: "" });
  const [staffSaved, setStaffSaved] = useState(false);
  const [assigningId, setAssigningId] = useState(null);

  const inputStyle = { width: "100%", padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none", boxSizing: "border-box" };

  // -- Aggregate calculations ------------------------------------------------
  const totalStudents = allStudents.length;
  const unassigned = allStudents.filter(s => !staff.some(st => st.students.includes(s.id)));
  const highRiskCount = allStudents.filter(s => s.dynamicRisk === "high").length;
  const completionRate = Math.round((ASSIGNMENTS.filter(a => a.status === "completed").length / ASSIGNMENTS.length) * 100);
  const totalMissing = allStudents.reduce((sum, s) => sum + s.missedAssignments, 0);

  // High risk count by sport
  const sportRisk = {};
  allStudents.forEach(s => {
    if (!sportRisk[s.sport]) sportRisk[s.sport] = { total: 0, high: 0, medium: 0 };
    sportRisk[s.sport].total++;
    if (s.dynamicRisk === "high") sportRisk[s.sport].high++;
    if (s.dynamicRisk === "medium") sportRisk[s.sport].medium++;
  });
  const sportRiskData = Object.entries(sportRisk).map(([sport, data]) => ({
    sport: sport.split(" ")[0], // shorten for chart
    high: data.high, medium: data.medium,
    low: data.total - data.high - data.medium,
  })).sort((a, b) => b.high - a.high);

  // Caseload size per LS
  const lsOnly = staff.filter(s => s.title === "Learning Specialist");
  const caseloadData = lsOnly.map(s => ({
    name: s.name.split(" ")[1] || s.name, // last name
    students: s.students.length,
    highRisk: s.students.filter(id => allStudents.find(st => st.id === id)?.dynamicRisk === "high").length,
  }));

  const handleAddStaff = () => {
    if (!newStaff.name.trim()) return;
    const initials = newStaff.name.split(" ").map(n => n[0]).join("").toUpperCase().slice(0, 2);
    setStaff(prev => [...prev, { id: Date.now(), ...newStaff, initials, students: [], status: "active" }]);
    setNewStaff({ name: "", email: "", title: "Learning Specialist", room: "" });
    setShowAddStaff(false);
    setStaffSaved(true);
    setTimeout(() => setStaffSaved(false), 2500);
  };

  const handleReassign = (studentId, newStaffId) => {
    setStaff(prev => prev.map(st => ({
      ...st,
      students: st.id === Number(newStaffId)
        ? [...st.students.filter(id => id !== studentId), studentId]
        : st.students.filter(id => id !== studentId)
    })));
    setAssigningId(null);
  };

  const tabs = [
    { id: "overview", label: "Program Overview" },
    { id: "caseloads", label: "Caseloads" },
    { id: "sports", label: "By Sport" },
    { id: "staff", label: "Staff Management" },
  ];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 22 }}>

      {/* Header */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div>
          <h1 style={{ fontSize: 26, fontWeight: 900, color: UA.text, margin: 0, letterSpacing: "-0.02em" }}>Program Dashboard</h1>
          <p style={{ color: UA.textMuted, marginTop: 4, fontSize: 14 }}>CATS Academics — University of Arizona · Spring 2026</p>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ fontSize: 12, color: new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" }), background: UA.bg, padding: "6px 14px", borderRadius: UA.radiusSm, border: `1px solid ${UA.border}`, color: UA.textMuted }}>
            {new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })}
          </div>
          <div style={{ padding: "6px 14px", borderRadius: UA.radiusSm, background: UA.redLight, border: `1px solid ${UA.redBorder}`, fontSize: 12, fontWeight: 700, color: UA.red }}>🔒 Admin</div>
        </div>
      </div>

      {/* Top-line KPIs */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 14 }}>
        {[
          { label: "Total Students", value: totalStudents, sub: `${lsOnly.length} learning specialists`, color: UA.navy, icon: "🎓" },
          { label: "High Risk", value: highRiskCount, sub: `${Math.round(highRiskCount/totalStudents*100)}% of caseload`, color: UA.red, icon: "⚠️" },
          { label: "Completion Rate", value: `${completionRate}%`, sub: "assignments this semester", color: completionRate >= 70 ? UA.green : UA.yellow, icon: "📈" },
          { label: "Unassigned", value: unassigned.length, sub: unassigned.length > 0 ? "need LS assignment" : "all students assigned", color: unassigned.length > 0 ? UA.orange : UA.green, icon: "👤" },
        ].map((s, i) => (
          <Card key={i} style={{ padding: "18px 20px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div>
                <div style={{ fontSize: 11, color: UA.textMuted, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 8 }}>{s.label}</div>
                <div style={{ fontSize: 34, fontWeight: 900, color: s.color, lineHeight: 1 }}>{s.value}</div>
                <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 5 }}>{s.sub}</div>
              </div>
              <span style={{ fontSize: 22 }}>{s.icon}</span>
            </div>
          </Card>

      </div>

      {/* Unassigned alert */}
      {unassigned.length > 0 && (
        <div style={{ background: UA.orangeBg, border: `1px solid ${UA.orangeBorder}`, borderRadius: UA.radius, padding: "14px 18px", display: "flex", gap: 12, alignItems: "center" }}>
          <span style={{ fontSize: 20 }}>⚠️</span>
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, color: UA.orange, fontSize: 13, marginBottom: 2 }}>Students without a learning specialist assigned</div>

        </div>

      {/* Tabs */}
      <div style={{ display: "flex", gap: 4, borderBottom: `1px solid ${UA.border}` }}>

            {tab.label}
