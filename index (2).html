            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 14 }}>
              {[
                { label: "Avg Caseload Size", value: Math.round(totalStudents / Math.max(1, lsOnly.length)), unit: "students per LS", color: UA.navy },
                { label: "Total Missing Assignments", value: totalMissing, unit: "across all students", color: totalMissing > 3 ? UA.red : UA.green },
                { label: "Avg Student Effort", value: (allStudents.reduce((s,st)=>s+st.avgEffort,0)/allStudents.length).toFixed(1), unit: "out of 5.0", color: UA.navy },
              ].map((s, i) => (
                <div key={i} style={{ padding: "16px 20px", borderRadius: UA.radiusSm, background: UA.bg, border: `1px solid ${UA.border}`, textAlign: "center" }}>
                  <div style={{ fontSize: 11, color: UA.textMuted, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 8 }}>{s.label}</div>
                  <div style={{ fontSize: 28, fontWeight: 900, color: s.color }}>{s.value}</div>
                  <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 4 }}>{s.unit}</div>
                </div>
              ))}
            </div>
          </Card>
        </div>
      )}

      {/* CASELOADS TAB */}
      {activeTab === "caseloads" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div style={{ fontSize: 13, color: UA.textMuted }}>Manage student-to-LS assignments. No clinical details shown here — for session notes and risk details, staff log in directly.</div>

          {lsOnly.map(ls => {
            const lsStudents = ls.students.map(id => allStudents.find(s => s.id === id)).filter(Boolean);
            const lsHighRisk = lsStudents.filter(s => s.dynamicRisk === "high").length;
            return (
              <Card key={ls.id} style={{ padding: "20px 24px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: lsStudents.length > 0 ? 16 : 0 }}>
                  <Avatar initials={ls.initials} size={44} color={UA.navy} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 800, fontSize: 15, color: UA.text }}>{ls.name}</div>
                    <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 2 }}>{ls.title} · {ls.room} · {ls.email}</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontSize: 22, fontWeight: 900, color: UA.navy }}>{lsStudents.length}</div>
                    <div style={{ fontSize: 11, color: UA.textMuted }}>students</div>
                  </div>
                  {lsHighRisk > 0 && (
                    <div style={{ textAlign: "right" }}>
                      <div style={{ fontSize: 22, fontWeight: 900, color: UA.red }}>{lsHighRisk}</div>
                      <div style={{ fontSize: 11, color: UA.textMuted }}>high risk</div>
                    </div>
                  )}
                </div>
                {lsStudents.length > 0 && (
                  <div style={{ display: "flex", flexDirection: "column", gap: 6, paddingTop: 12, borderTop: `1px solid ${UA.border}` }}>
                    {lsStudents.map(s => (
                      <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 12px", borderRadius: UA.radiusSm, background: UA.bg, border: `1px solid ${UA.border}` }}>
                        <div style={{ width: 8, height: 8, borderRadius: "50%", background: s.dynamicRisk==="high"?UA.red:s.dynamicRisk==="medium"?UA.yellow:UA.green, flexShrink: 0 }} />
                        <div style={{ flex: 1 }}>
                          <span style={{ fontSize: 13, fontWeight: 700, color: UA.text }}>{s.name}</span>
                          <span style={{ fontSize: 12, color: UA.textMuted }}> · {s.sport} · {s.year}</span>
                        </div>
                        {assigningId === s.id ? (
                          <select onChange={e => handleReassign(s.id, e.target.value)} defaultValue=""
                            style={{ padding: "5px 8px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.navyBorder}`, fontSize: 12, fontFamily: "inherit", outline: "none", background: "white" }}>
                            <option value="" disabled>Move to...</option>
                            {lsOnly.filter(l => l.id !== ls.id).map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
                          </select>
                        ) : (
                          <button onClick={() => setAssigningId(s.id)}
                            style={{ padding: "4px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, background: "white", fontSize: 11, fontWeight: 600, color: UA.textMuted, cursor: "pointer", fontFamily: "inherit" }}>
                            Reassign
                          </button>
                        )}
                      </div>
                    ))}
                  </div>
                )}
              </Card>
            );
          })}

          {/* Unassigned students */}
          {unassigned.length > 0 && (
            <Card style={{ border: `1.5px solid ${UA.orangeBorder}`, background: UA.orangeBg }}>
              <div style={{ fontWeight: 800, fontSize: 14, color: UA.orange, marginBottom: 12 }}>Unassigned Students</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {unassigned.map(s => (
                  <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 14px", borderRadius: UA.radiusSm, background: "white", border: `1px solid ${UA.orangeBorder}` }}>
                    <Avatar initials={s.initials} size={32} color={UA.orange} />
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 13, fontWeight: 700, color: UA.text }}>{s.name}</div>
                      <div style={{ fontSize: 12, color: UA.textMuted }}>{s.sport} · {s.year}</div>
                    </div>
                    <select onChange={e => handleReassign(s.id, e.target.value)} defaultValue=""
                      style={{ padding: "6px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.navyBorder}`, fontSize: 12, fontFamily: "inherit", outline: "none", background: "white" }}>
                      <option value="" disabled>Assign to LS...</option>
                      {lsOnly.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
                    </select>
                  </div>
                ))}
              </div>
            </Card>
          )}
        </div>
      )}

      {/* BY SPORT TAB */}
      {activeTab === "sports" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
          <Card>
            <div style={{ fontWeight: 800, fontSize: 14, color: UA.text, marginBottom: 4 }}>Risk Distribution by Sport</div>
            <div style={{ fontSize: 12, color: UA.textMuted, marginBottom: 16 }}>High risk counts help identify which sports programs may need additional academic support resources</div>
            <ResponsiveContainer width="100%" height={220}>
              <BarChart data={sportRiskData}>
                <CartesianGrid strokeDasharray="3 3" stroke={UA.border} />
                <XAxis dataKey="sport" tick={{ fontSize: 11, fill: UA.textMuted }} axisLine={false} tickLine={false} />
                <YAxis tick={{ fontSize: 11, fill: UA.textMuted }} axisLine={false} tickLine={false} allowDecimals={false} />
                <Tooltip contentStyle={{ borderRadius: UA.radiusSm, border: `1px solid ${UA.border}` }} />
                <Legend wrapperStyle={{ fontSize: 12 }} />
                <Bar dataKey="high" fill={UA.red} radius={[4,4,0,0]} name="High Risk" stackId="a" />
                <Bar dataKey="medium" fill={UA.yellow} radius={[0,0,0,0]} name="Medium Risk" stackId="a" />
                <Bar dataKey="low" fill={UA.green} radius={[0,0,4,4]} name="Low Risk" stackId="a" />
              </BarChart>
            </ResponsiveContainer>
          </Card>

          {/* Sport breakdown table */}
          <Card>
            <div style={{ fontWeight: 800, fontSize: 14, color: UA.text, marginBottom: 14 }}>Sport Breakdown</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 80px 80px 80px 100px", gap: 0 }}>
              {["Sport", "Total", "High", "Medium", "Completion"].map((h, i) => (
                <div key={i} style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, textTransform: "uppercase", letterSpacing: "0.04em", padding: "6px 10px", borderBottom: `2px solid ${UA.border}`, textAlign: i > 0 ? "center" : "left" }}>{h}</div>
              ))}
              {Object.entries(sportRisk).map(([sport, data], i) => {
                const sportAssignments = ASSIGNMENTS.filter(a => {
                  const student = allStudents.find(s => s.sport === sport);
                  return student !== undefined;
                });
                const comp = sportAssignments.length > 0 ? Math.round((sportAssignments.filter(a=>a.status==="completed").length / sportAssignments.length)*100) : 0;
                const bg = i % 2 === 0 ? "white" : UA.bg;
                return [
                  <div key={`${sport}-name`} style={{ padding: "10px 10px", background: bg, borderBottom: `1px solid ${UA.border}`, fontSize: 13, fontWeight: 600, color: UA.text }}>{sport}</div>,
                  <div key={`${sport}-total`} style={{ padding: "10px 10px", background: bg, borderBottom: `1px solid ${UA.border}`, fontSize: 13, color: UA.text, textAlign: "center" }}>{data.total}</div>,
                  <div key={`${sport}-high`} style={{ padding: "10px 10px", background: bg, borderBottom: `1px solid ${UA.border}`, fontSize: 13, fontWeight: data.high > 0 ? 700 : 400, color: data.high > 0 ? UA.red : UA.textMuted, textAlign: "center" }}>{data.high}</div>,
                  <div key={`${sport}-med`} style={{ padding: "10px 10px", background: bg, borderBottom: `1px solid ${UA.border}`, fontSize: 13, fontWeight: data.medium > 0 ? 700 : 400, color: data.medium > 0 ? UA.yellow : UA.textMuted, textAlign: "center" }}>{data.medium}</div>,
                  <div key={`${sport}-comp`} style={{ padding: "10px 10px", background: bg, borderBottom: `1px solid ${UA.border}`, fontSize: 13, color: UA.navy, textAlign: "center", fontWeight: 600 }}>{comp}%</div>,
                ];
              })}
            </div>
          </Card>
        </div>
      )}

      {/* STAFF MANAGEMENT TAB */}
      {activeTab === "staff" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ fontSize: 13, color: UA.textMuted }}>{staff.length} staff members in the system</div>
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              {staffSaved && <span style={{ fontSize: 13, color: UA.green, fontWeight: 700 }}>✓ Staff member added</span>}
              <Btn size="sm" onClick={() => setShowAddStaff(!showAddStaff)}>{showAddStaff ? "✕ Cancel" : "+ Add Staff Member"}</Btn>
            </div>
          </div>

          {showAddStaff && (
            <Card style={{ border: `1.5px solid ${UA.navyBorder}`, background: UA.navyLight }}>
              <div style={{ fontWeight: 700, fontSize: 13, color: UA.navy, marginBottom: 12 }}>Add Staff Member</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
                <div><label style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 4 }}>Full Name *</label>
                  <input value={newStaff.name} onChange={e=>setNewStaff(p=>({...p,name:e.target.value}))} placeholder="e.g. Dr. Johnson" style={inputStyle} /></div>
                <div><label style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 4 }}>UA Email</label>
                  <input value={newStaff.email} onChange={e=>setNewStaff(p=>({...p,email:e.target.value}))} placeholder="netid@arizona.edu" style={inputStyle} /></div>
                <div><label style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 4 }}>Title</label>
                  <select value={newStaff.title} onChange={e=>setNewStaff(p=>({...p,title:e.target.value}))} style={{...inputStyle,background:"white"}}>
                    {["Learning Specialist","Academic Counselor","Athletic Coach","Administrator"].map(t=><option key={t}>{t}</option>)}
                  </select></div>
                <div><label style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 4 }}>Room / Office</label>
                  <input value={newStaff.room} onChange={e=>setNewStaff(p=>({...p,room:e.target.value}))} placeholder="e.g. ALS 201" style={inputStyle} /></div>
              </div>
              <Btn size="sm" onClick={handleAddStaff} disabled={!newStaff.name.trim()}>Add Staff Member</Btn>
            </Card>
          )}

          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {staff.map(s => (
              <Card key={s.id} style={{ padding: "16px 20px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                  <Avatar initials={s.initials} size={44} color={UA.navy} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 800, fontSize: 15, color: UA.text }}>{s.name}</div>
                    <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 2 }}>{s.title} · {s.email} · {s.room}</div>
                  </div>
                  <span style={{ fontSize: 12, padding: "3px 10px", borderRadius: 99, background: UA.greenBg, color: UA.green, fontWeight: 700, border: `1px solid ${UA.greenBorder}` }}>Active</span>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontSize: 18, fontWeight: 900, color: UA.navy }}>{s.students.length}</div>
                    <div style={{ fontSize: 11, color: UA.textMuted }}>students</div>
                  </div>
                </div>
              </Card>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// Standalone page with student selector + ability to add custom staff markers
function RiskMarkersPage({ onSelectStudent }) {
  const [selectedId, setSelectedId] = useState(STUDENTS[0].id);
  const [customMarkers, setCustomMarkers] = useState({
    1: [{ id: 1, author: "Dr. Martinez", date: "Mar 10, 2026", category: "Academic", text: "Reading comprehension deficit noted — ACT reading sub-score 17. Recommend extended time accommodation.", severity: "high" }],
    3: [{ id: 1, author: "Dr. Chen", date: "Feb 15, 2026", category: "Engagement", text: "Chronic avoidance pattern. Cancels sessions frequently. Needs structured accountability check-ins.", severity: "high" }],
  });
  const [newMarker, setNewMarker] = useState({ category: "Academic", severity: "medium", text: "" });
  const [markerSaved, setMarkerSaved] = useState(false);

  const student = STUDENTS.find(s => s.id === selectedId);

  const markerCategories = ["Academic", "Engagement", "Attendance", "Behavioral", "Personal", "Athletic", "Financial"];
  const severityConfig = {
    high: { label: "High", bg: UA.redLight, color: UA.red, border: UA.redBorder },
    medium: { label: "Medium", bg: UA.yellowBg, color: UA.yellow, border: UA.yellowBorder },
    low: { label: "Low", bg: UA.greenBg, color: UA.green, border: UA.greenBorder },
  };

  const handleAddMarker = () => {
    if (!newMarker.text.trim()) return;
    const marker = { id: Date.now(), author: "Dr. Martinez", date: new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }), ...newMarker };
    setCustomMarkers(prev => ({ ...prev, [selectedId]: [marker, ...(prev[selectedId] || [])] }));
    setNewMarker({ category: "Academic", severity: "medium", text: "" });
    setMarkerSaved(true);
    setTimeout(() => setMarkerSaved(false), 2500);
  };

  const autoFactors = [
    { label: `${student.missedAssignments} missing assignments`, active: student.missedAssignments > 0, severity: student.missedAssignments >= 2 ? "high" : "medium" },
    { label: `Last session ${student.lastSession}`, active: student.lastSession.includes("5") || student.lastSession.includes("6") || student.lastSession === "TBD - awaiting response", severity: "high" },
    { label: `Avg understanding ${student.avgUnderstanding}/5 — below threshold`, active: student.avgUnderstanding < 3, severity: student.avgUnderstanding < 2 ? "high" : "medium" },
    { label: `Avg effort ${student.avgEffort}/5 — below threshold`, active: student.avgEffort < 3, severity: student.avgEffort < 2 ? "high" : "medium" },
    { label: "High intake risk flagged at semester start", active: student.intakeRisk === "high", severity: "high" },
    { label: "Medium intake risk — monitor closely", active: student.intakeRisk === "medium", severity: "medium" },
  ].filter(f => f.active);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 22 }}>
      <SectionTitle sub="Review and manage risk flags across your caseload">Risk Markers</SectionTitle>

      {/* Student selector */}
      <Card style={{ padding: "16px 20px" }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 10 }}>Select Student</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {STUDENTS.map(s => {
            const selected = s.id === selectedId;
            const riskColor = s.dynamicRisk === "high" ? UA.red : s.dynamicRisk === "medium" ? UA.yellow : UA.green;
            return (
              <button key={s.id} onClick={() => setSelectedId(s.id)}
                style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 14px", borderRadius: 99, border: `1.5px solid ${selected ? UA.navy : UA.border}`, background: selected ? UA.navy : "white", cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s" }}>
                <Avatar initials={s.initials} size={24} color={selected ? "white" : riskColor} />
                <span style={{ fontSize: 13, fontWeight: 700, color: selected ? "white" : UA.text }}>{s.name.split(" ")[0]}</span>
                <span style={{ width: 8, height: 8, borderRadius: "50%", background: riskColor, flexShrink: 0 }} />
              </button>
            );
          })}
        </div>
      </Card>

      {/* Selected student header */}
      <div style={{ display: "flex", alignItems: "center", gap: 14, padding: "16px 20px", background: UA.navyLight, border: `1.5px solid ${UA.navyBorder}`, borderRadius: UA.radius }}>
        <Avatar initials={student.initials} size={44} color={student.dynamicRisk === "high" ? UA.red : student.dynamicRisk === "medium" ? UA.yellow : UA.navy} />
        <div style={{ flex: 1 }}>
          <div style={{ fontWeight: 900, fontSize: 16, color: UA.text }}>{student.name}</div>
          <div style={{ fontSize: 12, color: UA.textMuted, marginTop: 2 }}>{student.sport} · {student.year} · GPA {student.gpa}</div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <div style={{ textAlign: "center", padding: "6px 14px", borderRadius: UA.radiusSm, background: "white", border: `1px solid ${UA.navyBorder}` }}>
            <div style={{ fontSize: 10, color: UA.textMuted, fontWeight: 600, textTransform: "uppercase" }}>Intake</div>
            <RiskBadge level={student.intakeRisk} />
          </div>
          <div style={{ textAlign: "center", padding: "6px 14px", borderRadius: UA.radiusSm, background: "white", border: `1px solid ${UA.navyBorder}` }}>
            <div style={{ fontSize: 10, color: UA.textMuted, fontWeight: 600, textTransform: "uppercase", marginBottom: 4 }}>Current</div>
            <RiskBadge level={student.dynamicRisk} score={student.riskScore} />
          </div>
        </div>
        <button onClick={() => onSelectStudent(student)} style={{ padding: "8px 16px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.navyBorder}`, background: "white", color: UA.navy, fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>
          View Full Profile →
        </button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18 }}>
        {/* Auto-calculated risk factors */}
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div style={{ fontWeight: 800, fontSize: 14, color: UA.text }}>Auto-Calculated Risk Factors</div>
          <div style={{ fontSize: 12, color: UA.textMuted }}>Generated from assignment data, session logs, and engagement ratings</div>
          {autoFactors.length === 0 ? (
            <Card style={{ background: UA.greenBg, border: `1px solid ${UA.greenBorder}` }}>
              <div style={{ fontSize: 13, color: UA.green, fontWeight: 700 }}>✓ No active risk factors for this student</div>
            </Card>
          ) : autoFactors.map((f, i) => {
            const sc = severityConfig[f.severity];
            return (
              <div key={i} style={{ display: "flex", alignItems: "flex-start", gap: 12, padding: "12px 16px", borderRadius: UA.radiusSm, background: sc.bg, border: `1px solid ${sc.border}` }}>
                <span style={{ width: 20, height: 20, borderRadius: "50%", background: sc.color, color: "white", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 800, flexShrink: 0, marginTop: 1 }}>!</span>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: UA.text }}>{f.label}</div>
                  <span style={{ fontSize: 11, fontWeight: 700, color: sc.color }}>{sc.label} severity</span>
                </div>
              </div>
            );
          })}

          {/* Intervention checklist */}
          <Card style={{ marginTop: 4 }}>
            <div style={{ fontWeight: 800, fontSize: 13, color: UA.text, marginBottom: 12 }}>Recommended Interventions</div>
            {["Schedule additional LS session this week", "Tutoring referral — identify lowest-rated course", "Email outreach to student", "Notify academic advisor", "Contact coach liaison"].map((item, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 12px", borderRadius: UA.radiusSm, background: UA.bg, border: `1px solid ${UA.border}`, marginBottom: 6, fontSize: 13, color: UA.text }}>
                <input type="checkbox" style={{ accentColor: UA.red, width: 15, height: 15, cursor: "pointer" }} />
                {item}
              </div>
            ))}
          </Card>
        </div>

        {/* Staff-added custom markers */}
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div style={{ fontWeight: 800, fontSize: 14, color: UA.text }}>Staff Risk Markers</div>
          <div style={{ fontSize: 12, color: UA.textMuted }}>Add your own clinical observations and risk flags</div>

          {/* Add marker form */}
          <Card>
            <div style={{ fontWeight: 700, fontSize: 13, color: UA.text, marginBottom: 12 }}>+ Add Marker</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
              <select value={newMarker.category} onChange={e => setNewMarker(p => ({ ...p, category: e.target.value }))}
                style={{ padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none", background: "white" }}>
                {markerCategories.map(c => <option key={c}>{c}</option>)}
              </select>
              <select value={newMarker.severity} onChange={e => setNewMarker(p => ({ ...p, severity: e.target.value }))}
                style={{ padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none", background: "white" }}>
                <option value="high">High Severity</option>
                <option value="medium">Medium Severity</option>
                <option value="low">Low Severity</option>
              </select>
            </div>
            <textarea value={newMarker.text} onChange={e => setNewMarker(p => ({ ...p, text: e.target.value }))}
              placeholder="Describe the risk factor or clinical observation..." rows={3}
              style={{ width: "100%", padding: "9px 12px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", resize: "none", outline: "none", boxSizing: "border-box", lineHeight: 1.6, marginBottom: 10 }}
              onFocus={e => e.target.style.borderColor = UA.navy} onBlur={e => e.target.style.borderColor = UA.border} />
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <Btn size="sm" onClick={handleAddMarker} disabled={!newMarker.text.trim()}>Add Marker</Btn>
              {markerSaved && <span style={{ fontSize: 12, color: UA.green, fontWeight: 700 }}>✓ Marker added</span>}
            </div>
          </Card>

          {/* Existing custom markers */}
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {(customMarkers[selectedId] || []).map(marker => {
              const sc = severityConfig[marker.severity] || severityConfig.medium;
              return (
                <div key={marker.id} style={{ background: UA.bgCard, border: `1px solid ${UA.border}`, borderRadius: UA.radius, padding: "14px 18px", borderLeft: `4px solid ${sc.color}` }}>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
                    <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                      <span style={{ fontSize: 11, fontWeight: 700, padding: "2px 8px", borderRadius: 99, background: sc.bg, color: sc.color, border: `1px solid ${sc.border}` }}>{marker.category}</span>
                      <span style={{ fontSize: 11, fontWeight: 700, color: sc.color }}>{sc.label}</span>
                    </div>
                    <div style={{ fontSize: 11, color: UA.textMuted }}>{marker.author} · {marker.date}</div>
                  </div>
                  <p style={{ fontSize: 13, color: UA.textSecondary, lineHeight: 1.7, margin: 0 }}>{marker.text}</p>
                </div>
              );
            })}
            {!(customMarkers[selectedId] || []).length && (
              <div style={{ textAlign: "center", padding: "24px 0", color: UA.textMuted, fontSize: 13 }}>No staff markers added yet</div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// Assignment entry for staff — manual quick-add, ICS/D2L import, and sync status
function EntryHubPage({ onAddAssignment }) {
  const [selectedStudentId, setSelectedStudentId] = useState(STUDENTS[0].id);
  const [rows, setRows] = useState([{ title: "", courseCode: "", dueDate: "", points: "" }]);
  const [saved, setSaved] = useState(false);
  const [icsUrl, setIcsUrl] = useState("");
  const [icsStatus, setIcsStatus] = useState(null);
  const [importing, setImporting] = useState(false);
  const [importedCount, setImportedCount] = useState(0);

  const student = STUDENTS.find(s => s.id === selectedStudentId);

  const updateRow = (i, k, v) => setRows(prev => prev.map((r, idx) => idx === i ? { ...r, [k]: v } : r));
  const addRow = () => setRows(prev => [...prev, { title: "", courseCode: "", dueDate: "", points: "" }]);
  const removeRow = (i) => setRows(prev => prev.filter((_, idx) => idx !== i));

  const handleSaveRows = () => {
    const valid = rows.filter(r => r.title.trim() && r.dueDate);
    if (!valid.length) return;
    valid.forEach(r => {
      const days = (new Date(r.dueDate) - Date.now()) / 86400000;
      const urgency = days < 3 ? "red" : days < 7 ? "yellow" : "green";
      const course = student.courses?.find(c => c.code === r.courseCode);
      onAddAssignment({
        id: Date.now() + Math.random(),
        title: r.title,
        course: course?.name || r.courseCode || "Other",
        courseCode: r.courseCode,
        dueDate: new Date(r.dueDate),
        points: parseInt(r.points) || 0,
        status: "not_started", urgency,
        description: "", instructions: "", rubric: "", d2lLink: "",
      });
    });
    setRows([{ title: "", courseCode: "", dueDate: "", points: "" }]);
    setSaved(true);
    setTimeout(() => setSaved(false), 2500);
  };

  // Simulates parsing a D2L ICS calendar feed and importing assignments
  const handleICSImport = () => {
    if (!icsUrl.trim()) return;
    setImporting(true);
    setIcsStatus(null);
    // Simulate async fetch + parse of ICS feed
    setTimeout(() => {
      const mockImported = [
        { title: "SPAN 304 VHL Assignment", courseCode: "SPAN304", dueDate: new Date(Date.now() + 3*86400000) },
        { title: "RELI 150 Discussion Post", courseCode: "RELI150", dueDate: new Date(Date.now() + 5*86400000) },
        { title: "SPAN 102 Intro Video", courseCode: "SPAN102", dueDate: new Date(Date.now() + 2*86400000) },
      ];
      mockImported.forEach(a => {
        const days = (a.dueDate - Date.now()) / 86400000;
        onAddAssignment({
          id: Date.now() + Math.random(),
          title: a.title, course: a.courseCode, courseCode: a.courseCode,
          dueDate: a.dueDate, points: 0, status: "not_started",
          urgency: days < 3 ? "red" : days < 7 ? "yellow" : "green",
          description: "", instructions: "", rubric: "", d2lLink: "",
        });
      });
      setImportedCount(mockImported.length);
      setIcsStatus("success");
      setImporting(false);
      setIcsUrl("");
    }, 1800);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 22 }}>
      <SectionTitle sub="Manually enter assignments or import from D2L — until automatic sync is live">Entry Hub</SectionTitle>

      {/* Student selector */}
      <Card style={{ padding: "16px 20px" }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 10 }}>Entering assignments for</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {STUDENTS.map(s => (
            <button key={s.id} onClick={() => setSelectedStudentId(s.id)}
              style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 14px", borderRadius: 99, border: `1.5px solid ${selectedStudentId === s.id ? UA.navy : UA.border}`, background: selectedStudentId === s.id ? UA.navy : "white", cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s" }}>
              <Avatar initials={s.initials} size={22} color={selectedStudentId === s.id ? "white" : UA.navy} />
              <span style={{ fontSize: 13, fontWeight: 700, color: selectedStudentId === s.id ? "white" : UA.text }}>{s.name.split(" ")[0]}</span>
            </button>
          ))}
        </div>
      </Card>

      {/* D2L ICS Import */}
      <Card style={{ border: `1.5px solid ${UA.navyBorder}`, background: UA.navyLight }}>
        <div style={{ fontWeight: 800, fontSize: 14, color: UA.navy, marginBottom: 4 }}>🔗 Import from D2L Calendar</div>
        <div style={{ fontSize: 12, color: UA.textMuted, marginBottom: 14, lineHeight: 1.6 }}>
          Paste a D2L calendar feed URL (ICS format) to import assignments automatically. In D2L: Calendar → Subscribe → Copy feed URL.
          Once IT connects the full sync this will happen automatically every 6 hours.
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr auto", gap: 10, marginBottom: 10 }}>
          <input value={icsUrl} onChange={e => setIcsUrl(e.target.value)}
            placeholder="https://d2l.arizona.edu/d2l/le/calendar/ics/..."
            style={{ padding: "9px 12px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.navyBorder}`, fontSize: 13, fontFamily: "inherit", outline: "none", background: "white" }} />
          <Btn variant="navy" onClick={handleICSImport} disabled={!icsUrl.trim() || importing}>
            {importing ? "⏳ Importing..." : "Import →"}
          </Btn>
        </div>
        {icsStatus === "success" && (
          <div style={{ fontSize: 13, color: UA.green, fontWeight: 700 }}>✓ {importedCount} assignments imported from D2L calendar</div>
        )}
        <div style={{ marginTop: 12, padding: "10px 14px", borderRadius: UA.radiusSm, background: "rgba(0,51,102,0.06)", fontSize: 12, color: UA.navy, lineHeight: 1.6 }}>
          <strong>D2L Sync Status:</strong> Not yet connected — IT is working on the CATSCloud integration.
          Manual entry and ICS import are available in the meantime.
        </div>
      </Card>

      {/* Quick add table */}
      <Card>
        <div style={{ fontWeight: 800, fontSize: 14, color: UA.text, marginBottom: 4 }}>⚡ Quick Add for {student?.name.split(" ")[0]}</div>
        <div style={{ fontSize: 12, color: UA.textMuted, marginBottom: 14 }}>Add multiple assignments at once — one row per assignment</div>
        <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr 80px 32px", gap: 8, marginBottom: 6 }}>
          {["Assignment Title", "Course", "Due Date", "Points", ""].map((h, i) => (
            <div key={i} style={{ fontSize: 11, fontWeight: 700, color: UA.textMuted, textTransform: "uppercase", letterSpacing: "0.04em" }}>{h}</div>
          ))}
        </div>
        {rows.map((row, i) => (
          <div key={i} style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr 80px 32px", gap: 8, marginBottom: 8 }}>
            <input value={row.title} onChange={e => updateRow(i, "title", e.target.value)} placeholder="Assignment title..."
              style={{ padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none" }}
              onFocus={e => e.target.style.borderColor = UA.navy} onBlur={e => e.target.style.borderColor = UA.border} />
            <select value={row.courseCode} onChange={e => updateRow(i, "courseCode", e.target.value)}
              style={{ padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none", background: "white" }}>
              <option value="">Course...</option>
              {(student?.courses || []).map(c => <option key={c.code} value={c.code}>{c.code}</option>)}
            </select>
            <input type="date" value={row.dueDate} onChange={e => updateRow(i, "dueDate", e.target.value)}
              style={{ padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none" }} />
            <input type="number" value={row.points} onChange={e => updateRow(i, "points", e.target.value)} placeholder="pts"
              style={{ padding: "8px 10px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none" }} />
            <button onClick={() => removeRow(i)} disabled={rows.length === 1}
              style={{ padding: "8px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, background: "white", cursor: rows.length === 1 ? "not-allowed" : "pointer", color: UA.textMuted, fontSize: 14, opacity: rows.length === 1 ? 0.3 : 1 }}>✕</button>
          </div>
        ))}
        <div style={{ display: "flex", gap: 10, marginTop: 10 }}>
          <Btn variant="ghost" size="sm" onClick={addRow}>+ Add Row</Btn>
          <Btn size="sm" onClick={handleSaveRows}>Save All</Btn>
          {saved && <span style={{ fontSize: 13, color: UA.green, fontWeight: 700, alignSelf: "center" }}>✓ Assignments added</span>}
        </div>
      </Card>
    </div>
  );
}

// Manual assignment entry form — used until D2L sync is live.
function AddAssignmentModal({ onClose, onAdd }) {
  const [form, setForm] = useState({
    title: "", course: "", courseCode: "", dueDate: "", points: "",
    description: "", instructions: "", rubric: "", status: "not_started",
  });
  const [errors, setErrors] = useState({});

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const validate = () => {
    const e = {};
    if (!form.title.trim()) e.title = "Required";
    if (!form.course.trim()) e.course = "Required";
    if (!form.dueDate) e.dueDate = "Required";
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const handleSubmit = () => {
    if (!validate()) return;
    const urgency = (() => {
      const days = (new Date(form.dueDate) - Date.now()) / 86400000;
      if (days < 3) return "red";
      if (days < 7) return "yellow";
      return "green";
    })();
    onAdd({
      id: Date.now(),
      ...form,
      points: parseInt(form.points) || 0,
      dueDate: new Date(form.dueDate),
      urgency,
      d2lLink: "",
    });
    onClose();
  };

  const Field = ({ label, k, type = "text", placeholder = "", required, rows }) => (
    <div style={{ marginBottom: 14 }}>
      <label style={{ fontSize: 12, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 5 }}>
        {label}{required && <span style={{ color: UA.red }}> *</span>}
      </label>
      {rows ? (
        <textarea value={form[k]} onChange={e => set(k, e.target.value)} placeholder={placeholder} rows={rows}
          style={{ width: "100%", padding: "9px 12px", borderRadius: UA.radiusSm, border: `1.5px solid ${errors[k] ? UA.red : UA.border}`, fontSize: 13, fontFamily: "inherit", resize: "vertical", outline: "none", boxSizing: "border-box" }} />
      ) : (
        <input type={type} value={form[k]} onChange={e => set(k, e.target.value)} placeholder={placeholder}
          style={{ width: "100%", padding: "9px 12px", borderRadius: UA.radiusSm, border: `1.5px solid ${errors[k] ? UA.red : UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none", boxSizing: "border-box" }} />
      )}
      {errors[k] && <div style={{ fontSize: 11, color: UA.red, marginTop: 3 }}>{errors[k]}</div>}
    </div>
  );

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <div style={{ background: "white", borderRadius: UA.radius, width: "100%", maxWidth: 560, maxHeight: "90vh", overflow: "auto", boxShadow: UA.shadowMd }}>
        <div style={{ padding: "20px 24px", borderBottom: `1px solid ${UA.border}`, display: "flex", justifyContent: "space-between", alignItems: "center", position: "sticky", top: 0, background: "white", zIndex: 1 }}>
          <div style={{ fontWeight: 800, fontSize: 16, color: UA.text }}>Add Assignment</div>
          <button onClick={onClose} style={{ background: "none", border: "none", fontSize: 20, cursor: "pointer", color: UA.textMuted }}>✕</button>
        </div>
        <div style={{ padding: "20px 24px" }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 16px" }}>
            <div style={{ gridColumn: "1 / -1" }}><Field label="Assignment Title" k="title" placeholder="e.g. Essay: The Great Gatsby" required /></div>
            <Field label="Course Name" k="course" placeholder="e.g. English 201" required />
            <Field label="Course Code" k="courseCode" placeholder="e.g. ENG201" />
            <Field label="Due Date" k="dueDate" type="date" required />
            <Field label="Points" k="points" type="number" placeholder="e.g. 100" />
          </div>
          <Field label="Description" k="description" placeholder="Brief overview of the assignment..." rows={2} />
          <Field label="Instructions" k="instructions" placeholder="What specifically does the student need to do?" rows={3} />
          <Field label="Rubric" k="rubric" placeholder="e.g. Thesis (25pts) · Analysis (30pts) · Citations (25pts) · Grammar (20pts)" rows={2} />
          <div style={{ marginBottom: 14 }}>
            <label style={{ fontSize: 12, fontWeight: 700, color: UA.textMuted, display: "block", marginBottom: 5 }}>Status</label>
            <select value={form.status} onChange={e => set("status", e.target.value)} style={{ width: "100%", padding: "9px 12px", borderRadius: UA.radiusSm, border: `1.5px solid ${UA.border}`, fontSize: 13, fontFamily: "inherit", outline: "none" }}>
              <option value="not_started">Not Started</option>
              <option value="in_progress">In Progress</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <div style={{ display: "flex", gap: 10, marginTop: 20 }}>
            <Btn variant="outline" fullWidth onClick={onClose}>Cancel</Btn>
            <Btn fullWidth onClick={handleSubmit}>Add Assignment</Btn>
          </div>
        </div>
      </div>
    </div>
  );
}

  const html = `
    <!DOCTYPE html><html><head><title>CATS Report — ${student.name}</title>
    <style>
      body { font-family: Arial, sans-serif; color: #0F1623; padding: 40px; max-width: 720px; margin: 0 auto; }
      .header { border-bottom: 3px solid #CC0033; padding-bottom: 16px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-end; }
      .logo { font-size: 22px; font-weight: 900; color: #003366; }
      .logo span { color: #CC0033; }
      .date { font-size: 12px; color: #8890A8; }

      .metric { background: #F8F9FB; padding: 12px 16px; border-radius: 8px; }
      .metric-label { font-size: 11px; color: #8890A8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
      .metric-value { font-size: 22px; font-weight: 900; }
      .note { border-left: 3px solid #003366; padding: 10px 14px; margin-bottom: 10px; background: #F8F9FB; border-radius: 0 8px 8px 0; }
      .note-meta { font-size: 11px; color: #8890A8; margin-bottom: 4px; }
      .note-text { font-size: 13px; line-height: 1.6; }
      .assignment { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #E8EAF0; font-size: 13px; }
      .footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid #E8EAF0; font-size: 11px; color: #8890A8; text-align: center; }
      @media print { body { padding: 20px; } }
    </style></head><body>
    <div class="header">
      <div><div class="logo"><span>A</span> CATS Academic Companion</div><div style="font-size:13px;color:#4A5068;margin-top:4px;">University of Arizona — Academic Support Report</div></div>
      <div class="date">Generated ${now}</div>
    </div>

    <div style="display:flex;align-items:center;gap:16px;margin-bottom:8px;">
      <div style="width:52px;height:52px;border-radius:50%;background:#003366;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:white;">${student.initials}</div>
      <div>
        <div style="font-size:22px;font-weight:900;">${student.name}</div>
        <div style="font-size:13px;color:#4A5068;">${student.sport} · ${student.year} · GPA ${student.gpa} · Counselor: ${student.counselor}</div>
      </div>
      <div style="margin-left:auto;"><span class="badge" style="background:${riskColor}22;color:${riskColor};border:1px solid ${riskColor}44;">${student.dynamicRisk.toUpperCase()} RISK · ${student.riskScore}</span></div>
    </div>

    <h2>Academic Metrics</h2>
    <div class="grid">
      <div class="metric"><div class="metric-label">Avg Effort</div><div class="metric-value" style="color:${student.avgEffort>=3.5?"#16A34A":"#CC0033"}">${student.avgEffort}/5</div></div>
      <div class="metric"><div class="metric-label">Avg Understanding</div><div class="metric-value" style="color:${student.avgUnderstanding>=3?"#16A34A":"#CC0033"}">${student.avgUnderstanding}/5</div></div>
      <div class="metric"><div class="metric-label">Total Study Hours</div><div class="metric-value" style="color:#003366">${student.totalHours}h</div></div>

        </div>
        <div style={{ padding: "36px 36px 28px" }}>
          <div style={{ width: 64, height: 64, borderRadius: 16, background: "#EEF2F8", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 32, marginBottom: 20 }}>{current.icon}</div>

          <div style={{ display: "flex", gap: 6, marginBottom: 24 }}>
            {ONBOARDING_STEPS.map((_, i) => (
              <div key={i} style={{ width: i === step ? 20 : 6, height: 6, borderRadius: 99, background: i === step ? "#CC0033" : "#E8EAF0", transition: "all 0.3s" }} />
            ))}
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            {step > 0 && <Btn variant="outline" onClick={() => setStep(s => s - 1)}>Back</Btn>}
            <Btn fullWidth onClick={() => isLast ? onDone() : setStep(s => s + 1)}>
              {isLast ? "Get Started →" : "Next →"}
            </Btn>
          </div>
        </div>
      </div>
    </div>
  );
}

  const [profile,setProfile]=useState(null);
  const [authLoading,setAuthLoading]=useState(true);
  const [backendStatus,setBackendStatus]=useState({studentsMode:"demo",studentsMessage:"Connecting..."});
  const [dataVersion,setDataVersion]=useState(0);
  const [role,setRole]=useState(null);
  const [page,setPage]=useState("dashboard");
  const [collapsed,setCollapsed]=useState(false);
  const [workAssignment,setWorkAssignment]=useState(null);
  const [selectedStudent,setSelectedStudent]=useState(null);
  const [showOnboarding,setShowOnboarding]=useState(false);
  const [globalNotes,setGlobalNotes]=useState(STAFF_NOTES);
  const [globalNotesFeed,setGlobalNotesFeed]=useState(ALL_NOTES_FEED);
  const [notifications,setNotifications]=useState([
    {id:1,icon:"⚠️",message:"Alex Rivera's risk score moved to High — 2 missing assignments",time:"2 hours ago",read:false},
    {id:2,icon:"📝",message:"Marcus Williams has not logged a session in 6 days",time:"Yesterday",read:false},
    {id:3,icon:"✅",message:"Jordan Kim completed all assignments this week",time:"2 days ago",read:true},
  ]);
  const [assignments,setAssignments]=useState(ASSIGNMENTS);
  const isMobile=useIsMobile();

  const currentUser=profile
    ?{name:profile.full_name||deriveDisplayNameFromEmail(profile.email||""),initials:profile.initials||initialsFromName(profile.full_name||"")}
    :{name:deriveDisplayNameFromEmail(sessionUser?.email||""),initials:initialsFromName(deriveDisplayNameFromEmail(sessionUser?.email||""))};

  const applyRoleRouting=(r)=>{setRole(r);localStorage.setItem("cats_role",r);if(r==="student"){setPage("dashboard");setShowOnboarding(true);}else if(r==="admin")setPage("admin");else setPage("roster");};

  const hydrateAuthenticatedState=async(user)=>{
    if(!user){setSessionUser(null);setProfile(null);setRole(null);setAuthLoading(false);return;}
    setAuthLoading(true);setSessionUser(user);
    const fallbackName=deriveDisplayNameFromEmail(user.email||"");
    const fallbackRole=normalizeRole(localStorage.getItem("cats_role")||"staff");
    let rp={id:user.id,email:user.email||"",full_name:fallbackName,role:fallbackRole,initials:initialsFromName(fallbackName)};
    try{const pr=await Promise.race([fetchProfileForUser(user.id),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),5000))]);
      if(!pr.error&&pr.data){rp={...rp,...pr.data,full_name:pr.data.full_name||rp.full_name,role:normalizeRole(pr.data.role||rp.role)};}}catch(e){console.warn("Profile timeout");}
    rp.initials=initialsFromName(rp.full_name||fallbackName);
    setProfile(rp);applyRoleRouting(normalizeRole(rp.role));
    try{const sr=await Promise.race([supabase.from("students").select("*"),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),6000))]);
      if(!sr.error&&sr.data?.length){STUDENTS=sr.data.map(normalizeStudentRecord);setBackendStatus({studentsMode:"live",studentsMessage:`${sr.data.length} live students loaded.`});setDataVersion(v=>v+1);}
      else setBackendStatus({studentsMode:"demo",studentsMessage:"Using demo roster — add students in Supabase."});}
    catch(e){setBackendStatus({studentsMode:"demo",studentsMessage:"Students timed out — using demo roster."});}
    try{const la=await Promise.race([fetchAllAssignments(),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),6000))]);
      if(la?.length){setAssignments(la);console.log(`✅ ${la.length} assignments from Supabase`);}}
    catch(e){console.warn("Assignments timed out");}
    setAuthLoading(false);
  };

  useEffect(()=>{
    fetchSessionUser().then(u=>hydrateAuthenticatedState(u));
    const{data:l}=supabase.auth.onAuthStateChange((_,s)=>hydrateAuthenticatedState(s?.user||null));
    return()=>l?.subscription?.unsubscribe?.();
  },[]);

  const addNote=(studentId,note)=>{
    setGlobalNotes(prev=>({...prev,[studentId]:[note,...(prev[studentId]||[])]}));
    const student=STUDENTS.find(s=>s.id===studentId);
    setGlobalNotesFeed(prev=>[{id:note.id,studentId,studentName:student?.name||"Unknown",studentInitials:student?.initials||"?",studentRisk:student?.dynamicRisk||"low",author:note.author,authorInitials:note.authorInitials,date:note.date,category:note.category,text:note.text},...prev]);
  };

  const navigate=(target,data)=>{
    if(target==="workmode")setWorkAssignment(data);
    if(target==="studentProfile"){setSelectedStudent(data);setPage("studentProfile");return;}
    setPage(target);window.scrollTo(0,0);
  };

  const pushNotification=(message,icon="🔔")=>setNotifications(prev=>[{id:Date.now(),icon,message,time:"Just now",read:false},...prev]);

  if(authLoading)return(<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:UA.bg,fontFamily:"'DM Sans',system-ui,sans-serif"}}><div style={{textAlign:"center",padding:40}}><div style={{fontSize:32,marginBottom:16}}>🐱</div><div style={{fontSize:16,fontWeight:800,color:UA.text,marginBottom:8}}>Connecting to CATS Academic</div><div style={{fontSize:14,color:UA.textMuted}}>Loading your profile and student records...</div></div></div>);

  if(!sessionUser)return <SupabaseAuthPage onSignedIn={u=>hydrateAuthenticatedState(u)}/>;

  if(page==="workmode")return(<div style={{fontFamily:"'DM Sans',system-ui,sans-serif"}}><WorkModePage assignment={workAssignment} onBack={()=>setPage("assignments")} onSessionSaved={(data)=>{if(data.understanding<=2)pushNotification(`${currentUser.name} rated understanding ${data.understanding}/5 on "${data.title}" — may need support`,"⚠️");}} onNeedSupport={(title)=>{pushNotification(`🙋 ${currentUser.name} is requesting support on "${title}"`,"🙋");}}/></div>);

  const addAssignment=async(a)=>{
    const studentId=a.studentId||selectedStudent?.id||null;
    const userId=sessionUser?.id||null;
    const tempId=`temp-${Date.now()}`;
    setAssignments(prev=>[...prev,{...a,id:tempId}]);
    pushNotification(`Assignment added: "${a.title}"`,"📚");
    if(studentId&&typeof studentId==="string"&&studentId.includes("-")){
      const saved=await insertAssignment(a,studentId,userId);
      if(saved)setAssignments(prev=>prev.map(x=>x.id===tempId?{...a,id:saved.id}:x));
    }
  };

  const backendBanner=backendStatus.studentsMode==="live"?null:(<div style={{margin:"0 0 12px",padding:"8px 14px",borderRadius:UA.radiusSm,background:UA.yellowBg,border:`1px solid ${UA.yellowBorder}`,fontSize:12,color:UA.textSecondary}}><strong style={{color:UA.yellow}}>Demo mode</strong> — {backendStatus.studentsMessage}</div>);

  const renderPage = () => {
    if (page === "admin") return <AdminPage />;
    if (role === "coach") return <CoachPage />;
    if (page === "roster") return <RosterPage onSelectStudent={s => { setSelectedStudent(s); setPage("studentProfile"); }} />;
    if (page === "studentProfile" && selectedStudent) return (
      <StudentProfile
        student={selectedStudent}
        onBack={() => setPage("roster")}
        notes={globalNotes[selectedStudent.id] || []}
        onAddNote={(note) => addNote(selectedStudent.id, note)}
        onExportReport={(student, notes) => exportStudentReport(student, notes, assignments)}
      />
    );
    if (page === "entryhub") return <EntryHubPage onAddAssignment={addAssignment} />;
    if (page === "analytics" && role !== "student") return <ProgressReportPage onSelectStudent={s => { setSelectedStudent(s); setPage("studentProfile"); }} />;
    if (page === "analytics" && role === "student") return <AnalyticsPage role={role} assignments={assignments} />;
    if (page === "settings") return <SettingsPage role={role} />;
    if (page === "notes") return <GlobalNotesFeed notes={globalNotesFeed} />;
    if (page === "risk") return <RiskMarkersPage onSelectStudent={s => { setSelectedStudent(s); setPage("studentProfile"); }} />;
    if (page === "assignments") return <AssignmentsPage onNavigate={navigate} assignments={assignments} onAddAssignment={addAssignment} />;
    if (page === "dashboard" && role !== "student") return <StaffDashboard onSelectStudent={s => { setSelectedStudent(s); setPage("studentProfile"); }} onAddNote={addNote} />;
    return role === "student"
      ? <StudentDashboard onNavigate={navigate} assignments={assignments} user={currentUser} />
      : <StaffDashboard onSelectStudent={s => { setSelectedStudent(s); setPage("studentProfile"); }} onAddNote={addNote} />;
  };

  const mobileNav = role === "student"
    ? [{ id: "dashboard", icon: "⊞", label: "Home" }, { id: "assignments", icon: "📚", label: "Tasks" }, { id: "analytics", icon: "📊", label: "Progress" }, { id: "settings", icon: "⚙", label: "Settings" }]
    : role === "admin"
    ? [{ id: "admin", icon: "⚙️", label: "Admin" }, { id: "roster", icon: "👥", label: "Students" }, { id: "analytics", icon: "📊", label: "Reports" }, { id: "settings", icon: "⚙", label: "Settings" }]
    : [{ id: "roster", icon: "👥", label: "Roster" }, { id: "dashboard", icon: "⊞", label: "Schedule" }, { id: "analytics", icon: "📊", label: "Reports" }, { id: "notes", icon: "📝", label: "Notes" }];

  return (
    <div style={{ fontFamily: "'DM Sans', system-ui, sans-serif", background: "#F8F9FB", minHeight: "100vh", display: "flex", flexDirection: isMobile ? "column" : "row" }}>
      {showOnboarding && <OnboardingModal onDone={() => setShowOnboarding(false)} />}
      {!isMobile && <Sidebar role={role} activePage={page} onNavigate={p => setPage(p)} user={currentUser} onLogout={async()=>{await signOutUser();setSessionUser(null);setProfile(null);setRole(null);setPage("dashboard");}} collapsed={collapsed} setCollapsed={setCollapsed} />}
      <div style={{ flex: 1, overflow: "auto", paddingBottom: isMobile ? 64 : 0 }}>
        <div style={{ height: isMobile ? 56 : 52, borderBottom: "1px solid #E8EAF0", background: "white", display: "flex", alignItems: "center", justifyContent: isMobile ? "space-between" : "flex-end", padding: isMobile ? "0 16px" : "0 28px", position: "sticky", top: 0, zIndex: 50, boxShadow: "0 1px 4px rgba(0,0,0,0.04)" }}>
          {isMobile && (
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ width: 28, height: 28, borderRadius: 8, background: "#CC0033", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, fontWeight: 900, color: "white" }}>A</div>
              <span style={{ fontSize: 14, fontWeight: 800, color: "#003366" }}>CATS Academic</span>
            </div>
          )}
          <NotificationBell notifications={notifications} onClear={() => setNotifications(prev => prev.map(n => ({ ...n, read: true })))} />
        </div>
        <div style={{ maxWidth: 1060, margin: "0 auto", padding: isMobile ? "16px 14px" : "28px 28px" }}>
          {role!=="student"&&backendBanner}
          {renderPage()}
        </div>
      </div>
      {isMobile && (
        <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, height: 64, background: "#003366", display: "flex", alignItems: "stretch", zIndex: 100, borderTop: "1px solid rgba(255,255,255,0.1)" }}>
          {mobileNav.map(item => {
            const active = page === item.id;
            return (
              <button key={item.id} onClick={() => setPage(item.id)}
                style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 3, background: "none", border: "none", cursor: "pointer", color: active ? "white" : "rgba(255,255,255,0.45)", fontFamily: "inherit" }}>
                <span style={{ fontSize: 20 }}>{item.icon}</span>
                <span style={{ fontSize: 10, fontWeight: active ? 800 : 500 }}>{item.label}</span>
              </button>
            );
          })}
          <button onClick={async()=>{await signOutUser();setSessionUser(null);setProfile(null);setRole(null);setPage("dashboard");}}
            style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 3, background: "none", border: "none", cursor: "pointer", color: "rgba(255,255,255,0.45)", fontFamily: "inherit" }}>
            <span style={{ fontSize: 20 }}>👤</span>
            <span style={{ fontSize: 10 }}>Sign Out</span>
          </button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));

</script>
</body>
</html>
